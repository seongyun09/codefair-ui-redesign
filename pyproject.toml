[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-store-uploader"
version = "1.0.0"
description = "Minimal OpenAI Vector Store file upload website"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "openai>=1.109,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: opt-in tests that call external services",
  "openai: tests that call the OpenAI API",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurance_rag = ["prompts/*.txt"]
