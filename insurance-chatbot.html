할 때 약관에서 규정하는 “특정질병으로 분류되는 질병”이 아닌 경우\n에는 약관에서 규정하는 “특정질병으로 분류되는 질병”으로 보지 않습니다.\n반대로 피보험자가 제8차 개정 한국표준질병ㆍ사인분류를 적용할 때, 약관에서 규정하는 “특정질\n병으로 분류되는 질병”으로 진단될 수 없었다고 하더라도 진단 당시에 시행 중인 제9차 개정 이\n후 한국표준질병ㆍ사인분류를 적용할 때 약관에서 규정하는 “특정질병으로 분류되는 질병”인 경\n우에는 약관에서 규정하는 “특정질병으로 분류되는 질병”으로 봅니다.\n② 진단시점에 약관에서 규정하는 “특정질병으로 분류되는 질병” 인지 여부가 확인된 경우, 진단 이후 한국표준질\n병ㆍ사인분류의 개정으로 질병분류가 추가 또는 제외되더라도 약관에서 규정하는 “특정질병으로 분류되는 질병”\n인지 여부를 다시 판단하지 않습니다.\n설명\n진단 당시의 한국표준질병∙사인분류를 적용하여 약관에서 규정하는 \"특정질병으로 분류되는 질병”으로\n진단될 수 없었다면, 진단 이후 한국표준질병∙사인분류가 개정되어 약관에서 규정하는 \"특정질병으로\n분류되는 질병”으로 볼 수 있어 재진단서를 제출한다고 하더라도 약관에서 규정하는 \"특정질병으로 분\n류되는 질병”으로 보지 않습니다.\n\n별표3\n재 해 분 류 표\n\n1. 재해의 정의\n이 보험약관에서 재해는 다음 중 어느 하나에 해당하는 것을 말합니다.\n① 한국표준질병·사인분류상의 (S00∼Y84)에 해당하는 우발적인 외래의 사고\n② 감염병의 예방 및 관리에 관한 법률 제2조 제2호에서 규정한 제1급 감염병\n\n2. 재해에 해당되지 않는 사항\n다음 각 호는 이 보험약관에서 정의하는 재해에 해당되지 않습니다.\n① 질병 또는 체질적 요인이 있는 자로서 경미한 외부 요인으로 발병하거나 그 증상이 더욱 악화된 경우\n② 사고의 원인이 다음과 같은 경우\n- 과잉 노력 및 격심한 또는 반복적 운동(X50)\n- 무중력 환경에서의 장시간 체류(X52)\n- 식량부족(X53)\n- 물 부족(X54)\n- 상세불명의 결핍(X57)\n- 고의적 자해(X60∼X84)\n-‘법적 개입’중 법적 처형(Y35.5)\n③ ‘외과적 및 내과적 치료 중 환자의 재난(Y60∼Y69)’ 중 진료기관의 고의 또는 과실이 없는 사고 [단, 처치 당시\n에는 재난의 언급이 없었으나 환자의 이상반응 또는 이후 합병증의 원인이 된 외과적 및 기타 내과적 처치(Y83\n∼Y84)는 보장]\n④ ‘자연의 힘에 노출(X30∼X39)’중 급격한 액체손실로 인한 탈수\n⑤ ‘우발적 익사 및 익수(W65∼W74), 호흡과 관련된 기타 불의의 위협(W75∼W84), 눈 또는 인체의 개구부를 통\n하여 들어온 이물(W44)’중 질병에 의한 호흡장해 및 삼킴장해\n⑥ 한국표준질병·사인분류상의 (U00∼U99)에 해당하는 질병\n\n㈜ 1. 위 ( ) 안의 내용은 제8차 개정 한국표준질병·사인분류(통계청 고시 제2020-175 호, 2021.1.1 시행) 상의\n분류번호를 말하며, 이후 한국표준질병ㆍ사인분류가 개정되는 경우에는 발생(진단) 시점에 시행 중인 한국표\n준질병ㆍ사인분류를 적용합니다.\n설명\n피보험자에게 발생(진단)된 사고가 제8차 개정 한국표준질병ㆍ사인분류를 적용할 때, 약관에서 규\n정하는 「재해」에 해당될 수 있었다고 하더라도 발생(진단) 당시에 시행 중인 제9차 개정 이후 한\n국표준질병ㆍ사인분류를 적용할 때 약관에서 규정하는 「재해」가 아닌 경우에는 약관에서 규정하\n는 「재해」로 보지 않습니다.\n반대로 피보험자에게 발생(진단)된 사고가 제8차 개정 한국표준질병ㆍ사인분류를 적용할 때, 약관\n에서 규정하는 「재해」에 해당될 수 없었다고 하더라도 발생(진단) 당시에 시행 중인 제9차 개정\n이후 한국표준질병ㆍ사인분류를 적용할 때 약관에서 규정하는 「재해」인 경우에는 약관에서 규정\n하는 「재해」로 봅니다.\n2. 발생(진단) 시점에 상기 “1. 재해의 정의 및 2. 재해에 해당되지 않는 사항” 인지 여부가 확인된 경우, 발생(진\n단) 이후 한국표준질병ㆍ사인분류의 개정으로 재해의 분류가 추가 또는 제외되더라도 상기 “1. 재해의 정의\n및 2. 재해에 해당되지 않는 사항” 인지 여부를 다시 판단하지 않습니다.\n\n설명\n발생(진단) 당시의 한국표준질병∙사인분류를 적용하여 약관에서 규정하는 「재해」에 해당될 수 없\n었다면, 발생(진단) 이후 한국표준질병∙사인분류가 개정되어 약관에서 규정하는 「재해」로 볼 수\n있어 「재해 발생(진단)」 확인이 가능한 서류를 제출한다고 하더라도 약관에서 규정하는 「재해」로\n보지 않습니다.\n3. 위 「1. 재해의 정의 ②」에 해당하는 감염병은 보험사고 발생 당시 시행중인 법률을 적용하며, 「2. 재해에 해\n당되지 않는 사항 ⑥」에 해당되더라도 보장대상에서 제외하지 않습니다.\n\n부록\n약관에서 인용된 법령 내용 (가나다 순)\n\n□ 아래 법령은 고객의 이해를 돕기 위해 마련되었으며, 가입하신 상품에 따라 인용된 법령이 다를 수 있습니다.\n- 아래 법령은 2025 년4 월 1 일을 기준으로 작성되었으며, 해당 법령의 제·개정으로 내용이 변경될 수 있습니다.\n또한, 아래 법령과 실제 법령 내용이 다른 경우에는 실제 법령 내용을 적용합니다.\n□ 또한, 아래 방법으로 현행 법령과 제·개정 법령을 확인할 수 있습니다.\n- 홈페이지 : ‘국가법령정보센터 홈페이지(www.law.go.kr)’\n- 앱 : 구글 Play 스토어, 아이폰 앱스토어 등을 통해 ‘국가법령정보 (Korea Laws)’앱을 다운\n‘국가법령정보 (Korea Laws)’앱\n아이폰용 QR코드\n안드로이드용 QR코드\n\n■ 감염병의 예방 및 관리에 관한 법률\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. (생략)\n2. \"제1 급감염병\"이란 생물테러감염병 또는 치명률이 높거나 집단 발생의 우려가 커서 발생 또는 유행 즉시 신고하\n여야 하고, 음압격리와 같은 높은 수준의 격리가 필요한 감염병으로서 다음 각 목의 감염병을 말한다. 다만, 갑작\n스러운 국내 유입 또는 유행이 예견되어 긴급한 예방·관리가 필요하여 질병관리청장이 보건복지부장관과 협의\n하여 지정하는 감염병을 포함한다.\n가. 에볼라바이러스병\n나. 마버그열\n다. 라싸열\n라. 크리미안콩고출혈열\n마. 남아메리카출혈열\n바. 리프트밸리열\n사. 두창\n아. 페스트\n자. 탄저\n차. 보툴리눔독소증\n카. 야토병\n타. 신종감염병증후군\n파. 중증급성호흡기증후군(SARS)\n하. 중동호흡기증후군(MERS)\n거. 동물인플루엔자 인체감염증\n너. 신종인플루엔자\n더. 디프테리아\n\n3. \"제2 급감염병\"이란 전파가능성을 고려하여 발생 또는 유행 시 24 시간 이내에 신고하여야 하고, 격리가 필요한\n다음 각 목의 감염병을 말한다. 다만, 갑작스러운 국내 유입 또는 유행이 예견되어 긴급한 예방·관리가 필요하여\n질병관리청장이 보건복지부장관과 협의하여 지정하는 감염병을 포함한다.\n가. 결핵(結核)\n나. 수두(水痘)\n다. 홍역(紅疫)\n라. 콜레라\n마. 장티푸스\n바. 파라티푸스\n사. 세균성이질\n아. 장출혈성대장균감염증\n자. A형간염\n차. 백일해(百日咳)\n카. 유행성이하선염(流行性耳下腺炎)\n타. 풍진(風疹)\n\n파. 폴리오\n하. 수막구균 감염증\n거. b 형헤모필루스인플루엔자\n너. 폐렴구균 감염증\n더. 한센병\n러. 성홍열\n머.\n반코마이신내성황색포도알균(VRSA) 감염증\n버. 카바페넴내성장내세균목 (CRE) 감염증\n서. E 형간염\n4. “제3 급감염병”이란 그 발생을 계속 감시할 필요가 있어 발생 또는 유행 시 24 시간 이내에 신고하여야 하는 다음\n각 목의 감염병을 말한다. 다만, 갑작스러운 국내 유입 또는 유행이 예견되어 긴급한 예방·관리가 필요하여 질병\n관리청장이 보건복지부장관과 협의하여 지정하는 감염병을 포함한다.\n가. 파상풍(破傷風)\n나. B형간염\n다. 일본뇌염\n라. C형간염\n마. 말라리아\n바. 레지오넬라증\n사. 비브리오패혈증\n아. 발진티푸스\n자. 발진열(發疹熱)\n차. 쯔쯔가무시증\n카. 렙토스피라증\n타. 브루셀라증\n파. 공수병(恐水病)\n하. 신증후군출혈열(腎症候群出血熱)\n거. 후천성면역결핍증(AIDS)\n너. 크로이츠펠트-야콥병(CJD) 및 변종크로이츠펠트-야콥병(vCJD)\n더. 황열\n러. 뎅기열\n머. 큐열(Q熱)\n버. 웨스트나일열\n서. 라임병\n어. 진드기매개뇌염\n저. 유비저(類鼻疽)\n처. 치쿤구니야열\n퍼. 매독(梅毒)\n커. 중증열성혈소판감소증후군(SFTS)\n터. 지카바이러스 감염증\n(이하 생략)\n\n제16 조의2(감염병병원체 확인기관)\n① 다음 각 호의 기관(이하 \"감염병병원체 확인기관\"이라 한다)은 실험실 검사 등을 통하여 감염병병원체를 확인할 수\n있다.\n1. 질병관리청\n2. 질병대응센터\n3. 「보건환경연구원법」 제2조에 따른 보건환경연구원\n4. 「지역보건법」 제10조에 따른 보건소\n5. 「의료법」 제3조에 따른 의료기관 중 진단검사의학과 전문의가 상근(常勤)하는 기관\n6. 「고등교육법」 제4조에 따라 설립된 의과대학 중 진단검사의학과가 개설된 의과대학\n7. 「결핵예방법」 제21조에 따라 설립된 대한결핵협회(결핵환자의 병원체를 확인하는 경우만 해당한다)\n8. 「민법」 제32조에 따라 한센병환자 등의 치료ㆍ재활을 지원할 목적으로 설립된 기관(한센병환자의 병원체를 확인\n하는 경우만 해당한다)\n9. 인체에서 채취한 검사물에 대한 검사를 국가, 지방자치단체, 의료기관 등으로부터 위탁받아 처리하는 기관 중 진\n단검사의학과 전문의가 상근하는 기관\n② 질병관리청장은 감염병병원체 확인의 정확성ㆍ신뢰성을 확보하기 위하여 감염병병원체 확인기관의 실험실 검사능\n력을 평가하고 관리할 수 있다.\n③ 제2항에 따른 감염병병원체 확인기관의 실험실 검사능력 평가 및 관리에 관한 방법, 절차 등에 관하여 필요한 사항은\n보건복지부령으로 정한다.\n\n■ 감염병의 예방 및 관리에 관한 법률 시행규칙\n\n제6 조(의사 등의 감염병 발생신고)\n(생략)\n\n⑤ 법 제11 조제6 항에 따른 감염병환자등의 진단 기준은 별표 2 와 같으며, 그 밖의 세부 사항은 질병관리청장이 정\n하여 고시한다.\n\n[별표2] 감염병환자등의 진단 기준\n1. 제1 급감염병의 경우\n가. 감염병환자: 해당 감염병에 부합되는 임상적 특징을 나타내면서 혈액, 대변, 인두도말 등 검체에서 배양검사, 유\n전자 검출검사 등의 검사방법으로 감염병병원체가 확인된 사람\n나. 의사환자: 임상적 특징 및 역학적 연관성을 고려할 때 해당 감염병이 의심되나 감염병병원체가 확인되지 않은 사\n람\n다. 병원체보유자: 임상증상을 나타내지 않으나 감염병병원체가 확인된 사람\n\n2. 제2 급감염병의 경우\n가. 감염병환자: 해당 감염병에 부합되는 임상적 특징을 나타내면서 혈액, 대변, 인두도말, 뇌척수액, 가래 등 검체에\n서 배양검사, 유전자 검출검사, 항체 검출검사 등의 검사방법으로 감염병병원체가 확인된 사람\n나. 의사환자: 임상적 특징 및 역학적 연관성을 고려할 때 해당 감염병이 의심되나 감염병병원체가 확인되지 않은 사\n람\n다. 병원체보유자: 임상증상을 나타내지 않으나 감염병병원체가 확인된 사람\n\n3. 제3 급감염병의 경우\n가. 감염병환자: 해당 감염병에 부합되는 임상적 특징을 나타내면서 혈액, 대변, 소변, 뇌척수액, 가래, 기관지세척액\n등 검체에서 배양검사, 유전자 검출검사, 항체 검출검사, 항원 검출검사, 현미경검사 등의 검사방법으로 감염병병\n원체가 확인된 사람. 다만, 파상풍의 경우에는 임상적 특징을 나타내는 것만으로도 감염병환자로 진단한다.\n나. 의사환자: 임상적 특징 및 역학적 연관성을 고려할 때 해당 감염병이 의심되나 감염병병원체가 확인되지 않은 사\n람\n다. 병원체보유자: 임상증상을 나타내지 않으나 감염병병원체가 확인된 사람\n\n4. 제4 급감염병의 경우\n가. 감염병환자: 해당 감염병에 부합되는 임상적 특징을 나타내면서 혈액, 대변, 소변, 인두도말, 궤양부위도말, 병변\n조직, 피하조직 등 검체에서 배양검사, 유전자 검출검사, 항체 검출검사, 항원 검출검사, 현미경검사 등의 검사방\n법으로 감염병병원체가 확인된 사람\n나. 의사환자: 임상적 특징 및 역학적 연관성을 고려할 때 해당 감염병이 의심되나 감염병병원체가 확인되지 않은 사\n람\n다. 병원체보유자: 임상증상을 나타내지 않으나 감염병병원체가 확인된 사람\n\n■ 개인정보보호법\n\n제15 조(개인정보의 수집ㆍ이용)\n① 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위\n에서 이용할 수 있다.\n1. 정보주체의 동의를 받은 경우\n2. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우\n3. 공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우\n\n4. 정보주체와 체결한 계약을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하\n여 필요한 경우\n5. 명백히 정보주체 또는 제3 자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우\n6. 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경\n우. 이 경우 개인정보처리자의 정당한 이익과 상당한 관련이 있고 합리적인 범위를 초과하지 아니하는 경우에 한\n한다.\n7. 공중위생 등 공공의 안전과 안녕을 위하여 긴급히 필요한 경우\n② 개인정보처리자는 제1 항제1 호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음\n각 호의 어느 하나의 사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.\n1. 개인정보의 수집ㆍ이용 목적\n2. 수집하려는 개인정보의 항목\n3. 개인정보의 보유 및 이용 기간\n4. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n③ 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화\n등 안전성 확보에 필요한 조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이 개\n인정보를 이용할 수 있다.\n\n제17 조(개인정보의 제공)\n① 개인정보처리자는 다음 각 호의 어느 하나에 해당되는 경우에는 정보주체의 개인정보를 제3 자에게 제공(공유를 포\n함한다. 이하 같다)할 수 있다.\n1. 정보주체의 동의를 받은 경우\n2. 제15 조제1 항제2 호, 제3 호 및 제5 호부터 제7 호까지에 따라 개인정보를 수집한 목적 범위에서 개인정보를\n제공하는 경우\n② 개인정보처리자는 제1 항제1 호에 따른 동의를 받을 때에는 다음 각 호의 사항을 정보주체에게 알려야 한다. 다음\n각 호의 어느 하나의 사항을 변경하는 경우에도 이를 알리고 동의를 받아야 한다.\n1. 개인정보를 제공받는 자\n2. 개인정보를 제공받는 자의 개인정보 이용 목적\n3. 제공하는 개인정보의 항목\n4. 개인정보를 제공받는 자의 개인정보 보유 및 이용 기간\n5. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n③ 삭제\n④ 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화\n등 안전성 확보에 필요한 조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이\n개인정보를 제공할 수 있다.\n\n제22 조(동의를 받는 방법)\n① 개인정보처리자는 이 법에 따른 개인정보의 처리에 대하여 정보주체(제22 조의2 제1 항에 따른 법정대리인을\n포함한다. 이하 이 조에서 같다)의 동의를 받을 때에는 각각의 동의 사항을 구분하여 정보주체가 이를 명확하게 인지할\n수 있도록 알리고 동의를 받아야 한다. 이 경우 다음 각 호의 경우에는 동의 사항을 구분하여 각각 동의를 받아야 한다.\n1. 제15 조제1 항제1 호에 따라 동의를 받는 경우\n2. 제17 조제1 항제1 호에 따라 동의를 받는 경우\n3. 제18 조제2 항제1 호에 따라 동의를 받는 경우\n4. 제19 조제1 호에 따라 동의를 받는 경우\n5. 제23 조제1 항제1 호에 따라 동의를 받는 경우\n\n6. 제24 조제1 항제1 호에 따라 동의를 받는 경우\n7. 재화나 서비스를 홍보하거나 판매를 권유하기 위하여 개인정보의 처리에 대한 동의를 받으려는 경우\n8. 그 밖에 정보주체를 보호하기 위하여 동의 사항을 구분하여 동의를 받아야 할 필요가 있는 경우로서 대통령령으로\n정하는 경우\n② 개인정보처리자는 제1 항의 동의를 서면(「전자문서 및 전자거래 기본법」 제2 조 제1 호에 따른 전자문서를\n포함한다)으로 받을 때에는 개인정보의 수집ㆍ이용 목적, 수집ㆍ이용하려는 개인정보의 항목 등 대통령령으로 정하는\n중요한 내용을 보호위원회가 고시로 정하는 방법에 따라 명확히 표시하여 알아보기 쉽게 하여야 한다.\n③ 개인정보처리자는 정보주체의 동의 없이 처리할 수 있는 개인정보에 대해서는 그 항목과 처리의 법적 근거를\n정보주체의 동의를 받아 처리하는 개인정보와 구분하여 제30 조제2 항에 따라 공개하거나 전자우편 등 대통령령으로\n정하는 방법에 따라 정보주체에게 알려야 한다. 이 경우 동의 없이 처리할 수 있는 개인정보라는 입증책임은\n개인정보처리자가 부담한다.\n④ 삭제\n⑤ 개인정보처리자는 정보주체가 선택적으로 동의할 수 있는 사항을 동의하지 아니하거나 제1 항제3 호 및 제7 호에\n따른 동의를 하지 아니한다는 이유로 정보주체에게 재화 또는 서비스의 제공을 거부하여서는 아니 된다.\n⑥ 삭제\n⑦ 제1 항부터 제5 항까지에서 규정한 사항 외에 정보주체의 동의를 받는 세부적인 방법에 관하여 필요한 사항은\n개인정보의 수집매체 등을 고려하여 대통령령으로 정한다.\n\n제23 조(민감정보의 처리 제한)\n① 개인정보처리자는 사상ㆍ신념, 노동조합ㆍ정당의 가입ㆍ탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보, 그 밖에 정\n보주체의 사생활을 현저히 침해할 우려가 있는 개인정보로서 대통령령으로 정하는 정보(이하 “민감정보”라 한다)를 처\n리하여서는 아니된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 정보주체에게 제15 조제2 항 각 호 또는 제17 조제2 항 각 호의 사항을 알리고 다른 개인정보의 처리에 대한 동\n의와 별도로 동의를 받은 경우\n2. 법령에서 민감정보의 처리를 요구하거나 허용하는 경우\n② 개인정보처리자가 제1 항 각 호에 따라 민감정보를 처리하는 경우에는 그 민감정보가 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변\n조 또는 훼손되지 아니하도록 제29 조에 따른 안전성 확보에 필요한 조치를 하여야 한다.\n③ 개인정보처리자는 재화 또는 서비스를 제공하는 과정에서 공개되는 정보에 정보주체의 민감정보가 포함됨으로써 사\n생활 침해의 위험성이 있다고 판단하는 때에는 재화 또는 서비스의 제공 전에 민감정보의 공개 가능성 및 비공개를 선\n택하는 방법을 정보주체가 알아보기 쉽게 알려야 한다.\n\n제24 조(고유식별정보의 처리 제한)\n① 개인정보처리자는 다음 각 호의 경우를 제외하고는 법령에 따라 개인을 고유하게 구별하기 위하여 부여된 식별정보\n로서 대통령령으로 정하는 정보(이하 “고유식별정보”라 한다)를 처리할 수 없다.\n1. 정보주체에게 제15 조 제2 항 각 호 또는 제17 조 제2 항 각 호의 사항을 알리고 다른 개인정보의 처리에 대한\n동의와 별도로 동의를 받은 경우\n2. 법령에서 구체적으로 고유식별정보의 처리를 요구하거나 허용하는 경우\n② 삭제\n③ 개인정보처리자가 제1 항 각 호에 따라 고유식별정보를 처리하는 경우에는 그 고유식별정보가 분실ㆍ도난ㆍ유출ㆍ\n위조·변조 또는 훼손되지 아니하도록 대통령령으로 정하는 바에 따라 암호화 등 안전성 확보에 필요한 조치를 하여야\n한다.\n④ 보호위원회는 처리하는 개인정보의 종류ㆍ규모, 종업원 수 및 매출액 규모 등을 고려하여 대통령령으로 정하는 기준\n에 해당하는 개인정보처리자가 제3 항에 따라 안전성 확보에 필요한 조치를 하였는지에 관하여 대통령령으로 정하는\n바에 따라 정기적으로 조사하여야 한다.\n\n⑤ 보호위원회는 대통령령으로 정하는 전문기관으로 하여금 제4 항에 따른 조사를 수행하게 할 수 있다.\n\n제24 조의2(주민등록번호 처리의 제한)\n① 제24 조제1 항에도 불구하고 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우를 제외하고는 주민등록번\n호를 처리할 수 없다.\n1. 법률ㆍ대통령령ㆍ국회규칙ㆍ대법원규칙ㆍ헌법재판소규칙ㆍ중앙선거관리위원회규칙 및 감사원규칙에서 구체적\n으로 주민등록번호의 처리를 요구하거나 허용한 경우\n2. 정보주체 또는 제3 자의 급박한 생명, 신체, 재산의 이익을 위하여 명백히 필요하다고 인정되는 경우\n3. 제1 호 및 제2 호에 준하여 주민등록번호 처리가 불가피한 경우로서 보호위원회가 고시로 정하는 경우\n② 개인정보처리자는 제24 조제3 항에도 불구하고 주민등록번호가 분실·도난·유출·위조·변조 또는 훼손되지 아\n니하도록 암호화 조치를 통하여 안전하게 보관하여야 한다. 이 경우 암호화 적용 대상 및 대상별 적용 시기 등에 관하여\n필요한 사항은 개인정보의 처리 규모와 유출 시 영향 등을 고려하여 대통령령으로 정한다.\n③ 개인정보처리자는 제1 항 각 호에 따라 주민등록번호를 처리하는 경우에도 정보주체가 인터넷 홈페이지를 통하여\n회원으로 가입하는 단계에서는 주민등록번호를 사용하지 아니하고도 회원으로 가입할 수 있는 방법을 제공하여야 한\n다.\n④ 보호위원회는 개인정보처리자가 제3 항에 따른 방법을 제공할 수 있도록 관계 법령의 정비, 계획의 수립, 필요한\n시설 및 시스템의 구축 등 제반 조치를 마련ㆍ지원할 수 있다.\n\n■ 고엽제후유의증 등 환자지원 및 단체설립에 관한 법률\n\n제2조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다\n1. \"고엽제\"란 월남전 또는 대한민국 비무장지대 남방한계선(南方限界線)의 인접지역으로서 국방부령으로 정하는 지\n역(이하 \"남방한계선 인접지역\"이라 한다)에서 나뭇잎 등을 제거하기 위하여 사용된 제초제로서 다이옥신이 들어\n있는 것을 말한다.\n2. \"고엽제후유증환자\"란 다음 각 목의 어느 하나에 해당하는 자를 말한다.\n가. 1964년 7월 18일부터 1973년 3월 23일 사이에 월남전에 참전하여 고엽제 살포지역에서 「병역법」, 「군인사법」\n또는 「군무원인사법」에 따른 군인이나 군무원으로서 복무하고 전역(轉役)·퇴직한 자와 정부의 승인을 받아 전투\n나 군의 작전에 종군(從軍)한 기자(이하 \"월남전에 참전하고 전역한 자등\"이라 한다)로서 제5조제1항 각 호의 어\n느 하나에 해당하는 질병을 얻은 자\n나. 1967년 10월 9일부터 1972년 1월 31일 사이에 남방한계선 인접지역에서 「병역법」, 「군인사법」 또는 「군무원\n인사법」에 따른 군인이나 군무원으로서 복무하였거나 고엽제 살포업무에 참가하고 전역·퇴직한 자(이하 \"남방\n한계선 인접지역에서 복무하고 전역한 자등\"이라 한다)로서 제5조제1항 각 호의 어느 하나에 해당하는 질병을 얻\n은 자\n3. \"고엽제후유의증환자\"란 월남전에 참전하고 전역한 자등 또는 남방한계선 인접지역에서 복무하고 전역한 자등으\n로서 제5조제2항 각 호의 어느 하나에 해당하는 질병을 얻은 자를 말한다.\n(이하 생략)\n\n제5조(고엽제후유증환자 등의 결정기준)\n①(생략)\n② 제4조제7항에 따라 이 법의 적용 대상자를 결정하는 기준이 되는 고엽제후유의증의 범위는 다음 각 호와 같다.\n1. 일광과민성피부염(日光過敏性皮膚炎)\n2. 심상성건선(尋常性乾癬)\n\n3. 지루성피부염(脂漏性皮膚炎)\n4. 만성담마진(慢性蕁麻疹)\n5. 건성습진(乾性濕疹)\n6. 중추신경장애(中樞神經障碍). 다만, 제1항제16호 본문의 파킨슨병 및 같은 항 제24호의 비전형 파킨슨증 중 진행\n성 핵상 마비와 다계통 위축증은 제외한다.\n7. 뇌경색증(腦硬塞症)\n8. 다발성신경마비(多發性神經痲痺)\n9. 삭제\n10. 근위축성신경측색경화증(筋萎縮性神經側索硬化症)\n11. 근질환(筋疾患)\n12. 악성종양(惡性腫瘍). 다만, 제1항의 고엽제후유증에 속하는 악성종양은 제외한다.\n13. 간질환(肝疾患). 다만, B형 및 C형 감염으로 인한 것은 제외한다.\n14. 삭제\n15. 고혈압(高血壓)\n16. 뇌출혈(腦出血)\n17. 삭제\n18. 동맥경화증(動脈硬化症)\n19. 무혈성괴사증(無血性壞死症)\n20. 고지혈증(高脂血症)\n21. 삭제\n(이하 생략)\n\n■ 관공서의 공휴일에 관한 규정\n\n제2 조(공휴일)\n관공서의 공휴일은 다음 각 호와 같다. 다만, 재외공관의 공휴일은 우리나라의 국경일 중 공휴일과 주재국의 공휴일로\n한다.\n1. 일요일\n2. 국경일 중 3·1 절, 광복절, 개천절 및 한글날\n3. 1 월1 일\n4. 설날 전날, 설날, 설날 다음날(음력 12 월 말일, 1 월1 일, 2 일)\n5. 삭제\n6. 부처님 오신날(음력 4 월 8 일)\n7. 5 월 5 일 (어린이날)\n8. 6 월6 일 (현충일)\n9. 추석 전날, 추석, 추석 다음날(음력 8 월 14 일, 15 일, 16 일)\n10. 12 월 25 일(기독탄신일)\n10 의2. 「공직선거법」 제34 조에 따른 임기만료에 의한 선거의 선거일\n11. 기타 정부에서 수시 지정하는 날\n\n제3 조(대체공휴일)\n① 제2 조제2 호부터 제10 호까지의 공휴일이 다음 각 호의 어느 하나에 해당하는 경우에는 그 공휴일 다음의 첫 번째\n비공휴일(제2 조 각 호의 공휴일이 아닌 날을 말한다. 이하 같다)을 대체공휴일로 한다.\n\n1. 제2 조제2 호·제6 호·제7 호 또는 제10 호의 공휴일이 토요일이나 일요일과 겹치는 경우\n2. 제2 조제4 호 또는 제9 호의 공휴일이 일요일과 겹치는 경우\n3. 제2 조제2 호·제4 호·제6 호·제7 호·제9 호 또는 제10 호의 공휴일이 토요일·일요일이 아닌 날에 같은 조\n제2 호부터 제10 호까지의 규정에 따른 다른 공휴일과 겹치는 경우\n② 제1 항에 따른 대체공휴일이 같은 날에 겹치는 경우에는 그 대체공휴일 다음의 첫 번째 비공휴일까지 대체공휴일로\n한다.\n③ 제1 항 및 제2 항에 따른 대체공휴일이 토요일인 경우에는 그 다음의 첫 번째 비공휴일을 대체공휴일로 한다.\n\n■ 국가경찰과 자치경찰의 조직 및 운영에 관한 법률\n\n제13 조(경찰사무의 지역적 분장기관)\n경찰의 사무를 지역적으로 분담하여 수행하게 하기 위하여 특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도(이하\n“시ㆍ도”라 한다)에 시ㆍ도경찰청을 두고, 시ㆍ도경찰청장 소속으로 경찰서를 둔다. 이 경우 인구, 행정구역, 면적,\n지리적 특성, 교통 및 그 밖의 조건을 고려하여 시ㆍ도에 2 개의 시ㆍ도경찰청을 둘 수 있다.\n\n■ 국가유공자 등 예우 및 지원에 관한 법률\n\n제6 조(등록 및 결정)\n① 국가유공자, 그 유족 또는 가족이 되려는 사람(이하 이 조에서 \"신청 대상자\"라 한다)은 대통령령으로 정하는 바에 따\n라 국가보훈부장관에게 등록을 신청하여야 한다. 다만, 신청 대상자가 다음 각 호의 어느 하나에 해당하는 경우에는 대\n통령령으로 정하는 바에 따라 국가보훈부 소속 공무원이 신청 대상자의 동의를 받아 등록을 신청할 수 있고, 그 동의를\n받은 경우에는 신청 대상자가 등록을 신청한 것으로 본다.\n1. 「국가보훈 기본법」 제23 조제1 항제3 호의2 에 따라 발굴된 희생·공헌자의 경우\n2. 전투 또는 이에 준하는 직무수행 중 상이를 입거나 사망한 경우\n3. 그 밖에 대통령령으로 정하는 사유로 직접 등록을 신청할 수 없는 경우\n②「보훈보상대상자 지원에 관한 법률」제4 조제1 항에 따라 등록을 신청하는 사람에 대하여는 그 등록신청을 한 날에\n제1 항에 따른 등록을 신청한 것으로 본다.\n③ 국가보훈부장관은 제1 항에 따른 등록신청을 받으면 대통령령으로 정하는 바에 따라 제4 조 또는 제5 조에 따른 요\n건을 확인한 후 국가유공자, 그 유족 또는 가족에 해당하는지를 결정한다. 이 경우 제4 조제1 항제3 호부터 제6 호까\n지, 제8 호, 제14 호 및 제15 호의 국가유공자(이하 \"전몰군경등\"이라 한다)가 되기 위하여 등록을 신청하는 경우에는\n그 소속하였던 기관의 장에게 그 요건과 관련된 사실의 확인을 요청하여야 하며, 그 소속하였던 기관의 장은 관련 사실\n을 조사한 후 대통령령으로 정하는 바에 따라 그 요건과 관련된 사실을 확인하여 국가보훈부장관에게 통보하여야 한다.\n④ 국가보훈부장관은 제3 항 전단에 따라 국가유공자, 그 유족 또는 가족에 해당하는 사람으로 결정할 때에는 제74 조\n의5 에 따른 보훈심사위원회(이하 \"보훈심사위원회\"라 한다)의 심의·의결을 거쳐야 한다. 다만, 국가유공자, 그 유족\n또는 가족의 요건이 객관적인 사실에 의하여 확인된 경우로서 대통령령으로 정하는 경우에는 보훈심사위원회의 심의·\n의결을 거치지 아니할 수 있다.\n⑤ 국가보훈부장관은 제4 조제1 항 각 호(제1 호, 제2 호 및 제10 호는 제외한다)의 어느 하나에 해당하는 적용 대상\n국가유공자임에도 불구하고 신청 대상자가 없어 등록신청을 할 수 없는 사람에 대해서는 보훈심사위원회의 심의·의결\n을 거쳐 국가유공자로 기록하고 예우 및 관리를 할 수 있다.\n⑥ 제1 항부터 제4 항까지의 규정은 다른 법률에서 이 법의 예우 등을 받도록 규정된 사람에 대하여도 적용한다.\n\n■ 국민건강보험법\n\n제41 조(요양급여)\n① 가입자와 피부양자의 질병, 부상, 출산 등에 대하여 다음 각 호의 요양급여를 실시한다.\n1. 진찰·검사\n2. 약제(藥劑)·치료재료의 지급\n3. 처치·수술 및 그 밖의 치료\n4. 예방·재활\n5. 입원\n6. 간호\n7. 이송(移送)\n② 제1 항에 따른 요양급여(이하 \"요양급여\"라 한다)의 범위(이하 \"요양급여대상\"이라 한다)는 다음 각 호와 같다.\n1. 제1 항 각 호의 요양급여(제1 항제2 호의 약제는 제외한다): 제4 항에 따라 보건복지부장관이 비급여대상으로\n정한 것을 제외한 일체의 것\n2. 제1 항제2 호의 약제: 제41 조의3 에 따라 요양급여대상으로 보건복지부장관이 결정하여 고시한 것\n③ 요양급여의 방법·절차·범위·상한 등의 기준은 보건복지부령으로 정한다.\n④ 보건복지부장관은 제3 항에 따라 요양급여의 기준을 정할 때 업무나 일상생활에 지장이 없는 질환에 대한 치료 등\n보건복지부령으로 정하는 사항은 요양급여대상에서 제외되는 사항(이하 \"비급여대상\"이라 한다)으로 정할 수 있다.\n\n제42 조(요양기관)\n① 요양급여(간호와 이송은 제외한다)는 다음 각 호의 요양기관에서 실시한다. 이 경우 보건복지부장관은 공익이나 국\n가정책에 비추어 요양기관으로 적합하지 아니한 대통령령으로 정하는 의료기관 등은 요양기관에서 제외할 수 있다.\n1. 「의료법」에 따라 개설된 의료기관\n2. 「약사법」에 따라 등록된 약국\n3. 「약사법 」제91 조에 따라 설립된 한국희귀·필수의약품센터\n4. 「지역보건법」에 따른 보건소·보건의료원 및 보건지소\n5. 「농어촌 등 보건의료를 위한 특별조치법」에 따라 설치된 보건진료소\n② 보건복지부장관은 효율적인 요양급여를 위하여 필요하면 보건복지부령으로 정하는 바에 따라 시설·장비·인력 및\n진료과목 등 보건복지부령으로 정하는 기준에 해당하는 요양기관을 전문요양기관으로 인정할 수 있다. 이 경우 해당 전\n문요양기관에 인정서를 발급하여야 한다.\n③ 보건복지부장관은 제2 항에 따라 인정받은 요양기관이 다음 각 호의 어느 하나에 해당하는 경우에는 그 인정을 취소\n한다.\n1. 제2 항 전단에 따른 인정기준에 미달하게 된 경우\n2. 제2 항 후단에 따라 발급받은 인정서를 반납한 경우\n④ 제2 항에 따라 전문요양기관으로 인정된 요양기관 또는 「의료법」 제3 조의4 에 따른 상급종합병원에 대하여는 제\n41 조제3 항에 따른 요양급여의 절차 및 제45 조에 따른 요양급여비용을 다른 요양기관과 달리 할 수 있다.\n⑤ 제1 항·제2 항 및 제4 항에 따른 요양기관은 정당한 이유 없이 요양급여를 거부하지 못한다.\n\n제44 조(비용의 일부부담)\n① 요양급여를 받는 자는 대통령령으로 정하는 바에 따라 비용의 일부(이하 “본인일부부담금”이라 한다)를 본인이 부담\n한다. 이 경우 선별급여에 대해서는 다른 요양급여에 비하여 본인일부부담금을 상향 조정할 수 있다.\n② 본인이 연간 부담하는 다음 각 호의 금액의 합계액이 대통령령으로 정하는 금액(이하 이 조에서 “본인부담상한액”\n이라 한다)을 초과한 경우에는 공단이 그 초과 금액을 부담하여야 한다. 이 경우 공단은 당사자에게 그 초과 금액을 통보\n하고, 이를 지급하여야 한다.\n1. 본인일부부담금의 총액\n\n2. 제49 조제1 항에 따른 요양이나 출산의 비용으로 부담한 금액(요양이나 출산의 비용으로 부담한 금액이 보건복\n지부장관이 정하여 고시한 금액보다 큰 경우에는 그 고시한 금액으로 한다)에서 같은 항에 따라 요양비로 지급받은\n금액을 제외한 금액\n③ 제2 항에 따른 본인부담상한액은 가입자의 소득수준 등에 따라 정한다.\n④ 제2 항 각 호에 따른 금액 및 합계액의 산정 방법, 본인부담상한액을 넘는 금액의 지급 방법 및 제3 항에 따른 가입\n자의 소득수준 등에 따른 본인부담상한액 설정 등에 필요한 사항은 대통령령으로 정한다.\n\n제53 조(급여의 제한)\n① 공단은 보험급여를 받을 수 있는 사람이 다음 각 호의 어느 하나에 해당하면 보험급여를 하지 아니한다.\n1. 고의 또는 중대한 과실로 인한 범죄행위에 그 원인이 있거나 고의로 사고를 일으킨 경우\n2. 고의 또는 중대한 과실로 공단이나 요양기관의 요양에 관한 지시에 따르지 아니한 경우\n3. 고의 또는 중대한 과실로 제55 조에 따른 문서와 그 밖의 물건의 제출을 거부하거나 질문 또는 진단을 기피한 경\n우\n4. 업무 또는 공무로 생긴 질병·부상·재해로 다른 법령에 따른 보험급여나 보상(報償) 또는 보상(補償)을 받게 되\n는 경우\n② 공단은 보험급여를 받을 수 있는 사람이 다른 법령에 따라 국가나 지방자치단체로부터 보험급여에 상당하는 급여를\n받거나 보험급여에 상당하는 비용을 지급받게 되는 경우에는 그 한도에서 보험급여를 하지 아니한다.\n③ 공단은 가입자가 대통령령으로 정하는 기간 이상 다음 각 호의 보험료를 체납한 경우 그 체납한 보험료를 완납할 때\n까지 그 가입자 및 피부양자에 대하여 보험급여를 실시하지 아니할 수 있다. 다만, 월별 보험료의 총체납횟수(이미 납부\n된 체납보험료는 총체납횟수에서 제외하며, 보험료의 체납기간은 고려하지 아니한다)가 대통령령으로 정하는 횟수 미\n만이거나 가입자 및 피부양자의 소득·재산 등이 대통령령으로 정하는 기준 미만인 경우에는 그러하지 아니하다.\n1. 제69 조제4 항제2 호에 따른 보수 외 소득월액보험료\n2. 제69 조제5 항에 따른 세대단위의 보험료\n④ 공단은 제77 조제1 항제1 호에 따라 납부의무를 부담하는 사용자가 제69 조제4 항제1 호에 따른 보수월액보험\n료를 체납한 경우에는 그 체납에 대하여 직장가입자 본인에게 귀책사유가 있는 경우에 한하여 제3 항의 규정을 적용한\n다. 이 경우 해당 직장가입자의 피부양자에게도 제3 항의 규정을 적용한다\n⑤ 제3 항 및 제4 항에도 불구하고 제82 조에 따라 공단으로부터 분할납부 승인을 받고 그 승인된 보험료를 1 회 이상\n낸 경우에는 보험급여를 할 수 있다. 다만, 제82 조에 따른 분할납부 승인을 받은 사람이 정당한 사유 없이 5 회(같은 조\n제1 항에 따라 승인받은 분할납부 횟수가 5 회 미만인 경우에는 해당 분할납부 횟수를 말한다. 이하 이 조에서 같다) 이\n상 그 승인된 보험료를 내지 아니한 경우에는 그러하지 아니하다.\n⑥ 제3 항 및 제4 항에 따라 보험급여를 하지 아니하는 기간(이하 이 항에서 \"급여제한기간\"이라 한다)에 받은 보험급\n여는 다음 각 호의 어느 하나에 해당하는 경우에만 보험급여로 인정한다.\n1. 공단이 급여제한기간에 보험급여를 받은 사실이 있음을 가입자에게 통지한 날부터 2 개월이 지난 날이 속한 달의\n납부기한 이내에 체납된 보험료를 완납한 경우\n2. 공단이 급여제한기간에 보험급여를 받은 사실이 있음을 가입자에게 통지한 날부터 2 개월이 지난 날이 속한 달의\n납부기한 이내에 제82 조에 따라 분할납부 승인을 받은 체납보험료를 1 회 이상 낸 경우. 다만, 제82 조에 따른\n분할납부 승인을 받은 사람이 정당한 사유 없이 5 회 이상 그 승인된 보험료를 내지 아니한 경우에는 그러하지 아\n니하다.\n\n제54 조(급여의 정지)\n보험급여를 받을 수 있는 사람이 다음 각 호의 어느 하나에 해당하면 그 기간에는 보험급여를 하지 아니한다. 다만, 제3\n호 및 제4 호의 경우에는 제60 조에 따른 요양급여를 실시한다.\n1. 삭제\n2. 국외에 체류하는 경우\n\n3. 제6 조제2 항제2 호에 해당하게 된 경우\n4. 교도소, 그 밖에 이에 준하는 시설에 수용되어 있는 경우\n\n■ 국민건강보험법 시행령\n\n제19 조(비용의 본인부담)\n① 법 제44 조제1 항에 따른 본인일부부담금(이하 “본인일부부담금”이라 한다)의 부담률 및 부담액은 별표 2 와 같다.\n(이하 생략)\n\n[별표 2]  본인일부부담금의 부담률 및 부담액\n1. 가입자 또는 피부양자는 요양급여비용 중 다음 각 목의 어느 하나에 해당하는 금액(100 원 미만은 제외한다)을 부\n담한다. 다만, 입원진료의 경우에는 100 원 미만의 금액도 부담한다.\n가. (생략)\n나. 외래진료의 경우 및 보건복지부장관이 정하는 의료장비·치료재료를 이용한 진료의 경우에는 다음 표의 구분\n에 따라 계산한 금액\n기관 종류\n소재지\n환자 구분\n본인일부부담금\n상급종합\n병원\n모든 지역\n일반환자\n진찰료 총액 + (요양급여비용 총액 - 진찰료총액) × 60/100.\n다만, 임신부 외래진료의 경우에는 요양급여비용 총액의 40/100, 1세 미만 영유아\n외래진료의 경우에는 요양급여비용 총액의 20/100으로 한다.\n의약분업\n예외환자\n진찰료 총액 + (요양급여비용 총액 - 약값 총액 - 진찰료 총액) × 60/100 + 약값\n총액 ×30/100.\n다만, 임신부 외래진료의 경우에는 (요양급여비용 총액 - 약값 총액) × 40/100 +\n약값 총액×30/100, 1세 미만 영유아 외래진료의 경우에는 (요양급여비용 총액 -\n약값 총액) × 20/100 + 약값 총액×21/100로 한다.\n종합병원\n동\n지역\n일반환자 요양급여비용 총액 × 50/100(임신부 외래진료의 경우에는 30/100, 1 세 미만\n영유아 외래진료의 경우에는 15/100)\n의약분업\n예외환자\n(요양급여비용 총액 - 약값 총액) × 50/100(임신부 외래진료의 경우에는 30/100,\n1세 미만 영유아 외래진료의 경우에는 15/100) + 약값 총액 × 30/100(1세 미만\n영유아의 경우에는 21/100)\n읍·면\n지역\n일반환자 요양급여비용 총액 × 45/100(임신부 외래진료의 경우에는 30/100, 1 세 미만\n영유아 외래진료의 경우에는 15/100)\n의약분업\n예외환자\n(요양급여비용 총액 - 약값 총액) × 45/100(임신부 외래진료의 경우에는 30/100,\n1세 미만 영유아 외래진료의 경우에는 15/100) + 약값 총액× 30/100(1세 미만\n영유아의 경우에는 21/100\n\n병원,\n치과병원,\n한방병원,\n요양병원,\n정신병원\n동\n지역\n일반환자 요양급여비용 총액 × 40/100(임신부 외래진료의 경우에는 20/100, 1 세 미만\n영유아 외래진료의 경우에는 10/100)\n의약분업\n예외환자\n(요양급여비용 총액 - 약값 총액) × 40/100(임신부 외래진료의 경우에는 20/100,\n1세 미만 영유아 외래진료의 경우에는 10/100) + 약값 총액× 30/100(1세 미만\n영유아의 경우에는 21/100)\n읍·면\n지역\n일반환자 요양급여비용 총액 × 35/100(임신부 외래진료의 경우에는 20/100, 1 세 미만\n영유아 외래진료의 경우에는 10/100)\n의약분업\n예외환자\n(요양급여비용 총액 - 약값 총액) × 35/100(임신부 외래진료의 경우에는 20/100,\n1세 미만 영유아 외래진료의 경우에는 10/100) + 약값 총액× 30/100(1세 미만\n영유아의 경우에는 21/100)\n의원,\n치과의원,\n한의원,\n보건의료원\n모든 지역\n일반환자\n요양급여비용 총액 × 30/100(임신부 외래진료의 경우에는 10/100, 1세 미만 영\n유아 외래진료의 경우에는 5/100).\n다만, 요양급여를 받는 사람이 65세 이상이면서 해당 요양급여비용 총액이 보건\n복지부령으로 정하는 금액을 넘지 않으면 보건복지부령으로 정하는 금액을 본인\n일부부담금으로 한다.\n의약분업\n예외환자\n(요양급여비용 총액 - 약값 총액) × 30/100(임신부 외래진료의 경우에는 10/100,\n1세 미만 영유아 외래진료의 경우에는 5/100) + 약값 총액 × 30/100(1세 미만\n영유아의 경우에는 21/100).\n다만, 요양급여를 받는 사람이 65세 이상이면서 해당 요양급여비용 총액이 보건\n복지부령으로 정하는 금액을 넘지 않으면 보건복지부령으로 정하는 금액을 본\n인일부부담금으로 한다.\n보건소,\n보건지소,\n보건진료소\n모든 지역\n\n요양급여비용 총액 × 30/100. 다만, 요양급여비용 총액이 보건복지부령으로 정\n하는 금액을 넘지않으면 보건복지부령으로 정하는 금액을 본인일부부담금으로 한\n다.\n(이하 생략)\n\n[별표 3]  본인부담상한액의 산정방법\n1. 본인부담상한액은 지역가입자의 세대별 보험료 부담수준 또는 직장가입자의 개인별 보험료 부담수준(이하 \"상한\n액기준보험료\"라 한다)을 구간으로 구분하여 다음 각 목의 구분에 따른 금액으로 한다.\n가. 2024 년 본인부담상한액: 다음 표에 따른 금액\n구분\n상한액기준보험료 구간\n120일 초과 입원\n그 밖의 경우\n자역가입자,\n직장가입자 및\n피부양자\n1구간\n138만원\n87만원\n2구간\n174 만원\n108만원\n3구간\n235만원\n167만원\n4 구간\n388만원\n313만원\n5구간\n557만원\n428만원\n\n6구간\n669만원\n514 만원\n7구간\n1,050만원\n808만원\n비고 : 위 표에서 “120 일 초과 입원”이란 「의료법」 제3 조제2 항제3 호라목에 따른 요양병원(「장애인복지법」\n제58 조제1 항제4 호에 따른 장애인 의료재활시설로서 「의료법」 제3 조의2 의 요건을 갖춘 의료기관인 요\n양병원은 제외한다)에 입원한 기간이 같은 연도에 120 일을 초과하는 경우를 말한다.\n나. 2025 년 이후 본인부담상한액: 다음 계산식에 따른 금액\n해당 연도 본인부담상한액  = 전년도 본인부담상한액  ×  (1 + 전국소비자물가변동률)\n비고\n1. 위 계산식에서 “본인부담상한액”이란 상한액기준보험료 구간별 금액을 말한다.\n2. 위 계산식에서 “전국소비자물가변동률”이란 「통계법」에 따라 통계청장이 매년 고시하는 전전년도와 대비한\n전년도 전국소비자물가변동률을 말하며, 전국소비자물가변동률이 100 분의 5 를 넘는 경우에는 100 분의\n5 로 한다.\n3. 위 계산식에 따라 산정한 금액 중 1 만원 미만의 금액은 버린다.\n2. 제1 호의 상한액기준보험료 구간은 다음 표와 같다. 이 경우 상한액기준보험료의 구체적인 산정 기준ㆍ방법 등에\n관하여 필요한 사항은 보건복지부장관이 정하여 고시한다.\n구분\n상한액기준보험료 구간\n지역가입자\n1구간 상한액기준보험료가 전체 지역가입자의 하위 100분의 10에 상당하는 금액으로서\n보건복지부장관이 정하여 고시하는 금액을 넘지 않는 경우\n2구간\n상한액기준보험료가 전체 지역가입자의 하위 100분의 10에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 30에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n3구간\n상한액기준보험료가 전체 지역가입자의 하위 100분의 30에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 50에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n4구간\n상한액기준보험료가 전체 지역가입자의 하위 100분의 50에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 70에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n5구간\n상한액기준보험료가 전체 지역가입자의 하위 100분의 70에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 80에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n6구간\n상한액기준보험료가 전체 지역가입자의 하위 100분의 80에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 90에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n7구간 상한액기준보험료가 전체 지역가입자의 하위 100분의 90에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘는 경우\n\n직장가입자 및\n피부양자\n1구간 상한액기준보험료가 전체 직장가입자의 하위 100분의 10에 상당하는 금액으로서\n보건복지부장관이 정하여 고시하는 금액을 넘지 않는 경우\n2구간\n상한액기준보험료가 전체 직장가입자의 하위 100분의 10에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 30에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n3구간\n상한액기준보험료가 전체 직장가입자의 하위 100분의 30에 상당하는 금액으로서\n보건복지부장관이 정하여 고시하는 금액을 넘고 하위 100분의 50에 상당하는 금액으로서\n보건복지부장관이 고시하는 금액을 넘지 않는 경우\n4구간\n상한액기준보험료가 전체 직장가입자의 하위 100분의 50에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 70에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n5구간\n상한액기준보험료가 전체 직장가입자의 하위 100분의 70에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 80에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n6구간\n상한액기준보험료가 전체 직장가입자의 하위 100분의 80에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘고 하위 100분의 90에 상당하는 금액으로서 보건복지\n부장관이 고시하는 금액을 넘지 않는 경우\n7구간 상한액기준보험료가 전체 직장가입자의 하위 100분의 90에 상당하는 금액으로서 보건복지\n부장관이 정하여 고시하는 금액을 넘는 경우\n비고 : 상한액기준보험료가 제32 조제2 호나목에 따른 월별 보험료액 하한 금액 이하인 지역가입자는 위 표에\n도 불구하고 1 구간에 해당하는 것으로 본다.\n\n■ 국민건강보험 요양급여의 기준에 관한 규칙\n\n제5 조(요양급여의 적용기준 및 방법)\n① (생략)\n② 제1 항에 따른 요양급여의 적용기준 및 방법에 관한 세부사항은 의약계·공단 및 건강보험심사평가원의 의견을 들\n어 보건복지부장관이 정하여 고시한다.\n③ 조혈모세포이식 및 심실 보조장치 치료술의 요양급여의 적용기준 및 방법에 관한 세부사항은 의약계·공단 및 건강\n보험심사평가원의 의견을 들어 보건복지부장관이 따로 정하여 각각 고시한다.\n④ (생략)\n\n제5 조의2(중증질환심의위원회)\n①중증환자에게 처방ㆍ투여되는 약제에 대한 요양급여 적용기준 및 방법에 대하여 심의하기 위하여 건강보험심사평가\n원에 중증질환심의위원회를 둔다.\n(이하 생략)\n\n제9 조(비급여대상)\n① 법 제41 조제4 항에 따라 요양급여의 대상에서 제외되는 사항(이하 \"비급여대상\"이라 한다)은 별표 2 와 같다\n\n[별표 2] 비급여대상\n1. 다음 각목의 질환으로서 업무 또는 일상생활에 지장이 없는 경우에 실시 또는 사용되는 행위·약제 및 치료재료\n가. 단순한 피로 또는 권태\n나. 주근깨·다모(多毛)·무모(無毛)·백모증(白毛症)·딸기코(주사비)·점(모반)·사마귀·여드름·노화현상\n으로 인한 탈모 등 피부질환\n다. 발기부전(impotence)·불감증 또는 생식기 선천성기형 등의 비뇨생식기 질환\n라. 단순 코골음\n마. 질병을 동반하지 아니한 단순포경(phimosis)\n바. 검열반 등 안과질환\n사. 기타 가목 내지 바목에 상당하는 질환으로서 보건복지부장관이 정하여 고시하는 질환\n(이하 생략)\n\n■ 국민기초생활 보장법\n\n제2조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. \"수급권자\"란 이 법에 따른 급여를 받을 수 있는 자격을 가진 사람을 말한다.\n2. \"수급자\"란 이 법에 따른 급여를 받는 사람을 말한다.\n(이하 생략)\n\n■ 근로자퇴직급여보장법\n\n제25 조(10 명 미만을 사용하는 사업에 대한 특례)\n① 상시 10 명 미만의 근로자를 사용하는 사업의 경우 제4 조제1 항 및 제5 조에도 불구하고 사용자가 개별 근로자의\n동의를 받거나 근로자의 요구에 따라 개인형퇴직연금제도를 설정하는 경우에는 해당 근로자에 대하여 퇴직급여제도를\n설정한 것으로 본다\n② 제1 항에 따라 개인형퇴직연금제도를 설정하는 경우에는 다음 각 호의 사항은 준수되어야 한다.\n1. 사용자가 퇴직연금사업자를 선정하는 경우에 개별 근로자의 동의를 받을 것. 다만, 근로자가 요구하는 경우에는 스\n스로 퇴직연금사업자를 선정할 수 있다.\n2. 사용자는 가입자별로 연간 임금총액의 12 분의 1 이상에 해당하는 부담금을 현금으로 가입자의 개인형퇴직연금제\n도 계정에 납입할 것\n3. 사용자가 부담하는 부담금 외에 가입자의 부담으로 추가 부담금을 납입할 수 있을 것\n4. 사용자는 매년 1 회 이상 정기적으로 제2 호에 따른 부담금을 가입자의 개인형퇴직연금제도 계정에 납입할 것. 이\n경우 납입이 지연된 부담금에 대한 지연이자의 납입에 관하여는 제20 조제3 항 후단 및 제4 항을 준용한다.\n5. 그 밖에 근로자의 급여 수급권의 안정적인 보호를 위하여 대통령령으로 정하는 사항\n③ 사용자는 개인형퇴직연금제도 가입자의 퇴직 등 대통령령으로 정하는 사유가 발생한 때에 해당 가입자에 대한 제2\n항제2 호에 따른 부담금을 납입하지 아니한 경우에는 그 사유가 발생한 날부터 14 일 이내에 그 부담금과 같은 항 제4\n호 후단에 따른 지연이자를 해당 가입자의 개인형퇴직연금제도의 계정에 납입하여야 한다. 다만, 특별한 사정이 있는 경\n우에는 당사자 간의 합의에 따라 납입 기일을 연장할 수 있다.\n\n■ 금융소비자 보호에 관한 법률\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. ~ 8. (생략)\n9. \"전문금융소비자\"란 금융상품에 관한 전문성 또는 소유자산규모 등에 비추어 금융상품 계약에 따른 위험감수능력\n이 있는 금융소비자로서 다음 각 목의 어느 하나에 해당하는 자를 말한다. 다만, 전문금융소비자 중 대통령령으로 정\n하는 자가 일반금융소비자와 같은 대우를 받겠다는 의사를 금융상품판매업자 또는 금융상품자문업자(이하 \"금융상\n품판매업자등\"이라 한다)에게 서면으로 통지하는 경우 금융상품판매업자등은 정당한 사유가 있는 경우를 제외하고\n는 이에 동의하여야 하며, 금융상품판매업자등이 동의한 경우에는 해당 금융소비자는 일반금융소비자로 본다.\n가. 국가\n나. 「한국은행법」에 따른 한국은행\n다. 대통령령으로 정하는 금융회사\n라. 「자본시장과 금융투자업에 관한 법률」 제9 조제15 항제3 호에 따른 주권상장법인(투자성 상품 중 대통령령\n으로 정하는 금융상품계약체결등을 할 때에는 전문금융소비자와 같은 대우를 받겠다는 의사를 금융상품판매업\n자등에게 서면으로 통지하는 경우만 해당한다)\n마. 그 밖에 금융상품의 유형별로 대통령령으로 정하는 자\n(이하 생략)\n\n제42 조(소액분쟁사건에 관한 특례)\n조정대상기관은 다음 각 호의 요건 모두를 충족하는 분쟁사건(이하 \"소액분쟁사건\"이라 한다)에 대하여 조정절차가 개\n시된 경우에는 제36 조제6 항에 따라 조정안을 제시받기 전에는 소를 제기할 수 없다. 다만, 제36 조제3 항에 따라 서\n면통지를 받거나 제36 조제5 항에서 정한 기간 내에 조정안을 제시받지 못한 경우에는 그러하지 아니하다.\n1. 일반금융소비자가 신청한 사건일 것\n2. 조정을 통하여 주장하는 권리나 이익의 가액이 2 천만원 이내에서 대통령령으로 정하는 금액 이하일 것\n\n제47 조(위법계약의 해지)\n① 금융소비자는 금융상품판매업자등이 제17 조제3 항, 제18 조제2 항, 제19 조제1 항·제3 항, 제20 조제1 항 또\n는 제21 조를 위반하여 대통령령으로 정하는 금융상품에 관한 계약을 체결한 경우 5 년 이내의 대통령령으로 정하는\n기간 내에 서면등으로 해당 계약의 해지를 요구할 수 있다. 이 경우 금융상품판매업자등은 해지를 요구받은 날부터 10\n일 이내에 금융소비자에게 수락여부를 통지하여야 하며, 거절할 때에는 거절사유를 함께 통지하여야 한다.\n② 금융소비자는 금융상품판매업자등이 정당한 사유 없이 제1 항의 요구를 따르지 않는 경우 해당 계약을 해지할 수 있\n다.\n③ 제1 항 및 제2 항에 따라 계약이 해지된 경우 금융상품판매업자등은 수수료, 위약금 등 계약의 해지와 관련된 비용\n을 요구할 수 없다.\n④ 제1 항부터 제3 항까지의 규정에 따른 계약의 해지요구권의 행사요건, 행사범위 및 정당한 사유 등과 관련하여 필\n요한 사항은 대통령령으로 정한다.\n\n■ 금융소비자 보호에 관한 법률 시행령\n\n제38 조(위법계약의 해지)\n① ~③ (생략)\n④ 법 제47 조제2 항에 따른 정당한 사유의 범위는 다음 각 호와 같다.\n1. 위반사실에 대한 근거를 제시하지 않거나 거짓으로 제시한 경우\n\n2. 계약 체결 당시에는 위반사항이 없었으나 금융소비자가 계약 체결 이후의 사정변경에 따라 위반사항을 주장하는 경\n우\n3. 금융소비자의 동의를 받아 위반사항을 시정한 경우\n4. 그 밖에 제1 호부터 제3 호까지의 경우에 준하는 것으로서 금융위원회가 정하여 고시하는 경우\n(이하 생략)\n\n■ 노인장기요양보험법\n\n제2 조(정의)\n이 법에서 사용하는 용어의 정의는 다음과 같다.\n(생략)\n4. “장기요양기관”이란 제31 조에 따른 지정을 받은 기관으로서 장기요양급여를 제공하는 기관을 말한다.\n(이하 생략)\n\n제15 조(등급판정 등)\n(생략)\n② 등급판정위원회는 신청인이 제12 조의 신청자격요건을 충족하고 6 개월 이상 동안 혼자서 일상생활을 수행하기\n어렵다고 인정하는 경우 심신상태 및 장기요양이 필요한 정도 등 대통령령으로 정하는 등급판정기준에 따라 수급자로\n판정한다.\n(생략)\n④ 공단은 장기요양급여를 받고 있거나 받을 수 있는 자가 다음 각 호의 어느 하나에 해당하는 것으로 의심되는 경우에는\n제14 조제1 항 각 호의 사항을 조사하여 그 결과를 등급판정위원회에 제출하여야 한다.\n1. 거짓이나 그 밖의 부정한 방법으로 장기요양인정을 받은 경우\n2. 고의로 사고를 발생하도록 하거나 본인의 위법행위에 기인하여 장기요양인정을 받은 경우\n⑤ 등급판정위원회는 제4 항에 따라 제출된 조사 결과를 토대로 제2 항에 따라 다시 수급자 등급을 조정하고 수급자\n여부를 판정할 수 있다.\n\n제23 조(장기요양급여의 종류)\n①이 법에 따른 장기요양급여의 종류는 다음 각 호와 같다.\n1. 재가급여\n가. 방문요양 : 장기요양요원이 수급자의 가정 등을 방문하여 신체활동 및 가사활동 등을 지원하는 장기요양급여\n나. 방문목욕 : 장기요양요원이 목욕설비를 갖춘 장비를 이용하여 수급자의 가정 등을 방문하여 목욕을 제공하는\n장기요양급여\n다. 방문간호 : 장기요양요원인 간호사 등이 의사, 한의사 또는 치과의사의 지시서(이하 \"방문간호지시서\"라\n한다)에 따라 수급자의 가정 등을 방문하여 간호, 진료의 보조, 요양에 관한 상담 또는 구강위생 등을 제공하는\n장기요양급여\n라. 주ㆍ야간보호 : 수급자를 하루 중 일정한 시간 동안 장기요양기관에 보호하여 신체활동 지원 및 심신기능의\n유지ㆍ향상을 위한 교육ㆍ훈련 등을 제공하는 장기요양급여\n마. 단기보호 : 수급자를 보건복지부령으로 정하는 범위 안에서 일정 기간 동안 장기요양기관에 보호하여 신체활동\n지원 및 심신기능의 유지ㆍ향상을 위한 교육ㆍ훈련 등을 제공하는 장기요양급여\n바. 기타재가급여 : 수급자의 일상생활ㆍ신체활동 지원 및 인지기능의 유지ㆍ향상에 필요한 용구(소프트웨어를\n포함한다)를 제공하거나 가정을 방문하여 재활에 관한 지원 등을 제공하는 장기요양급여로서 대통령령으로\n정하는 것\n\n2. 시설급여 : 장기요양기관에 장기간 입소한 수급자에게 신체활동 지원 및 심신기능의 유지ㆍ향상을 위한 교육ㆍ훈련\n등을 제공하는 장기요양급여\n3. 특별현금급여\n가. 가족요양비 : 제24 조에 따라 지급하는 가족장기요양급여\n나. 특례요양비 : 제25 조에 따라 지급하는 특례장기요양급여\n다. 요양병원간병비 : 제26 조에 따라 지급하는 요양병원장기요양급여\n(이하 생략)\n\n제29 조(장기요양급여의 제한)\n① 공단은 장기요양급여를 받고 있는 자가 정당한 사유 없이 제15 조제4 항에 따른 조사나 제60 조 또는 제61 조에\n따른 요구에 응하지 아니하거나 답변을 거절한 경우 장기요양급여의 전부 또는 일부를 제공하지 아니하게 할 수 있다.\n② 공단은 장기요양급여를 받고 있거나 받을 수 있는 자가 장기요양기관이 거짓이나 그 밖의 부정한 방법으로 장기요양\n급여비용을 받는 데에 가담한 경우 장기요양급여를 중단하거나 1 년의 범위에서 장기요양급여의 횟수 또는 제공 기간\n을 제한할 수 있다.\n③ 제2 항에 따른 장기요양급여의 중단 및 제한 기준과 그 밖에 필요한 사항은 보건복지부령으로 정한다.\n\n■ 노인장기요양보험법 시행령\n\n제2 조(노인성 질병)\n「노인장기요양보험법」(이하 \"법\"이라 한다) 제2 조제1 호에서 \"대통령령으로 정하는 노인성 질병\"이란 별표 1 에 따른\n질병을 말한다.\n\n[별표 1]\n노인성 질병의 종류\n구분\n질병명\n질병코드\n한국표준질병\nㆍ사인분류\n가. 알츠하이머병에서의 치매\nF00*\n나. 혈관성 치매\nF01\n다. 달리 분류된 기타 질환에서의 치매\nF02*\n라. 상세불명의 치매\nF03\n마. 알츠하이머병\nG30\n바. 지주막하출혈\nI60\n사. 뇌내출혈\nI61\n아. 기타 비외상성 두개내출혈\nI62\n자. 뇌경색증\nI63\n차. 출혈 또는 경색증으로 명시되지 않은 뇌졸중\nI64\n카. 뇌경색증을 유발하지 않은 뇌전동맥의 폐쇄 및 협착\nI65\n타. 뇌경색증을 유발하지 않은 대뇌동맥의 폐쇄 및 협착\nI66\n파. 기타 뇌혈관질환\nI67\n하. 달리 분류된 질환에서의 뇌혈관장애\nI68*\n거. 뇌혈관질환의 후유증\nI69\n너. 파킨슨병\nG20\n더. 이차성 파킨슨증\nG21\n\n러. 달리 분류된 질환에서의 파킨슨증\nG22*\n머. 기저핵의 기타 퇴행성 질환\nG23\n버. 중풍후유증\nU23.4\n서. 진전(震顫)\nR25.1\n어. 척수성 근위축 및 관련 증후군\nG12\n저. 달리 분류된 질환에서의 일차적으로 중추신경계통에 영향을 주는 계통성 위축\nG13*\n처. 다발경화증\nG35\n비고\n1. 질병명 및 질병코드는 「통계법」 제22 조에 따라 고시된 한국표준질병ㆍ사인 분류에 따른다.\n2. 진전은 보건복지부장관이 정하여 고시하는 범위로 한다.\n\n■ 독립유공자 예우에 관한 법률\n\n제6조(등록 및 결정)\n① 독립유공자, 그 유족 또는 가족으로서 이 법의 적용 대상자가 되려는 자는 대통령령으로 정하는 바에 따라 국가보훈\n부장관에게 등록을 신청하여야 한다.\n② 국가보훈부장관은 제1항에 따른 등록신청을 받은 때에는 대통령령으로 정하는 바에 따라 독립유공자의 요건과 그\n유족 또는 가족으로서의 요건을 확인한 후 「국가유공자 등 예우 및 지원에 관한 법률」 제74조의5에 따른 보훈심사위원\n회(이하 \"보훈심사위원회\"라 한다)의 심의·의결을 거쳐 독립유공자, 그 유족 또는 가족에 해당하는지를 결정한다. 다\n만, 독립유공자, 그 유족 또는 가족의 요건이 객관적인 사실에 의하여 확인된 경우로서 대통령령으로 정하는 경우에는\n보훈심사위원회의 심의·의결을 거치지 아니할 수 있다.\n③ 삭제\n\n④ 국가보훈부장관은 제4조 각 호의 어느 하나에 해당하는 적용 대상 독립유공자임에도 불구하고 본인 및 제5조에 따\n른 유족 등이 없어 등록신청을 할 수 없는 사람에 대해서는 독립유공자로 기록하고 예우 및 관리를 할 수 있다.\n\n■ 민법\n\n제27 조(실종의 선고)\n① 부재자의 생사가 5 년간 분명하지 아니한 때에는 법원은 이해관계인이나 검사의 청구에 의하여 실종선고를 하여야\n한다.\n② 전지에 임한 자, 침몰한 선박중에 있던 자, 추락한 항공기중에 있던 자 기타 사망의 원인이 될 위난을 당한 자의 생사\n가 전쟁종지후 또는 선박의 침몰, 항공기의 추락 기타 위난이 종료한 후 1 년간 분명하지 아니한 때에도 제1 항과 같다.\n\n제28 조(실종선고의 효과)\n실종선고를 받은 자는 전조의 기간이 만료한 때에 사망한 것으로 본다.\n\n■ 보험업감독규정\n\n제4-35 조의2(보험계약 중요사항의 설명의무)\n① ~⑥ 삭제\n⑦ 영 제43 조제4 항제3 호나목, 같은 조 제5 항제2 호나목, 제7 항제2 호 및 제10 항제1 호나목, 제43 조의2 제\n2 항제4 호에서 \"금융위원회가 정하는 기준\"이란 「전자금융거래법」 제21 조제2 항에 따른 기준을 말한다.\n\n⑧ 보험회사는 법 제95 조의2 제3 항 및 영 제42 조의2 제3 항제1 호바목ㆍ사목에 따라 보험계약 체결 단계에서 일\n반보험계약자에게 중요 사항을 설명할 때에는 다음 각 호의 사항을 준수하여야 한다.\n1. 다음 각 목의 보험계약에 대하여 설명할 것. 다만, 보험계약자가 법인인 보험계약 및 「노인복지법」 제26 조에 따른\n경로우대자 외의 자가 사이버몰을 이용하여 모집한 보험계약은 제외한다.\n가. 변액보험계약\n나. 저축성보험계약\n다. 장기보장성보험계약\n2. 청약 후 법 제102 조의4 제1 항에 따라 청약철회가 가능한 기간 이내에 설명할 것\n3. 다음 각 목의 사항을 설명할 것\n가. 보험계약의 청약 시 보험약관을 교부받고 보험계약의 중요 사항을 설명받아야 한다는 사실\n나. 보험계약의 청약 시 보험계약자가 청약서에 자필서명을 하여야 한다는 사실\n다. 보험계약의 청약 시 청약서 부본을 교부받아야 한다는 사실\n라. 가목부터 다목까지의 사항이 이행되지 않은 경우 청약일로부터 3 개월 이내에 해당 보험계약을 취소할 수 있다\n는 사실 및 그 취소 절차ㆍ방법\n마. 저축성보험계약 또는 변액보험계약의 경우 납입보험료중 사업비 등이 차감된 일부 금액이 특별계정에 투입되\n어 운용되거나 적용이율로 부리된다는 사실\n바. 저축성보험계약(금리확정형보험은 제외한다)의 경우 다음 각 세목의 사항\n1) 사업비 수준\n2) 해약환급금\n사. 변액보험계약의 경우 다음 각 세목의 사항\n1) 투자에 따르는 위험\n2) 예금자보호 대상이 되지 않는다는 사실\n아. 만기시 자동갱신되는 보험계약의 경우 보험료가 인상될 수 있다는 사실\n자. 「상법」 제662 조에 따른 보험금청구권 등의 소멸시효에 관한 사항\n차. 외화보험의 경우 다음 각 세목의 사항\n1) 환율변동에 따라 보험료 및 보험금이 변동될 수 있다는 사실\n2) 해약환급금\n카. 그 밖에 가목부터 차목까지에 준하는 사항으로서 감독원장이 정하는 사항\n4. 그 밖에 다음 각 목을 준수할 것\n가. 설명하기 전에 보험계약자 본인인지 여부를 확인할 것\n나. 보험계약 중요사항의 설명 확인 항목에 대한 충분한 이해시간을 확보할 것\n다. 기타 감독원장이 정하는 방법을 사용하여 설명하는 등 감독원장이 정하는 사항을 준수할 것\n⑨ 영 제42 조의2 제3 항제2 호다목의 \"조사 및 손해사정에 관하여 설명받아야 하는 사항으로서 금융위원회가 정하\n여 고시하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 해당 보험사고 및 보험금 청구가 법 제185 조 및 영 제96 조의3 에 따른 손해사정 대상인지 여부\n2. 제1 호에 따른 손해사정 대상인 경우 보험계약자 등은 법 제185 조제1 항제2 호 및 제9-16 조제2 항 및 제4\n항에 따라 따로 손해사정사를 선임할 수 있다는 사실 및 제9-16 조제5 항에 따른 손해사정 비용 부담에 관한 사항\n3. 보험계약자 등이 법 제185 조제1 항제2 호에 따라 손해사정사를 선임하려는 경우 보험회사의 동의기준\n4. 보험회사가 보험계약자 등의 손해사정사 선임에 동의하지 않는 경우 그 이유 및 근거\n5. 보험계약자 등이 따로 손해사정사를 선임하지 않은 경우 보험회사에 소속된 손해사정사 또는 보험회사와 위탁계\n약이 체결된 손해사정업자가 손해사정을 하게 된다는 사실\n⑩ 영 제42 조의2 제3 항제2 호라목의 \"그 밖에 일반보험계약자가 보험금 청구 단계에서 설명받아야 하는 사항으로\n서 금융위원회가 정하여 고시하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 보험금 지급심사 현황 결과 문의 및 조회 방법\n\n2. 보험약관에 따른 보험금 지급기한 및 보험금 지급지연시 지연이자 가산 등 보험회사의 조치사항\n3. 그 밖에 제1 호 및 제2 호에 준하는 사항으로서 감독원장이 정하는 사항\n⑪ 영 제42 조의2 제3 항제3 호 마목의 \"그 밖에 일반보험계약자가 보험금 심사ㆍ지급 단계에서 설명받아야 하는 사\n항으로서 금융위원회가 정하여 고시하는 사항\"이란 다음 각 호의 사항을 말한다.\n1. 보험회사가 손해사정 또는 보험금 심사에 참고하기 위하여 의료자문을 의뢰하는 경우, 의뢰 사유, 의뢰 내용 및 자\n문을 의뢰할 때 제공하는 자료의 내역\n2. 보험회사가 보험금을 감액 또는 부지급하는 경우, 제1 호에 따른 의료자문을 의뢰하였다면 자문을 의뢰한 기관과\n자문 의견\n3. 그 밖에 제1 호 및 제2 호에 준하는 사항으로서 감독원장이 정하는 사항\n\n■ 보험업법\n\n제108조(특별계정의 설정ㆍ운용)\n① 보험회사는 다음 각 호의 어느 하나에 해당하는 계약에 대하여는 대통령령으로 정하는 바에 따라 그 준비금에 상당\n하는 자산의 전부 또는 일부를 그 밖의 자산과 구별하여 이용하기 위한 계정(이하 \"특별계정\"이라 한다)을 각각 설정하\n여 운용할 수 있다.\n1. 「소득세법」 제20조의3제1항제2호 각 목 외의 부분에 따른 연금저축계좌를 설정하는 계약\n2. 「근로자퇴직급여 보장법」 제29조제2항에 따른 보험계약 및 법률 제10967호 근로자퇴직급여 보장법 전부개정법\n률 부칙 제2조제1항 본문에 따른 퇴직보험계약\n3. 변액보험계약(보험금이 자산운용의 성과에 따라 변동하는 보험계약을 말한다)\n4. 그 밖에 금융위원회가 필요하다고 인정하는 보험계약\n② 보험회사는 특별계정에 속하는 자산은 다른 특별계정에 속하는 자산 및 그 밖의 자산과 구분하여 회계처리하여야 한\n다.\n③ 보험회사는 특별계정에 속하는 이익을 그 계정상의 보험계약자에게 분배할 수 있다.\n④ 특별계정에 속하는 자산의 운용방법 및 평가, 이익의 분배, 자산운용실적의 비교ㆍ공시, 운용전문인력의 확보, 의결\n권 행사의 제한 등 보험계약자 보호에 필요한 사항은 대통령령으로 정한다.\n\n■ 보험업법 시행령\n\n제42조의2(설명의무의 중요 사항 등)\n① 삭제\n② 삭제\n③ 보험회사는 법 제95 조의2 제3 항 본문 및 제4 항에 따라 다음 각 호의 단계에서 중요 사항을 항목별로 일반보험계\n약자에게 설명해야 한다. 다만, 제1 호에 따른 보험계약 체결 단계(마목에 따른 보험계약 승낙 거절 시 거절사유로 한정\n한다), 제2 호에 따른 보험금 청구 단계 또는 제3 호에 따른 보험금 심사ㆍ지급 단계의 경우 일반보험계약자가 계약 체\n결 전에 또는 보험금 청구권자가 보험금 청구 단계에서 동의한 경우에 한정하여 서면, 문자메시지, 전자우편 또는 팩스\n등으로 중요 사항을 통보하는 것으로 이를 대신할 수 있다.\n1. 보험계약 체결 단계\n가. 보험의 모집에 종사하는 자의 성명, 연락처 및 소속\n나. 보험의 모집에 종사하는 자가 보험회사를 위하여 보험계약의 체결을 대리할 수 있는지 여부\n다. 보험의 모집에 종사하는 자가 보험료나 고지의무사항을 보험회사를 대신하여 수령할 수 있는지 여부\n라. 보험계약의 승낙절차\n마. 보험계약 승낙거절 시 거절 사유\n\n바. 「상법」 제638 조의3 제2 항에 따라 3 개월 이내에 해당 보험계약을 취소할 수 있다는 사실 및 그 취소 절차ㆍ\n방법\n사. 그 밖에 일반보험계약자가 보험계약 체결 단계에서 설명받아야 하는 사항으로서 금융위원회가 정하여 고시하\n는 사항\n2. 보험금 청구 단계\n가. 담당 부서, 연락처 및 보험금 청구에 필요한 서류\n나. 보험금 심사 절차, 예상 심사기간 및 예상 지급일\n다. 일반보험계약자가 보험사고 조사 및 손해사정에 관하여 설명받아야 하는 사항으로서 금융위원회가 정하여 고\n시하는 사항\n라. 그 밖에 일반보험계약자가 보험금 청구 단계에서 설명받아야 하는 사항으로서 금융위원회가 정하여 고시하는\n사항\n3. 보험금 심사ㆍ지급 단계\n가. 보험금 지급일 등 지급절차\n나. 보험금 지급 내역\n다. 보험금 심사 지연 시 지연 사유 및 예상 지급일\n라. 보험금을 감액하여 지급하거나 지급하지 아니하는 경우에는 그 사유\n마. 그 밖에 일반보험계약자가 보험금 심사ㆍ지급 단계에서 설명받아야 하는 사항으로서 금융위원회가 정하여 고\n시하는 사항\n④ 삭제\n⑤ 제3 항과 관련하여 필요한 세부 사항은 금융위원회가 정하여 고시한다\n\n■ 산업재해보상보험법 시행규칙\n\n제47 조(운동기능장해의 측정)\n① 비장해인의 신체 각 관절에 대한 평균 운동가능영역은 별표 4 와 같다.\n② (생략)\n③ 제2 항에 따라 해당 근로자의 신체 각 관절의 운동가능영역을 측정할 때에는 다음 각 호의 구분에 따른 방법으로 한\n다.\n1. 강직, 오그라듦, 신경손상 등 운동기능장해의 원인이 명확한 경우 : 근로자의 능동적 운동에 의한 측정방법\n2. 운동기능장해의 원인이 명확하지 아니한 경우 : 근로자의 수동적 운동에 의한 측정방법\n\n[별표 4]\n비장해인의 신체 각 관절에 대한 평균 운동가능영역\n구분\n관절명\n측정부위\n평균 운동 가능영역\n(각도)\n척주\n목뼈부(경추부)\n후두과(後頭顆: 뒤통수 관절융기)-목뼈1번 분절\n목뼈1번-목뼈2번 분절\n목뼈2번-목뼈3번 분절\n목뼈3번-목뼈4번 분절\n목뼈4번-목뼈5번 분절\n목뼈5번-목뼈6번 분절\n목뼈6번-목뼈7번 분절\n목뼈7번-등뼈1번 분절\n\n등뼈부(흉추부)\n등뼈1번-등뼈2번 분절\n등뼈2번-등뼈3번 분절\n등뼈3번-등뼈4번 분절\n등뼈4번-등뼈5번 분절\n등뼈5번-등뼈6번 분절\n등뼈6번-등뼈7번 분절\n등뼈7번-등뼈8번 분절\n등뼈8번-등뼈9번 분절\n등뼈9번-등뼈10번 분절\n등뼈10번-등뼈11번 분절\n등뼈11번-등뼈12번 분절\n허리뼈부(요추부)\n등뼈12번-허리뼈1번 분절\n허리뼈1번-허리뼈2번 분절\n허리뼈2번-허리뼈3번 분절\n허리뼈3번-허리뼈4번 분절\n허리뼈4번-허리뼈5번 분절\n허리뼈5번-엉치뼈1번 분절\n어깨관절\n앞위쪽올리기\n옆위쪽올리기\n뒤쪽올리기\n모으기\n안쪽 돌리기\n바깥쪽 돌리기\n팔꿈치관절\n펴기\n굽히기\n안쪽 돌리기\n바깥쪽 돌리기\n손목관절\n손등쪽 굽히기\n손바닥쪽 굽히기\n손목의 요골(橈骨: 노뼈)쪽 굽히기(요사위)\n손목의 척골(尺骨: 자뼈)쪽 굽히기(척사위)\n손허리손가락관절\n(중수지관절)\n엄지손가락\n펴기\n굽히기\n둘째 손가락\n펴기\n굽히기\n가운데손가락\n펴기\n굽히기\n넷째 손가락\n펴기\n굽히기\n새끼손가락\n펴기\n굽히기\n손가락관절\n엄지손가락\n펴기\n\n굽히기\n제1손가락관절\n(몸쪽 손가락뼈마디관절)\n둘째 손가락\n펴기\n굽히기\n가운데손가락\n펴기\n굽히기\n넷째 손가락\n펴기\n굽히기\n새끼손가락\n펴기\n굽히기\n제2손가락관절\n(끝쪽 손가락뼈마디관절)\n둘째 손가락\n펴기\n굽히기\n가운데손가락\n펴기\n굽히기\n넷째 손가락\n펴기\n굽히기\n새끼손가락\n펴기\n굽히기\n엉덩관절\n펴기\n굽히기\n모으기\n벌리기(외전)\n안쪽 돌리기\n바깥쪽 돌리기\n무릎관절\n펴기\n굽히기\n발목관절\n발등쪽 굽히기\n발바닥쪽 굽히기\n바깥쪽 뒤집기\n안쪽 뒤집기\n발허리발가락관절\n(중족지관절)\n엄지발가락\n발등쪽 굽히기\n발바닥쪽 굽히기\n둘째 발가락\n발등쪽 굽히기\n발바닥쪽 굽히기\n가운데발가락\n발등쪽 굽히기\n발바닥쪽 굽히기\n넷째 발가락\n발등쪽 굽히기\n발바닥쪽 굽히기\n새끼발가락\n발등쪽 굽히기\n발바닥쪽 굽히기\n\n발가락관절\n엄지발가락\n펴기\n굽히기\n제1발가락관절\n(몸쪽 발가락뼈마디관절)\n둘째 발가락\n펴기\n굽히기\n가운데발가락\n펴기\n굽히기\n넷째 발가락\n펴기\n굽히기\n새끼발가락\n펴기\n굽히기\n\n■ 상법\n\n제651 조(고지의무위반으로 인한 계약해지)\n보험계약당시에 보험계약자 또는 피보험자가 고의 또는 중대한 과실로 인하여 중요한 사항을 고지하지 아니하거나 부\n실의 고지를 한 때에는 보험자는 그 사실을 안 날로부터 1 월내에, 계약을 체결한 날로부터 3 년내에 한하여 계약을 해\n지할 수 있다. 그러나 보험자가 계약당시에 그 사실을 알았거나 중대한 과실로 인하여 알지 못한 때에는 그러하지 아니\n하다.\n\n■ 상법 시행령\n\n제44 조의2(타인의 생명보험)\n법 제731조제1항에 따른 본인 확인 및 위조ㆍ변조 방지에 대한 신뢰성을 갖춘 전자문서는 다음 각 호의 요건을 모두 갖\n춘 전자문서로 한다.\n1. 전자문서에 보험금 지급사유, 보험금액, 보험계약자와 보험수익자의 신원, 보험기간이 적혀 있을 것\n2. 전자문서에 법 제731조제1항에 따른 전자서명(이하 “전자서명”이라 한다)을 하기 전에 전자서명을 할 사람을 직\n접 만나서 전자서명을 하는 사람이 보험계약에 동의하는 본인임을 확인하는 절차를 거쳐 작성될 것\n3. 전자문서에 전자서명을 한 후에 그 전자서명을 한 사람이 보험계약에 동의한 본인임을 확인할 수 있도록 지문정보\n를 이용하는 등 법무부장관이 고시하는 요건을 갖추어 작성될 것\n4. 전자문서 및 전자서명의 위조ㆍ변조 여부를 확인할 수 있을 것\n\n■ 소득세법\n\n제14조(과세표준의 계산)\n① ~② (생략)\n③ 다음 각 호에 따른 소득의 금액은 종합소득과세표준을 계산할 때 합산하지 아니한다.\n1. 「조세특례제한법」 또는 이 법 제12조에 따라 과세되지 아니하는 소득\n2. 대통령령으로 정하는 일용근로자(이하 \"일용근로자\"라 한다)의 근로소득\n3. 제129조제2항의 세율에 따라 원천징수하는 이자소득 및 배당소득과 제16조제1항제10호에 따른 직장공제회 초\n과반환금\n4. 법인으로 보는 단체 외의 단체 중 수익을 구성원에게 배분하지 아니하는 단체로서 단체명을 표기하여 금융거래를\n\n하는 단체가 「금융실명거래 및 비밀보장에 관한 법률」 제2조제1호 각 목의 어느 하나에 해당하는 금융회사등(이\n하 \"금융회사등\"이라 한다)으로부터 받는 이자소득 및 배당소득\n5. 「조세특례제한법」에 따라 분리과세되는 소득\n6. 제3호부터 제5호까지의 규정 외의 이자소득과 배당소득(제17조제1항제8호에 따른 배당소득은 제외한다)으로서\n그 소득의 합계액이 2천만원(이하 \"이자소득등의 종합과세기준금액\"이라 한다) 이하이면서 제127조에 따라 원\n천징수된 소득\n7. 해당 과세기간에 대통령령으로 정하는 총수입금액의 합계액이 2천만원 이하인 자의 주택임대소득(이하 \"분리과\n세 주택임대소득\"이라 한다). 이 경우 주택임대소득의 산정 등에 필요한 사항은 대통령령으로 정한다.\n8. 다음 각 목에 해당하는 기타소득(이하 \"분리과세기타소득\"이라 한다).\n가. 제21조제1항제1호부터 제8호까지, 제8호의2, 제9호부터 제20호까지, 제22호, 제22호의 2 및 제26호에 따른\n기타소득(라목 및 마목의 소득은 제외한다)으로서 같은 조 제3항에 따른 기타소득금액이 300만원 이하이면서\n제127조에 따라 원천징수(제127조제1항제6호나목에 해당하여 원천징수되지 아니하는 경우를 포함한다)된 소\n득. 다만, 해당 소득이 있는 거주자가 종합소득과세표준을 계산할 때 그 소득을 합산하려는 경우 그 소득은 분리\n과세 기타소득에서 제외한다.\n나. 제21조제1항제21호에 따른 연금외수령한 기타소득\n다. 제21조제1항제27호 및 같은 조 제2항에 따른 기타소득\n라. 제21조제1항제2호에 따른 기타소득 중 「복권 및 복권기금법」 제2조에 따른 복권 당첨금\n마. 그 밖에 제21조제1항에 따른 기타소득 중 라목과 유사한 소득으로서 대통령령으로 정하는 기타소득\n9. 제20조의3제1항제2호 및 제3호에 따른 연금소득 중 다음 각 목에 해당하는 연금소득(다목의 소득이 있는 거주자\n가 종합소득 과세표준을 계산할 때 이를 합산하려는 경우는 제외하며, 이하 \"분리과세연금소득\"이라 한다)\n가. 제20조의3제1항제2호가목에 따라 퇴직소득을 연금수령하는 연금소득\n나. 제20조의3제1항제2호나목 및 다목의 금액을 의료목적, 천재지변이나 그 밖에 부득이한 사유 등 대통령령으로\n정하는 요건을 갖추어 인출하는 연금소득\n다. 가목 및 나목 외의 연금소득의 합계액이 연 1천500만원 이하인 경우 그 연금소득\n10. 삭제\n(이하 생략)\n\n제20조의3(연금소득)\n① 연금소득은 해당 과세기간에 발생한 다음 각 호의 소득으로 한다.\n1. 공적연금 관련법에 따라 받는 각종 연금(이하 \"공적연금소득\"이라 한다)\n2. 다음 각 목에 해당하는 금액을 그 소득의 성격에도 불구하고 연금계좌[“연금저축”의 명칭으로 설정하는 대통령령\n으로 정하는 계좌(이하 “연금저축계좌”라 한다) 또는 퇴직연금을 지급받기 위하여 설정하는 대통령령으로 정하는\n계좌(이하 “퇴직연금계좌”라 한다)를 말한다. 이하 같다]에서 대통령령으로 정하는 연금형태 등으로 인출(이하 “연\n금수령”이라 하며, 연금수령 외의 인출은“연금외수령”이라 한다)하는 경우의 그 연금\n가. 제146조제2항에 따라 원천징수되지 아니한 퇴직소득\n나. 제59조의3에 따라 세액공제를 받은 연금계좌 납입액\n다. 연금계좌의 운용실적에 따라 증가된 금액\n라. 그 밖에 연금계좌에 이체 또는 입금되어 해당 금액에 대한 소득세가 이연(移延)된 소득으로서 대통령령으로 정\n하는 소득\n3. 제2호에 따른 소득과 유사하고 연금 형태로 받는 것으로서 대통령령으로 정하는 소득\n② 공적연금소득은 2002년 1월 1일 이후에 납입된 연금 기여금 및 사용자 부담금(국가 또는 지방자치단체의 부담금을\n포함한다. 이하 같다)을 기초로 하거나 2002년 1월 1일 이후 근로의 제공을 기초로 하여 받는 연금소득으로 한다.\n③ 연금소득금액은 제1항 각 호에 따른 소득의 금액의 합계액(제2항에 따라 연금소득에서 제외되는 소득과 비과세소득\n의 금액은 제외하며, 이하 \"총연금액\"이라 한다)에서 제47조의2에 따른 연금소득공제를 적용한 금액으로 한다.\n\n④ 연금소득의 범위 및 계산방법과 그 밖에 필요한 사항은 대통령령으로 정한다.\n\n제21조(기타소득)\n① 기타소득은 이자소득ㆍ배당소득ㆍ사업소득ㆍ근로소득ㆍ연금소득ㆍ퇴직소득 및 양도소득 외의 소득으로서 다음 각\n호에서 규정하는 것으로 한다.\n1. ~ 20. (생략)\n21. 제20조의3제1항제2호나목 및 다목의 금액을 그 소득의 성격에도 불구하고 연금외수령한 소득\n(이하 생략)\n\n제44조(상속의 경우의 소득금액의 구분 계산)\n① 피상속인의 소득금액에 대한 소득세로서 상속인에게 과세할 것과 상속인의 소득금액에 대한 소득세는 구분하여 계\n산하여야 한다.\n② 연금계좌의 가입자가 사망하였으나 그 배우자가 연금외수령 없이 해당 연금계좌를 상속으로 승계하는 경우에는 제\n1항에도 불구하고 해당 연금계좌에 있는 피상속인의 소득금액은 상속인의 소득금액으로 보아 소득세를 계산한다.\n③ 제2항에 따른 연금계좌의 승계방법 및 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.\n\n제47조의2(연금소득공제)\n① 연금소득이 있는 거주자에 대해서는 해당 과세기간에 받은 총연금액(분리과세연금소득은 제외하며, 이하 이 항에서\n같다)에서 다음 표에 규정된 금액을 공제한다. 다만, 공제액이 900만원을 초과하는 경우에는 900만원을 공제한다.\n총연금액\n공제액\n350만원이하\n총연금액\n350만원초과\n700만원이하\n350만원\n+(350만원을 초과하는 금액의 100분의 40)\n700만원초과\n1400만원이하\n490만원\n+(700만원을 초과하는 금액의 100분의 20)\n1400만원초과\n630만원\n+(1400만원을 초과하는 금액의 100분의 10)\n② 제1항에 따른 공제를 \"연금소득공제\"라 한다.\n\n제51조의3(연금보험료공제)\n① 종합소득이 있는 거주자가 공적연금 관련법에 따른 기여금 또는 개인부담금(이하 \"연금보험료\"라 한다)을 납입한 경\n우에는 해당 과세기간의 종합소득금액에서 그 과세기간에 납입한 연금보험료를 공제한다.\n② 제1항에 따른 공제를 \"연금보험료공제\"라 한다.\n③ 다음 각 호에 해당하는 공제를 모두 합한 금액이 종합소득금액을 초과하는 경우 그 초과하는 금액을 한도로 연금보\n험료공제를 받지 아니한 것으로 본다.\n1. 제51조제3항에 따른 인적공제\n2. 이 조에 따른 연금보험료공제\n3. 제51조의4에 따른 주택담보노후연금 이자비용공제\n4. 제52조에 따른 특별소득공제\n5 .「조세특례제한법」에 따른 소득공제\n\n제59조의3(연금계좌세액공제)\n① 종합소득이 있는 거주자가 연금계좌에 납입한 금액 중 다음 각 호에 해당하는 금액을 제외한 금액(이하 \"연금계좌 납\n\n입액\"이라 한다)의 100분의 12[해당 과세기간에 종합소득과세표준을 계산할 때 합산하는 종합소득금액이 4천 500만\n원 이하(근로소득만 있는 경우에는 총급여액 5천 500만원 이하)인 거주자에 대해서는 100분의 15]에 해당하는 금액을\n해당 과세기간의 종합소득산출세액에서 공제한다. 다만, 연금계좌 중 연금저축계좌에 납입한 금액이 연 600만원을 초\n과하는 경우에는 그 초과하는 금액은 없는 것으로 하고, 연금저축계좌에 납입한 금액 중 600만원 이내의 금액과 퇴직연\n금계좌에 납입한 금액을 합한 금액이 연 900만원을 초과하는 경우에는 그 초과하는 금액은 없는 것으로 한다.\n1. 제146조제2항에 따라 소득세가 원천징수되지 아니한 퇴직소득 등 과세가 이연된 소득\n2. 연금계좌에서 다른 연금계좌로 계약을 이전함으로써 납입되는 금액\n② 제1항에 따른 공제를 “연금계좌세액공제”라 한다.\n③ 「조세특례제한법」 제91조의18에 따른 개인종합자산관리계좌의 계약 기간이 만료되고 해당 계좌 잔액의 전부 또는\n일부를 대통령령으로 정하는 방법으로 연금계좌로 납입한 경우 그 납입한 금액(이하 이 조에서 “전환금액”이라 한다)을\n납입한 날이 속하는 과세기간의 연금계좌 납입액에 포함한다.\n④ 전환금액이 있는 경우에는 제1항 각 호 외의 부분 단서에도 불구하고 같은 항을 적용할 때 전환금액의 100분의 10\n또는 300만원(직전 과세기간과 해당 과세기간에 걸쳐 납입한 경우에는 300만원에서 직전 과세기간에 적용된 금액을\n차감한 금액으로 한다) 중 적은 금액과 제1항 각 호 외의 부분 단서에 따라 연금계좌에 납입한 금액으로 하는 금액을 합\n한 금액을 초과하는 금액은 없는 것으로 한다.\n⑤ 제1항부터 제4항까지의 규정에 따른 연금계좌세액공제의 계산방법, 신청 절차 등에 관하여 필요한 사항은 대통령령\n으로 정한다.\n\n■ 소득세법 시행령\n\n제20조의2(의료 목적 또는 부득이한 인출의 요건 등)\n① 법 제14조제3항제9호나목에서 \"의료목적, 천재지변이나 그 밖에 부득이한 사유 등 대통령령으로 정하는 요건을 갖\n추어 인출하는 연금소득\"이란 다음 각 호의 어느 하나에 해당하여 법 제20조의3제1항제2호에 따른 연금계좌(이하 \"연\n금계좌\"라 한다)에서 인출하는 금액을 말한다.\n1. 다음 각 목의 어느 하나에 해당하는 사유가 발생하여 연금계좌에서 인출하려는 사람이 해당 사유가 확인된 날부터\n6개월 이내에 그 사유를 확인할 수 있는 서류를 갖추어 연금계좌를 취급하는 금융회사 등(이하 \"연금계좌취급자\"라\n한다)에게 제출하는 경우\n가. 천재지변\n나. 연금계좌 가입자의 사망 또는 「해외이주법」에 따른 해외이주\n다. 연금계좌 가입자 또는 그 부양가족[법 제50조에 따른 기본공제대상이 되는 사람(소득의 제한은 받지 아니한다)\n으로 한정한다]이 질병·부상에 따라 3개월 이상의 요양이 필요한 경우\n라. 연금계좌 가입자가 「재난 및 안전관리 기본법」 제66조제1항제2호의 재난으로 15일 이상의 입원 치료가 필요\n한 피해를 입은 경우\n마. 연금계좌 가입자가 「채무자 회생 및 파산에 관한 법률」에 따른 파산의 선고 또는 개인회생절차개시의 결정을 받\n은 경우\n바. 연금계좌취급자의 영업정지, 영업 인·허가의 취소, 해산결의 또는 파산선고\n2. 제40조의2제3항제1호 및 제2호를 충족한 연금계좌 가입자가 제118조의5제1항 및 제2항에 따른 의료비(본인을\n위한 의료비에 한정한다)를 연금계좌에서 인출하기 위하여 해당 의료비를 지급한 날부터 6개월 이내에 기획재정부\n령으로 정하는 증명서류를 연금계좌취급자에게 제출하는 경우\n② 제1항제1호다목 및 라목에 따라 인출하는 금액은 제118조의5제1항 및 제2항에 따른 의료비, 간병인 비용, 보건복\n지부 장관이 고시하는 최저생계비 등을 고려하여 기획재정부령으로 정하는 금액 이내의 금액으로 한정한다.\n③ 제1항제2호에 따라 의료비를 인출하는 경우에는 1명당 하나의 연금계좌만 의료비연금계좌로 지정(해당 연금계좌의\n연금계좌취급자가 지정에 동의하는 경우에 한정한다)하여 인출할 수 있다.\n\n④ 연금계좌취급자는 제1항제1호 및 제2호에 따라 제출받은 증명서류를 해당 인출에 대한 원천징수세액 납부기한의\n다음 날부터 5년간 보관하여야 한다.\n⑤ 제1항부터 제4항까지의 규정에서 정한 사항 외에 연금계좌 인출의 절차 등에 필요한 사항은 기획재정부령으로 정한\n다.\n\n제40조의2(연금계좌 등)\n① 법 제20조의3제1항제2호 각 목 외의 부분에서 \"연금저축\"의 명칭으로 설정하는 대통령령으로 정하는 계좌\"란 제1\n호에 해당하는 계좌를 말하고, \"퇴직연금을 지급받기 위하여 설정하는 대통령령으로 정하는 계좌\"란 제2호에 해당하는\n계좌를 말한다.\n1. 다음 각 목의 어느 하나에 해당하는 금융회사 등과 체결한 계약에 따라 \"연금저축\"이라는 명칭으로 설정하는 계좌\n(이하 \"연금저축계좌\"라 한다)\n가. 「자본시장과 금융투자업에 관한 법률」 제12조에 따라 인가를 받은 신탁업자와 체결하는 신탁계약\n나. 「자본시장과 금융투자업에 관한 법률」 제12조에 따라 인가를 받은 투자중개업자와 체결하는 집합투자증권 중\n개계약\n다. 제25조제2항에 따른 보험계약을 취급하는 기관과 체결하는 보험계약\n2. 퇴직연금을 지급받기 위하여 가입하여 설정하는 다음 각 목의 어느 하나에 해당하는 계좌(이하 \"퇴직연금계좌\"라\n한다)\n가. 「근로자퇴직급여 보장법」 제2조제9호의 확정기여형퇴직연금제도에 따라 설정하는 계좌\n나. 「근로자퇴직급여 보장법」 제2조제10호의 개인형퇴직연금제도에 따라 설정하는 계좌\n다. 「근로자퇴직급여 보장법」에 따른 중소기업퇴직연금기금제도에 따라 설정하는 계좌\n라. 「과학기술인공제회법」 제16조제1항에 따른 퇴직연금급여를 지급받기 위하여 설정하는 계좌\n② 연금계좌의 가입자가 다음 각 호의 요건을 모두 갖춘 경우 법 제59조의3제1항에 따른 연금계좌 납입액(제118조의3\n에 따라 연금계좌에 납입한 것으로 보는 금액을 포함하며, 이하 \"연금보험료\"라 한다)으로 볼 수 있다.\n1. 다음 각 목의 금액(다목 및 라목에 따라 연금계좌로 납입하는 총 누적금액의 합계액은 1억원을 한도로 한다)을 합\n한 금액 이내(연금계좌가 2개 이상인 경우에는 그 합계액을 말한다)의 금액을 납입할 것. 이 경우 해당 과세기간 이전\n의 연금보험료는 납입할 수 없으나, 보험계약의 경우에는 최종납입일이 속하는 달의 말일부터 3년 2개월이 경과하\n기 전에는 그 동안의 연금보험료를 납입할 수 있다.\n가. 연간 1천800만원\n나. 법 제59조의3제3항에 따른 전환금액[「조세특례제한법」 제91조의18에 따른 개인종합자산관리계좌(이하 \"개\n인종합자산관리계좌\"라 한다)의 계약기간 만료일 기준 잔액을 한도로 개인종합자산관리계좌에서 연금계좌로 납\n입한 금액을 말한다. 다만, 직전 과세기간과 해당 과세기간에 걸쳐 납입한 경우에는 개인종합자산관리계좌의 계\n약기간 만료일 기준 잔액에서 직전 과세기간에 납입한 금액을 차감한 금액을 한도로 개인종합자산관리계좌에서\n연금계좌로 납입한 금액을 말한다]\n다. 국내에 소유한 주택(이하 이 조에서 “연금주택”이라 한다)을 양도하고 이를 대체하여 다른 주택(이하 이 조에\n서 “축소주택”이라 한다)을 취득하거나 취득하지 않은 거주자로서 다음의 요건을 모두 충족하는 거주자가 연금주\n택 양도가액에서 축소주택 취득가액(취득하지 않은 경우에는 0으로 한다)을 뺀 금액(해당 금액이 0보다 작은 경\n우에는 0으로 하며, 이하 이 조에서 “주택차액”이라 한다) 중 연금계좌로 납입하는 금액\n1) 연금주택 양도일 현재 거주자 또는 그 배우자가 60세 이상일 것\n2) 연금주택 양도일 현재 거주자 및 그 배우자가 국내에 소유한 주택을 합산했을 때 연금주택 1주택만 소유하고\n있을 것. 다만, 연금주택을 양도하기 전에 축소주택을 취득한 경우로서 축소주택을 취득한 날부터 6개월 이내에\n연금주택을 양도한 경우에는 연금주택 양도일 현재 연금주택 1주택만 소유하고 있는 것으로 본다.\n3) 연금주택 양도일 현재 연금주택의 법 제99조에 따른 기준시가가 12억원 이하일 것\n4) 축소주택의 취득가액이 연금주택의 양도가액 미만일 것(축소주택을 취득한 경우에만 해당한다)\n5) 연금주택 양도일부터 6개월 이내에 주택차액을 연금주택 소유자의 연금계좌로 납입할 것\n\n라. 국내에 소유한 토지 또는 건물(이하 이 조에서 “연금부동산”이라 한다)을 양도한 거주자로서 다음의 요건을 모\n두 충족하는 거주자가 연금부동산의 양도가액에서 연금부동산의 취득가액을 뺀 금액(해당 금액이 0보다 작은 경\n우에는 0으로 하며, 이하 이 조에서 “연금부동산 양도차액”이라 한다) 중 연금계좌로 납입하는 금액\n1) 연금부동산 양도일 현재 거주자가 「기초연금법」 제2조제3호에 따른 기초연금 수급자일 것\n2) 연금부동산 양도일 현재 거주자 및 그 배우자가 1주택 또는 무주택 세대의 구성원일 것\n3) 연금부동산 양도일 현재 연금부동산을 보유한 기간이 10년 이상일 것\n4) 연금부동산 양도일부터 6개월 이내에 연금부동산 양도차액을 연금부동산 소유자의 연금계좌로 납입할 것\n2. 연금수령 개시를 신청한 날(연금수령 개시일을 사전에 약정한 경우에는 약정에 따른 개시일을 말한다) 이후에는\n연금보험료를 납입하지 않을 것\n③ 법 제20조의3제1항제2호 각 목 외의 부분에서 \"대통령령으로 정하는 연금형태 등으로 인출\"이란 연금계좌에서 다\n음 각 호의 요건을 모두 갖추어 인출하거나 제20조의2제1항에 따라 인출(이하 \"연금수령\"이라 하며, 연금수령 외의 인\n출은 \"연금외수령\"이라 한다)하는 것을 말한다. 다만, 법 제20조의3제1항제2호가목의 퇴직소득을 제20조의2제1항제\n1호나목에 따른 해외이주에 해당하는 사유로 인출하는 경우에는 해당 퇴직소득을 연금계좌에 입금한 날부터 3년 이후\n해외이주하는 경우에 한정하여 연금수령으로 본다.\n1. 가입자가 55세 이후 연금계좌취급자에게 연금수령 개시를 신청한 후 인출할 것\n2. 연금계좌의 가입일부터 5년이 경과된 후에 인출할 것. 다만, 법 제20조의3제1항제2호가목에 따른 금액(퇴직소\n득이 연금계좌에서 직접 인출되는 경우를 포함하며, 이하 \"이연퇴직소득\"이라 한다)이 연금계좌에 있는 경우에는\n그러하지 아니한다.\n3. 과세기간 개시일(연금수령 개시를 신청한 날이 속하는 과세기간에는 연금수령 개시를 신청한 날로 한다) 현재 다\n음의 계산식에 따라 계산된 금액(이하 \"연금수령한도\"라 한다) 이내에서 인출할 것. 이 경우 제20조의2제1항에 따\n라 인출한 금액은 인출한 금액에 포함하지 아니한다.\n연금계좌의 평가액                120\n──────────  ×   ────\n(11 - 연금수령연차)             100\n④ 제3항제3호의 계산식에서 \"연금수령연차\"란 최초로 연금수령할 수 있는 날이 속하는 과세기간을 기산연차로 하여\n그 다음 과세기간을 누적 합산한 연차를 말하며, 연금수령연차가 11년 이상인 경우에는 그 계산식을 적용하지 아니한\n다. 다만, 다음 각 호의 어느 하나에 해당하는 경우의 기산연차는 다음 각 호를 따른다.\n1. 2013년 3월 1일 전에 가입한 연금계좌[2013년 3월 1일 전에 「근로자퇴직급여 보장법」 제2조제8호에 따른 확정\n급여형퇴직연금제도(이하 \"확정급여형퇴직연금제도\"라 한다)에 가입한 사람이 퇴직하여 퇴직소득 전액이 새로 설\n정된 연금계좌로 이체되는 경우를 포함한다]의 경우: 6년차\n2. 법 제44조제2항에 따라 연금계좌를 승계한 경우: 사망일 당시 피상속인의 연금수령연차\n⑤ 연금계좌에서 연금수령한도를 초과하여 인출하는 금액은 연금외수령하는 것으로 본다.\n⑥ 연금계좌 가입자가 연금수령개시 또는 연금계좌의 해지를 신청하는 경우 연금계좌취급자는 기획재정부령으로 정하\n는 연금수령개시 및 해지명세서를 다음 달 10일까지 관할 세무서장에게 제출하여야 한다.\n⑦ 거주자는 주택차액 또는 연금부동산 양도차액(이하 이 조에서 “주택차액등”이라 한다)을 연금계좌에 납입하려는 경\n우 기획재정부령으로 정하는 신청서에 다음 각 호의 서류를 첨부하여 연금계좌취급자에게 제출해야 한다.\n1. 연금주택 또는 연금부동산 매매계약서\n2. 축소주택 매매계약서(축소주택을 매입한 경우만 해당한다)\n3. 그 밖에 기획재정부령으로 정하는 서류\n⑧ 거주자가 주택차액등을 연금계좌에 납입한 후 다음 각 호의 어느 하나에 해당하게 된 경우에는 그 납입일부터 연금\n계좌에 납입한 금액 전액을 연금보험료로 보지 않는다.\n1. 주택차액등을 연금계좌에 납입할 당시 제2항제1호다목 또는 라목의 요건을 충족하지 못한 사실이 확인된 경우\n2. 주택차액을 연금계좌에 납입한 날부터 5년 이내에 주택을 새로 취득한 경우로서 연금주택의 양도가액에서 새로\n\n취득한 주택의 취득가액을 뺀 금액이 연금계좌에 납입한 금액보다 작은 경우\n⑨ 국세청장은 주택차액등을 연금계좌에 납입한 거주자가 제8항 각 호에 해당하는지 여부를 확인한 후 그에 해당하는\n사람이 있으면 그 사실을 매년 2월 말일까지 해당 연금계좌취급자에게 통보해야 하고, 연금계좌취급자는 이를 해당 거\n주자에게 통보해야 한다.\n⑩ 연금계좌취급자는 제9항에 따른 통보를 받은 경우 제8항에 따라 연금보험료로 보지 않는 주택차액등 연금계좌 납입\n금과 그 운용실적에 따라 증가된 금액을 거주자에게 반환해야 한다. 이 경우 거주자는 그 반환 금액을 연금외수령하는\n것으로 본다..\n⑪ 1주택을 둘 이상의 거주자가 공동으로 소유하고 있는 경우에는 지분비율만큼 각각 1주택을 소유한 것으로 보아 제2\n항제1호다목·라목 및 제7항부터 제10항까지의 규정을 적용한다. 다만, 1주택을 거주자와 그 배우자가 공동으로 소유\n하고 있는 경우에는 함께 1주택을 소유한 것으로 보아 제2항제1호다목2) 및 같은 호 라목2)를 적용한다.\n⑫ 제11항을 적용할 때 제2항제1호다목3)에 따른 기준시가는 주택의 소유 지분에도 불구하고 해당 주택 전체에 대한\n기준시가를 말하며, 주택의 소유 지분을 양도하거나 취득하는 경우 같은 목 4)에 따른 양도가액 및 취득가액은 해당 주\n택 전체를 기준으로 한 가액으로서 기획재정부령으로 정하는 바에 따라 계산한 가액으로 한다.\n(이하 생략)\n\n제40조의3(연금계좌의 인출순서 등)\n① 연금계좌에서 일부 금액이 인출되는 경우에는 다음 각 호의 금액이 순서에 따라 인출되는 것으로 본다.\n1. 법 제20조의3제1항제2호 각 목에 해당하지 아니하는 금액(이하 \"과세제외금액\"이라 한다)\n2. 이연퇴직소득\n3. 법 제20조의3제1항제2호나목부터 라목까지의 규정에 따른 금액\n② 과세제외금액은 다음 각 호의 순서에 따라 인출되는 것으로 본다. 다만, 제4호는 제201조의10에 따라 확인되는 금\n액만 해당하며, 확인되는 날부터 과세제외금액으로 본다.\n1. 인출된 날이 속하는 과세기간에 해당 연금계좌에 납입한 연금보험료(제2호에 해당하는 금액은 제외한다)\n2. 인출된 날이 속하는 과세기간에 해당 연금계좌에 납입한 법 제59조의3제3항에 따른 전환금액\n3. 해당 연금계좌만 있다고 가정할 때 해당 연금계좌에 납입된 연금보험료로서 법 제59조의3제1항 단서에 따른 연\n금계좌세액공제의 한도액(이하 이 조에서 “연금계좌세액공제 한도액”이라 한다)을 초과하는 금액이 있는 경우 그\n초과하는 금액\n4. 제1호부터 제3호까지에서 정한 금액 외에 해당 연금계좌에 납입한 연금보험료 중 연금계좌세액공제를 받지 아니\n한 금액\n③ 인출된 금액이 연금수령한도를 초과하는 경우에는 연금수령분이 먼저 인출되고 그 다음으로 연금외수령분이 인출되\n는 것으로 본다.\n④ 연금계좌에 납입한 연금보험료 중 연금계좌세액공제 한도액 이내의 연금보험료는 납입일이 속하는 과세기간의 다음\n과세기간 개시일(납입일이 속하는 과세기간에 연금수령 개시를 신청한 날이 속하는 경우에는 연금수령 개시를 신청한\n날)부터 제1항제3호 중 법 제20조의3제1항제2호나목에 따른 세액공제를 받은 금액으로 본다.\n⑤ 연금계좌의 운용에 따라 연금계좌에 있는 금액이 원금에 미달하는 경우 연금계좌에 있는 금액은 원금이 제1항에 따\n른 인출순서와 반대의 순서로 차감된 후의 금액으로 본다.\n\n제40조의4(연금계좌의 이체)\n① 연금계좌에 있는 금액이 연금수령이 개시되기 전의 다른 연금계좌로 이체되는 경우에는 이를 인출로 보지 아니하다.\n다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니한다.\n1. 연금저축계좌와 퇴직연금계좌 상호 간에 이체되는 경우\n2. 2013년 3월 1일 이후에 가입한 연금계좌에 있는 금액이 2013년 3월 1일 전에 가입한 연금계좌로 이체되는 경우\n3. 퇴직연금계좌에 있는 일부 금액이 이체되는 경우\n② 제1항 단서 및 같은 항 제1호에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 인출로 보지 아니한다.\n\n1. 제40조의2제3항제1호 및 제2호의 요건을 갖춘 연금저축계좌의 가입자가 제40조의2제1항제2호나목에 해당하\n는 퇴직연금계좌로 전액을 이체(연금수령이 개시된 경우를 포함한다)하는 경우\n2. 제40조의2제3항제1호 및 제2호의 요건을 갖춘 퇴직연금계좌(제40조의2제1항제2호나목에 해당하는 경우에 한\n정한다)의 가입자가 연금저축계좌로 전액을 이체(연금수령이 개시된 경우를 포함한다)하는 경우\n③ 제1항을 적용할 때 일부 금액이 이체(제1항제3호의 경우를 제외한다)되는 경우에는 제40조의3제1항 각 호의 순서\n에 따라 이체되는 것으로 본다.\n④ 제1항 및 제2항을 적용할 때 연금계좌의 가입일 등은 이체받은 연금계좌를 기준으로 이 영을 적용한다. 다만, 연금계\n좌가 새로 설정되어 전액이 이체되는 경우에는 이체되기 전의 연금계좌를 기준으로 할 수 있다.\n⑤ 연금계좌의 이체에 따라 연금계좌취급자가 변경되는 경우에는 이체하는 연금계좌취급자가 이체와 함께 기획재정부\n령으로 정하는 연금계좌이체명세서를 이체받는 연금계좌취급자에게 통보하여야 한다.\n\n제100조의2(연금계좌의 승계 등)\n① 법 제44조제2항에 따라 상속인이 연금계좌를 승계하는 경우 해당 연금계좌의 소득금액을 승계하는 날에 그 연금계\n좌에 가입한 것으로 본다. 다만, 제40조의2제3항제2호의 연금계좌의 가입일은 피상속인의 가입일로 하여 적용한다.\n② 법 제44조제2항에 따라 연금계좌를 승계하려는 상속인은 피상속인이 사망한 날이 속하는 달의 말일부터 6개월 이\n내에 연금계좌취급자에게 승계신청을 하여야 한다. 이 경우 상속인은 피상속인이 사망한 날부터 연금계좌를 승계한 것\n으로 본다.\n③ 제2항 전단에 따른 승계신청을 받은 연금계좌 취급자는 사망일부터 승계신청일까지 인출된 금액에 대하여 이를 피\n상속인이 인출한 소득으로 보아 이미 원천징수된 세액과 상속인이 인출한 금액에 대한 세액과의 차액이 있으면 세액을\n정산하여야 한다.\n④ 연금계좌의 가입자가 사망하였으나 제2항 전단에 따른 승계신청을 하지 아니한 경우에는 사망일 현재 다음 각 호의\n합계액을 인출하였다고 보아 계산한 세액에서 사망일부터 사망확인일(연금계좌취급자가 확인한 날을 말하며, 사망확\n인일이 승계신청기한 이전인 경우에는 신청기한의 말일로 하고, 상속인이 신청기한이 지나기 전에 인출하는 경우에는\n인출하는 날을 말한다. 이하 이 항에서 같다)까지 이미 원천징수된 세액을 뺀 금액을 피상속인의 소득세로 한다.\n1. 사망일부터 사망확인일까지 인출한 소득\n2. 사망확인일 현재 연금계좌에 있는 소득\n\n■ 신문 등의 진흥에 관한 법률\n\n제2 조(정의)\n이 법에서 사용하는 용어의 정의는 다음과 같다.\n1. \"신문\"이란 정치·경제·사회·문화·산업·과학·종교·교육·체육 등 전체 분야 또는 특정 분야에 관한 보도\n·논평·여론 및 정보 등을 전파하기 위하여 같은 명칭으로 월 2 회 이상 발행하는 간행물로서 다음 각 목의 것을\n말한다.\n가. 일반일간신문: 정치·경제·사회·문화 등에 관한 보도·논평 및 여론 등을 전파하기 위하여 매일 발행하는\n간행물\n나. 특수일간신문: 산업·과학·종교·교육 또는 체육 등 특정 분야(정치를 제외한다)에 국한된 사항의 보도·논\n평 및 여론 등을 전파하기 위하여 매일 발행하는 간행물\n다. 일반주간신문: 정치·경제·사회·문화 등에 관한 보도·논평 및 여론 등을 전파하기 위하여 매주 1 회 발행\n하는 간행물(주 2 회 또는 월 2 회 이상 발행하는 것을 포함한다)\n라. 특수주간신문: 산업·과학·종교·교육 또는 체육 등 특정 분야(정치는 제외한다)에 국한된 사항의 보도·논\n평 및 여론 등을 전파하기 위하여 매주 1 회 발행하는 간행물(주 2 회 또는 월 2 회 이상 발행하는 것을 포함한\n다)\n\n(이하 생략)\n\n제9 조(등록)\n① 신문을 발행하거나 인터넷신문 또는 인터넷뉴스서비스를 전자적으로 발행하려는 자는 대통령령으로 정하는 바에 따\n라 다음 각 호의 사항을 주사무소 소재지를 관할하는 특별시장·광역시장·특별자치시장·도지사 또는 특별자치도지\n사(이하 \"시·도지사\"라 한다)에게 등록하여야 한다. 등록된 사항이 변경된 때에도 또한 같다. 다만, 국가 또는 지방자치\n단체가 발행 또는 관리하거나 법인이나 그 밖의 단체 또는 기관이 그 소속원에게 보급할 목적으로 발행하는 경우와 대\n통령령으로 정하는 경우에는 그러하지 아니하다.\n1.~8.(생략)\n9. 주된 보급대상 및 보급지역(신문에 한정한다)\n(이하 생략)\n\n■ 신용정보의 이용 및 보호에 관한 법률\n\n제32 조(개인신용정보의 제공·활용에 대한 동의)\n① 신용정보제공·이용자가 개인신용정보를 타인에게 제공하려는 경우에는 대통령령으로 정하는 바에 따라 해당 신용\n정보주체로부터 다음 각 호의 어느 하나에 해당하는 방식으로 개인신용정보를 제공할 때마다 미리 개별적으로 동의를\n받아야 한다. 다만, 기존에 동의한 목적 또는 이용 범위에서 개인신용정보의 정확성·최신성을 유지하기 위한 경우에는\n그러하지 아니하다.\n1. 서면\n2. 「전자서명법」 제2 조제2 호에 따른 전자서명(서명자의 실지명의를 확인할 수 있는 것을 말한다)이 있는 전자문\n서(「전자문서 및 전자거래 기본법」 제2 조제1 호에 따른 전자문서를 말한다)\n3. 개인신용정보의 제공 내용 및 제공 목적 등을 고려하여 정보 제공 동의의 안정성과 신뢰성이 확보될 수 있는 유무\n선 통신으로 개인비밀번호를 입력하는 방식\n4. 유무선 통신으로 동의 내용을 해당 개인에게 알리고 동의를 받는 방법. 이 경우 본인 여부 및 동의 내용, 그에 대한\n해당 개인의 답변을 음성녹음하는 등 증거자료를 확보·유지하여야 하며, 대통령령으로 정하는 바에 따른 사후 고\n지절차를 거친다.\n5. 그 밖에 대통령령으로 정하는 방식\n(이하 생략)\n\n제33 조(개인신용정보의 이용)\n① 개인신용정보는 다음 각 호의 어느 하나에 해당하는 경우에만 이용하여야 한다.\n1. 해당 신용정보주체가 신청한 금융거래 등 상거래관계의 설정 및 유지 여부 등을 판단하기 위한 목적으로 이용하\n는 경우\n2. 제1 호의 목적 외의 다른 목적으로 이용하는 것에 대하여 신용정보주체로부터 동의를 받은 경우\n3. 개인이 직접 제공한 개인신용정보(그 개인과의 상거래에서 생긴 신용정보를 포함한다)를 제공받은 목적으로 이\n용하는 경우(상품과 서비스를 소개하거나 그 구매를 권유할 목적으로 이용하는 경우는 제외한다)\n4. 제32 조 제6 항 각 호의 경우\n5. 그 밖에 제1 호부터 제4 호까지의 규정에 준하는 경우로서 대통령령으로 정하는 경우\n② 신용정보회사등이 개인의 질병, 상해 또는 그 밖에 이와 유사한 정보를 수집·조사하거나 제3 자에게 제공하려면 미\n리 제32 조 제1 항 각 호의 방식으로 해당 개인의 동의를 받아야 하며, 대통령령으로 정하는 목적으로만 그 정보를 이\n용하여야 한다.\n\n■ 신용정보의 이용 및 보호에 관한 법률 시행령\n\n제28 조(개인신용정보의 제공ㆍ활용에 대한 동의)\n① 삭제\n② 신용정보제공·이용자는 법 제32 조제1 항 각 호 외의 부분 본문에 따라 해당 신용정보주체로부터 동의를 받으려\n면 다음 각 호의 사항을 미리 알려야 한다. 다만, 동의 방식의 특성상 동의 내용을 전부 표시하거나 알리기 어려운 경우\n에는 해당 기관의 인터넷 홈페이지 주소나 사업장 전화번호 등 동의 내용을 확인할 수 있는 방법을 안내하고 동의를 받\n을 수 있다.\n1. 개인신용정보를 제공받는 자\n2. 개인신용정보를 제공받는 자의 이용 목적\n3. 제공하는 개인신용정보의 내용\n4. 개인신용정보를 제공받는 자(개인신용평가회사, 개인사업자신용평가회사, 기업신용조회회사 및 신용정보집중기\n관은 제외한다)의 정보 보유 기간 및 이용 기간\n5. 동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우에는 그 불이익의 내용\n(이하 생략)\n\n제28 조의2(개인신용정보의 이용)\n\n법 제33 조제2 항에서 “대통령령으로 정하는 목적”이란 다음 각 호의 어느 하나에 해당하는 업무를 수행하기 위해\n필요한 경우 해당 각 호의 자가 개인의 질병, 상해 또는 그 밖에 이와 유사한 정보를 그 업무와 관련하여 이용하기 위한\n목적을 말한다.\n1. 「보험업법」 제2 조제6 호에 따른 보험회사가 수행하는 같은 조 제2 호에 따른 보험업 또는 같은 법 제11 조의2\n에 따른 부수업무로서 개인의 건강 유지ㆍ증진 또는 질병의 사전예방 및 악화 방지 등의 목적으로 수행하는 업무\n(이하 생략)\n\n■ 약사법\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. \"약사(藥事)\"란 의약품·의약외품의 제조·조제·감정(鑑定)·보관·수입·판매[수여(授與)를 포함한다. 이하 같\n다]와 그 밖의 약학 기술에 관련된 사항을 말한다.\n2. \"약사(藥師)\"란 한약에 관한 사항 외의 약사(藥事)에 관한 업무(한약제제에 관한 사항을 포함한다)를 담당하는 자\n로서, \"한약사\"란 한약과 한약제제에 관한 약사(藥事) 업무를 담당하는 자로서 각각 보건복지부장관의 면허를 받\n은 자를 말한다.\n3. \"약국\"이란 약사나 한약사가 수여할 목적으로 의약품 조제 업무[약국제제(藥局製劑)를 포함한다]를 하는 장소(그\n개설자가 의약품 판매업을 겸하는 경우에는 그 판매업에 필요한 장소를 포함한다)를 말한다. 다만, 의료기관의 조\n제실은 예외로 한다.\n4. \"의약품\"이란 다음 각 목의 어느 하나에 해당하는 물품을 말한다.\n가. 대한민국약전(大韓民國藥典)에 실린 물품 중 의약외품이 아닌 것\n나. 사람이나 동물의 질병을 진단·치료·경감·처치 또는 예방할 목적으로 사용하는 물품 중 기구·기계 또는 장\n치가 아닌 것\n다. 사람이나 동물의 구조와 기능에 약리학적(藥理學的) 영향을 줄 목적으로 사용하는 물품 중 기구·기계 또는 장\n치가 아닌 것\n5. \"한약\"이란 동물·식물 또는 광물에서 채취된 것으로 주로 원형대로 건조·절단 또는 정제된 생약(生藥)을 말한다.\n\n(이하 생략)\n\n■ 응급의료에 관한 법률\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. “응급환자”란 질병, 분만, 각종 사고 및 재해로 인한 부상이나 그 밖의 위급한 상태로 인하여 즉시 필요한 응급처치\n를 받지 아니하면 생명을 보존할 수 없거나 심신에 중대한 위해(危害)가 발생할 가능성이 있는 환자 또는 이에 준\n하는 사람으로서 보건복지부령으로 정하는 사람을 말한다.\n2. “응급의료”란 응급환자가 발생한 때부터 생명의 위험에서 회복되거나 심신상의 중대한 위해가 제거되기까지의 과\n정에서 응급환자를 위하여 하는 상담ㆍ구조(救助)ㆍ이송ㆍ응급처치 및 진료 등의 조치를 말한다.\n3. “응급처치”란 응급의료행위의 하나로서 응급환자의 기도를 확보하고 심장박동의 회복, 그 밖에 생명의 위험이나\n증상의 현저한 악화를 방지하기 위하여 긴급히 필요로 하는 처치를 말한다.\n4. “응급의료종사자”란 관계 법령에서 정하는 바에 따라 취득한 면허 또는 자격의 범위에서 응급환자에 대한 응급의\n료를 제공하는 의료인과 응급구조사를 말한다.\n5. “응급의료기관”이란 「의료법」 제3 조에 따른 의료기관 중에서 이 법에 따라 지정된 권역응급의료센터, 전문응급\n의료센터, 지역응급의료센터 및 지역응급의료기관을 말한다.\n(이하 생략)\n\n제35 조의2(응급의료기관 외의 의료기관)\n① 이 법에 따른 응급의료기관으로 지정받지 아니한 의료기관이 응급의료시설을 설치ㆍ운영하려면 보건복지부령으로\n정하는 시설ㆍ인력 등을 갖추어 시장ㆍ군수ㆍ구청장에게 신고하여야 한다. 다만, 종합병원의 경우에는 신고를 생략할\n수 있다.\n② 시장ㆍ군수ㆍ구청장은 제1 항에 따른 신고를 받은 경우 그 내용을 검토하여 이 법에 적합하면 신고를 수리하여야 한\n다.\n\n■ 응급의료에 관한 법률 시행규칙\n\n제2 조(응급환자)\n「응급의료에 관한 법률」(이하 \"법\"이라 한다) 제2 조 제1 호에서 \"보건복지부령이 정하는 자\"란 다음 각 호의 어느 하나\n에 해당하는 증상이 있는 자를 말한다.\n1. 별표 1 의 응급증상 및 이에 준하는 증상\n2. 제1 호의 증상으로 진행될 가능성이 있다고 응급의료종사자가 판단하는 증상\n\n제18 조의3(응급환자의 중증도 분류 등)\n① 응급의료기관의 장은 법 제31 조의4 제1 항에 따라 응급실의 입구에 환자분류소를 설치하여 보건복지부장관이 정\n하는 교육을 이수한 의사, 간호사 또는 1 급 응급구조사가 응급환자 등의 중증도를 분류하고, 감염병 의심환자 등을 선\n별하도록 해야 한다.\n②구급차등의 운용자는 법 제31 조의4 제1 항에 따라 의사, 간호사 또는 응급구조사가 응급환자 등의 중증도를 분류\n하고, 감염병 의심환자 등을 선별하도록 해야 한다.\n③구급차등의 운용자는 소속 의사, 간호사 또는 응급구조사가 제2 항에 따른 응급환자 등의 중증도 분류에 필요한 교육\n을 받도록 해야 하며, 응급환자 등의 중증도 분류에 관한 교육 내용, 기준 등은 보건복지부장관이 정한다.\n④보건복지부장관 및 소방청장은 다음 각 호에서 정하는 사람에 대하여 제3 항에 따른 교육을 실시한다.\n\n1. 보건복지부장관: 소방청을 제외한 구급차등의 운용자에 소속된 의사, 간호사 또는 응급구조사\n2. 소방청장: 「119 구조·구급에 관한 법률」 제10 조에 따른 구급대의 대원인 의사, 간호사 또는 응급구조사\n⑤ 제1 항 및 제2 항에 따라 응급환자 등의 중증도를 분류하거나 감염병 의심환자 등을 선별할 때에는 환자의 주요증\n상, 활력징후(호흡, 맥박, 혈압, 체온), 의식 수준, 손상 기전, 통증 정도 등을 고려해야 하며 그 세부적인 기준ㆍ방법 및\n절차 등은 보건복지부장관이 각각 고시하는 중증도 분류기준에 따른다.\n⑥제5 항에도 불구하고 재해 등으로 응급환자가 여러 명 발생한 경우에 응급환자 등의 중증도를 분류하거나 감염병 의\n심환자 등을 선별할 때에는 보건복지부장관이 소방청장과 협의하여 정하여 고시하는 중증도 분류기준에 따른다.\n\n■ 의료급여법\n\n제7 조(의료급여의 내용 등)\n① 이 법에 따른 수급권자의 질병·부상·출산 등에 대한 의료급여의 내용은 다음 각 호와 같다.\n1. 진찰·검사\n\n2. 약제(藥劑)·치료재료의 지급\n3. 처치·수술과 그 밖의 치료\n4. 예방·재활\n5. 입원\n6. 간호\n7. 이송과 그 밖의 의료목적의 달성을 위한 조치\n② 제1 항에 따른 의료급여의 방법·절차·범위·한도 등 의료급여의 기준에 관하여는 보건복지부령으로 정하고, 의\n료수가기준과 그 계산방법 등에 관하여는 보건복지부장관이 정한다.\n③ 보건복지부장관은 제2 항에 따라 의료급여의 기준을 정할 때에는 업무 또는 일상생활에 지장이 없는 질환 등 보건복\n지부령으로 정하는 사항은 의료급여 대상에서 제외할 수 있다.\n\n제10 조(급여비용의 부담)\n급여비용은 대통령령으로 정하는 바에 따라 그 전부 또는 일부를 제25 조에 따른 의료급여기금에서 부담하되, 의료급\n여기금에서 일부를 부담하는 경우 그 나머지 비용은 본인이 부담한다.\n\n제15 조(의료급여의 제한)\n① 시장·군수·구청장은 수급권자가 다음 각 호의 어느 하나에 해당하면 이 법에 따른 의료급여를 하지 아니한다. 다\n만, 보건복지부장관이 의료급여를 할 필요가 있다고 인정하는 경우에는 그러하지 아니하다.\n1. 수급권자가 자신의 고의 또는 중대한 과실로 인한 범죄행위에 그 원인이 있거나 고의로 사고를 일으켜 의료급여가\n필요하게 된 경우\n2. 수급권자가 정당한 이유 없이 이 법의 규정이나 의료급여기관의 진료에 관한 지시에 따르지 아니한 경우\n② 의료급여기관은 수급권자가 제1 항 각 호의 어느 하나에 해당하는 경우 대통령령으로 정하는 바에 따라 수급권자의\n거주지를 관할하는 시장·군수·구청장에게 알려야 한다.\n\n제17 조(의료급여의 중지 등)\n① 시장·군수·구청장은 수급권자가 다음 각 호의 어느 하나에 해당하면 의료급여를 중지하여야 한다.\n1. 수급권자에 대한 의료급여가 필요 없게 된 경우\n2. 수급권자가 의료급여를 거부한 경우\n② 시장·군수·구청장은 수급권자가 의료급여를 거부한 경우에는 수급권자가 속한 가구원 전부에 대하여 의료급여를\n중지하여야 한다.\n\n③ 시장·군수·구청장은 제1 항에 따라 의료급여를 중지하였을 때에는 서면으로 그 이유를 밝혀 수급권자에게 알려\n야 한다.\n\n■ 의료급여법 시행령\n\n제13 조(급여비용의 부담)\n① 법 제10 조에 따라 기금에서 부담하는 급여비용의 범위는 별표 1 과 같다.\n1. 삭제\n2. 삭제\n② 삭제\n③ 제1 항의 규정에 불구하고 법 제15 조제1 항의 규정에 의하여 의료급여가 제한되는 경우, 기금에 상당한 부담을 초\n래한다고 인정되는 경우 등 보건복지부령이 정하는 경우 또는 항목에 대하여는 보건복지부령이 정하는 금액을 수급권\n자가 부담한다.\n④ 제1 항의 규정에 따라 기금에서 부담하는 급여비용외에 수급권자가 부담하는 본인부담금(이하 \"급여대상 본인부담\n금\"이라 한다)과 제3 항의 규정에 따라 수급권자가 부담하는 본인부담금은 의료급여기관의 청구에 의하여 수급권자가\n의료급여기관에 지급한다.\n⑤ 제4 항의 규정에 따라 의료급여기관에 지급한 급여대상 본인부담금(별표 1 제1 호라목·마목, 같은 표 제2 호마목\n·바목 및 같은 표 제3 호에 따라 의료급여기관에 지급한 급여대상 본인부담금은 제외한다. 이하 이 조에서 같다)이 매\n30 일간 다음 각 호의 금액을 초과한 경우에는 그 초과한 금액의 100 분의 50 에 해당하는 금액을 보건복지부령이 정하\n는 바에 따라 시장·군수·구청장이 수급권자에게 지급한다. 다만, 지급하여야 할 금액이 2 천원 미만인 경우에는 이를\n지급하지 아니한다.\n1. 1 종수급권자 : 2 만원\n2. 2 종수급권자 : 20 만원\n⑥ 급여대상 본인부담금에서 제5 항에 따라 지급받은 금액을 차감한 금액이 다음 각 호의 금액을 초과한 경우에는 그\n초과금액을 기금에서 부담한다. 다만, 초과금액이 2 천원 미만인 경우에는 이를 수급권자가 부담한다.\n1. 1 종수급권자 : 매 30 일간 5 만원\n2. 2 종수급권자 : 연간 80 만원. 다만, 「의료법」 제3 조제2 항제3 호라목에 따른 요양병원에 연간 240일을 초과하\n여 입원한 경우에는 연간 120 만원으로 한다.\n⑦ 시장·군수·구청장은 수급권자가 제6 항 본문의 규정에 따라 기금에서 부담하여야 하는 초과금액을 의료급여기관\n에 지급한 경우에는 보건복지부령이 정하는 바에 따라 그 초과금액을 수급권자에게 지급하여야 한다.\n\n[별표 1]\n의료급여기금에서 부담하는 급여비용의 범위\n1. 1 종수급권자에 대해서는 다음 각 목의 구분에 따른 부담액 또는 부담률\n가. 의료급여기관 및 의료급여의 내용에 따라 기금에서 부담하는 급여비용의 범위\n의료급여\n기관\n의료급여의 내용\n기금에서 부담하는\n급여비용(부담률)\n\n1) 법 제9조\n제2항제\n1호가목\n에 해당\n하는 제1\n차의료급\n여기관\n및 같은\n호 나목\n의 제1차\n의료급여\n기관 중\n보건의료\n원\n가) 외래\n진료\n(1) 「약사법」 제23조제4항에 따라\n의사 또는 치과의사가 \n의료급여기관\n중 약국 및 한\n국희귀의약품\n센터\n가) 보건소·보건지소 및 보건진료소가 발행한\n처방전에 의하여 의약품을 조제하는 경우\n급여비용총액 전부\n나) 의료기관 및 보건의료원이 발행한 처방전\n에 의하여 의약품을 조제하는 경우\n급여비용총액에서 처방전 1매당\n500원의 본인부담금을 제외한 급\n여비용 전부\n다) 약사가 「약사법」 제23조제3항 단서에 따\n라 처방전에 의하지 아니하고 직접 조제하\n는 경우\n급여비용총액에서 약국 1회 방문\n당 900원의 본인부담금을 제외한\n급여비용 전부\n비고 : 위 표 1)가)(1) 및 2)가)(1)의 경우로서 처방전을 함께 발행하는 경우에는 각각 위 표 1)가)(3) 및 2)가)(3)\n의 급여비용에 해당하는 금액을 기금에서 부담한다.\n(중략)\n마. 가목1)부터 4)까지 및 라목에도 불구하고 65 세 이상인 사람에게 보건복지부장관이 정하여 고시하는 기준 및\n방법에 따라 틀니를 의료급여로 실시하는 경우에는 급여비용총액의 100 분의 85 를 기금에서 부담한다.\n바. 가목1)부터 4)까지 및 라목에도 불구하고 65 세 이상인 사람에게 보건복지부장관이 정하여 고시하는 기준 및\n방법에 따라 치과임플란트를 의료급여로 실시하는 경우에는 급여비용총액의 100 분의 80 을 기금에서 부담\n한다.\n(중략)\n\n3. 제1 호 및 제2 호에도 불구하고 다음 각 목의 어느 하나에 해당하는 경우에는 각 목에서 정하는 금액을 기금에서\n부담한다.\n가. 「국민건강보험법 시행령」 별표 2 제4 호에 따라 보건복지부장관이 정하여 고시하는 요양급여 항목을 의료급\n여로 실시하는 경우에는 급여비용총액의 100 분의 100 범위에서 보건복지부장관이 정하여 고시하는 금액을\n기금에서 부담한다.\n나. 「의료법」 제3 조제2 항제3 호에 따른 병원·한방병원·요양병원(「장애인복지법」 제58 조제1 항제4 호에\n따른 의료재활시설로서 「의료법」 제3 조의2 의 요건을 갖춘 의료기관인 요양병원으로 한정한다. 이하 같다)\n·정신병원ㆍ종합병원 및 같은 법 제3 조의4 에 따라 지정된 상급종합병원에서 「국민건강보험법」 제43 조\n에 따라 신고한 입원병실 중 일반입원실의 2 인실·3 인실을 이용한 경우에는 그 입원료에 한정하여 다음의\n기준을 따른다.\n1) 상급종합병원 2 인실 입원료에 대해서는 급여비용의 100 분의 50 을, 3 인실 입원료에 대해서는 급여비용\n의 100 분의 60 을 각각 의료급여기금에서 부담한다.\n2) 병원·한방병원·요양병원·정신병원ㆍ종합병원 2 인실 입원료에 대해서는 급여비용의 100 분의 60 을,\n3 인실 입원료에 대해서는 급여비용의 100 분의 70 을 각각 의료급여기금에서 부담한다.\n다. 법 제7 조제2 항에 따라 보건복지부령으로 정하는 상한일수를 초과하여 의료급여를 받은 수급권자로서 보건\n복지부령으로 정하는 승인을 얻지 않은 수급권자에게 실시하는 의료급여에 대해서는 다음의 구분에 따른 금\n액을 기금에서 부담한다. 다만, 제1 호가목4) 및 제2 호가목4)의 의료급여기관에서 받는 외래·입원진료와\n제1 호가목5)가) 및 제2 호가목5)가)에 대하여 의료급여를 실시하는 경우에는 급여비용총액 전부를 기금에\n서 부담한다.\n1) 외래진료의 경우에는 급여비용총액의 100 분의 70\n2) 입원진료의 경우에는 급여비용총액의 100 분의 80\n3) 제1 호가목5)나)·다) 및 제2 호가목5)나)·다)의 경우에는 급여비용총액의 100 분의 70\n라. 다목에도 불구하고 보건복지부장관이 정하여 고시하는 추나요법에 대하여 보건복지부장관이 정하는 의료급\n여를 실시하는 경우에는 다음의 구분에 따른 금액을 기금에서 부담한다.\n1) 1 종수급권자에 대해서는 추나요법 급여비용의 100 분의 70\n2) 2 종수급권자에 대해서는 추나요법 급여비용의 100 분의 60\n3) 1) 및 2)에도 불구하고 보건복지부장관이 따로 정하여 고시하는 추나요법에 대하여 의료급여를 실시하는\n경우에는 추나요법 급여비용의 100 분의 20\n마. 다목에도 불구하고  「감염병의 예방 및 관리에 관한 법률」 제2 조제1 호에 따른 감염병의 발생ㆍ유행 상황을\n고려하여 보건복지부장관이 정하여 고시하는 감염병환자에게 보건복지부장관이 정하여 고시하는 항목의 의\n료급여를 실시하는 경우에는 급여비용총액의 100 분의 100 범위에서 보건복지부장관이 정하여 고시하는 금\n액을 기금에서 부담한다.\n\n■ 의료법\n\n제2 조(의료인)\n① 이 법에서 \"의료인\"이란 보건복지부장관의 면허를 받은 의사ㆍ치과의사ㆍ한의사ㆍ조산사 및 간호사를 말한다.\n② 의료인은 종별에 따라 다음 각 호의 임무를 수행하여 국민보건 향상을 이루고 국민의 건강한 생활 확보에 이바지할\n사명을 가진다.\n1. 의사는 의료와 보건지도를 임무로 한다.\n2. 치과의사는 치과 의료와 구강 보건지도를 임무로 한다.\n3. 한의사는 한방 의료와 한방 보건지도를 임무로 한다.\n4. 조산사는 조산(助産)과 임산부 및 신생아에 대한 보건과 양호지도를 임무로 한다.\n\n5. 간호사는 다음 각 목의 업무를 임무로 한다.\n가. 환자의 간호요구에 대한 관찰, 자료수집, 간호판단 및 요양을 위한 간호\n나. 의사, 치과의사, 한의사의 지도하에 시행하는 진료의 보조\n다. 간호 요구자에 대한 교육ㆍ상담 및 건강증진을 위한 활동의 기획과 수행, 그 밖의 대통령령으로 정하는 보건활\n동\n라. 제80 조에 따른 간호조무사가 수행하는 가목부터 다목까지의 업무보조에 대한 지도\n\n제3 조(의료기관)\n① 이 법에서 \"의료기관\"이란 의료인이 공중(公衆) 또는 특정 다수인을 위하여 의료·조산의 업(이하 \"의료업\"이라 한다)\n을 하는 곳을 말한다.\n② 의료기관은 다음 각 호와 같이 구분한다.\n1. 의원급 의료기관: 의사, 치과의사 또는 한의사가 주로 외래환자를 대상으로 각각 그 의료행위를 하는 의료기관으\n로서 그 종류는 다음 각 목과 같다.\n가. 의원\n나. 치과의원\n다. 한의원\n2. 조산원: 조산사가 조산과 임산부 및 신생아를 대상으로 보건활동과 교육·상담을 하는 의료기관을 말한다.\n3. 병원급 의료기관: 의사, 치과의사 또는 한의사가 주로 입원환자를 대상으로 의료행위를 하는 의료기관으로서 그\n종류는 다음 각 목과 같다.\n가. 병원\n나. 치과병원\n다. 한방병원\n라. 요양병원(「장애인복지법」 제58 조제1 항제4 호에 따른 의료재활시설로서 제3 조의2 의 요건을 갖춘 의료\n기관을 포함한다. 이하 같다)\n마. 정신병원\n바. 종합병원\n③ 보건복지부장관은 보건의료정책에 필요하다고 인정하는 경우에는 제2 항제1 호부터 제3 호까지의 규정에 따른 의\n료기관의 종류별 표준업무를 정하여 고시할 수 있다.\n\n제3 조의3(종합병원)\n① 종합병원은 다음 각 호의 요건을 갖추어야 한다.\n1. 100 개 이상의 병상을 갖출 것\n2. 100 병상 이상 300 병상 이하인 경우에는 내과·외과·소아청소년과·산부인과 중 3 개 진료과목, 영상의학과, 마\n취통증의학과와 진단검사의학과 또는 병리과를 포함한 7 개 이상의 진료과목을 갖추고 각 진료과목마다 전속하는\n전문의를 둘 것\n3. 300 병상을 초과하는 경우에는 내과, 외과, 소아청소년과, 산부인과, 영상의학과, 마취통증의학과, 진단검사의학과\n또는 병리과, 정신건강의학과 및 치과를 포함한 9 개 이상의 진료과목을 갖추고 각 진료과목마다 전속하는 전문의\n를 둘 것\n② 종합볍원은 제1 항 제2 호 또는 제3 호에 따른 진료과목(이하 이 항에서 “필수진료과목”이라 한다) 외에 필요하\n면 추가로 진료과목을 설치·운영할 수 있다. 이 경우 필수진료과목 외의 진료과목에 대하여는 해당 의료기관에 전속하\n지 아니한 전문의를 둘 수 있다.\n\n제3 조의4(상급종합병원 지정)\n\n① 보건복지부장관은 다음 각 호의 요건을 갖춘 종합병원 중에서 중증질환에 대하여 난이도가 높은 의료행위를 전문적\n으로 하는 종합병원을 상급종합병원으로 지정할 수 있다.\n1. 보건복지부령으로 정하는 20 개 이상의 진료과목을 갖추고 각 진료과목마다 전속하는 전문의를 둘 것\n2. 제77 조제1 항에 따라 전문의가 되려는 자를 수련시키는 기관일 것\n3. 보건복지부령으로 정하는 인력ㆍ시설ㆍ장비 등을 갖출 것\n4. 질병군별(疾病群別) 환자구성 비율이 보건복지부령으로 정하는 기준에 해당할 것\n② 보건복지부장관은 제1 항에 따른 지정을 하는 경우 제1 항 각 호의 사항 및 전문성 등에 대하여 평가를 실시하여야\n한다.\n③ 보건복지부장관은 제1 항에 따라 상급종합병원으로 지정받은 종합병원에 대하여 3 년마다 제2 항에 따른 평가를 실\n시하여 재지정하거나 지정을 취소할 수 있다.\n④ 보건복지부장관은 제2 항 및 제3 항에 따른 평가업무를 관계 전문기관 또는 단체에 위탁할 수 있다.\n⑤ 상급종합병원 지정ㆍ재지정의 기준ㆍ절차 및 평가업무의 위탁 절차 등에 관하여 필요한 사항은 보건복지부령으로\n정한다.\n\n제4 조의2(간호ㆍ간병통합서비스 제공 등)\n① 간호ㆍ간병통합서비스란 보건복지부령으로 정하는 입원 환자를 대상으로 보호자 등이 상주하지 아니하고 간호사,\n제80 조에 따른 간호조무사 및 그 밖에 간병지원인력(이하 이 조에서 “간호ㆍ간병통합서비스 제공인력”이라 한다)\n에 의하여 포괄적으로 제공되는 입원서비스를 말한다.\n② 보건복지부령으로 정하는 병원급 의료기관은 간호ㆍ간병통합서비스를 제공할 수 있도록 노력하여야 한다.\n③ 제2 항에 따라 간호ㆍ간병통합서비스를 제공하는 병원급 의료기관(이하 이 조에서 “간호ㆍ간병통합서비스 제공\n인력”이라 한다)은 보건복지부령으로 정하는 인력, 시설, 운영 등의 기준을 준수하여야 한다.\n④ 「공공보건의료에 관한 법률」 제2 조제3 호에 따른 공공보건의료기관 중 보건복지부령으로 정하는 병원급 의료기관\n은 간호ㆍ간병통합서비스를 제공하여야 한다. 이 경우 국가 및 지방자치단체는 필요한 비용의 전부 또는 일부를 지원할\n수 있다.\n⑤ 간호ㆍ간병통합서비스 제공기관은 보호자 등의 입원실 내 상주를 제한하고 환자 병문안에 관한 기준을 마련하는 등\n안전관리를 위하여 노력하여야 한다.\n⑥ 간호ㆍ간병통합서비스 제공기관은 간호ㆍ간병통합서비스 제공인력의 근무환경 및 처우 개선을 위하여 필요한\n지원을 하여야 한다.\n⑦ 국가 및 지방자치단체는 간호ㆍ간병통합서비스의 제공ㆍ확대, 간호ㆍ간병통합서비스 제공인력의 원활한 수급 및 근\n무환경 개선을 위하여 필요한 시책을 수립하고 그에 따른 지원을 하여야 한다.\n\n제5 조(의사ㆍ치과의사 및 한의사 면허)\n① 의사ㆍ치과의사 또는 한의사가 되려는 자는 다음 각 호의 어느 하나에 해당하는 자격을 가진 자로서 제9 조에 따른\n의사ㆍ치과의사 또는 한의사 국가시험에 합격한 후 보건복지부장관의 면허를 받아야 한다.\n1. 「고등교육법」 제11 조의2 에 따른 인정기관(이하 \"평가인증기구\"라 한다)의 인증(이하 \"평가인증기구의 인증\"이\n라 한다)을 받은 의학·치의학 또는 한의학을 전공하는 대학을 졸업하고 의학사·치의학사 또는 한의학사 학위를\n받은 자\n2. 평가인증기구의 인증을 받은 의학·치의학 또는 한의학을 전공하는 전문대학원을 졸업하고 석사학위 또는 박사\n학위를 받은 자\n3. 외국의 제1 호나 제2 호에 해당하는 학교(보건복지부장관이 정하여 고시하는 인정기준에 해당하는 학교를 말한\n다)를 졸업하고 외국의 의사·치과의사 또는 한의사 면허를 받은 자로서 제9 조에 따른 예비시험에 합격한 자\n\n② 평가인증기구의 인증을 받은 의학·치의학 또는 한의학을 전공하는 대학 또는 전문대학원을 6 개월 이내에 졸업하\n고 해당 학위를 받을 것으로 예정된 자는 제1 항제1 호 및 제2 호의 자격을 가진 자로 본다. 다만, 그 졸업예정시기에\n졸업하고 해당 학위를 받아야 면허를 받을 수 있다.\n③ 제1 항에도 불구하고 입학 당시 평가인증기구의 인증을 받은 의학·치의학 또는 한의학을 전공하는 대학 또는 전문\n대학원에 입학한 사람으로서 그 대학 또는 전문대학원을 졸업하고 해당 학위를 받은 사람은 같은 항 제1 호 및 제2 호\n의 자격을 가진 사람으로 본다.\n\n제33 조(개설 등)\n① 의료인은 이 법에 따른 의료기관을 개설하지 아니하고는 의료업을 할 수 없으며, 다음 각 호의 어느 하나에 해당하는\n경우 외에는 그 의료기관 내에서 의료업을 하여야 한다. <개정 2008. 2. 29., 2010. 1. 18.>\n1. 「응급의료에 관한 법률」 제2 조제1 호에 따른 응급환자를 진료하는 경우\n2. 환자나 환자 보호자의 요청에 따라 진료하는 경우\n3. 국가나 지방자치단체의 장이 공익상 필요하다고 인정하여 요청하는 경우\n4. 보건복지부령으로 정하는 바에 따라 가정간호를 하는 경우\n5. 그 밖에 이 법 또는 다른 법령으로 특별히 정한 경우나 환자가 있는 현장에서 진료를 하여야 하는 부득이한 사유가\n있는 경우\n(이하 생략)\n\n제54 조(신의료기술평가위원회의 설치 등)\n① 보건복지부장관은 신의료기술평가에 관한 사항을 심의하기 위하여 보건복지부에 신의료기술평가위원회(이하 “위원\n회”라 한다)를 둔다.\n② 위원회는 위원장 1 명을 포함하여 20 명 이내의 위원으로 구성한다.\n③ 위원은 다음 각 호의 자 중에서 보건복지부장관이 위촉하거나 임명한다. 다만, 위원장은 제1 호 또는 제2 호의 자 중\n에서 임명한다.\n1. 제28 조제1 항에 따른 의사회ㆍ치과의사회ㆍ한의사회에서 각각 추천하는 자\n2. 보건의료에 관한 학식이 풍부한 자\n3. 소비자단체에서 추천하는 자\n4. 변호사의 자격을 가진 자로서 보건의료와 관련된 업무에 5 년 이상 종사한 경력이 있는 자\n5. 보건의료정책 관련 업무를 담당하고 있는 보건복지부 소속 5 급 이상의 공무원\n④ 위원장과 위원의 임기는 3 년으로 하되, 연임할 수 있다. 다만, 제3 항제5 호에 따른 공무원의 경우에는 재임기간으\n로 한다.\n⑤ 위원의 자리가 빈 때에는 새로 위원을 임명하고, 새로 임명된 위원의 임기는 임명된 날부터 기산한다.\n⑥ 위원회의 심의사항을 전문적으로 검토하기 위하여 위원회에 분야별 전문평가위원회를 둔다.\n⑦ 그 밖에 위원회ㆍ전문평가위원회의 구성 및 운영 등에 필요한 사항은 보건복지부령으로 정한다.\n\n■ 의료법 시행규칙\n\n제24 조(가정간호)\n① 법 제33 조제1 항제4 호에 따라 의료기관이 실시하는 가정간호의 범위는 다음 각 호와 같다.\n1. 간호\n2. 검체의 채취(보건복지부장관이 정하는 현장검사를 포함한다. 이하 같다) 및 운반\n3. 투약\n4. 주사\n\n5. 응급처치 등에 대한 교육 및 훈련\n6. 상담\n7. 다른 보건의료기관 등에 대한 건강관리에 관한 의뢰\n② 가정간호를 실시하는 간호사는 「전문간호사 자격인정 등에 관한 규칙」에 따른 가정전문간호사여야 한다. 다만, 「의\n료법」 제3 조제2 항제1 호에 따른 의원급 의료기관 또는 같은 항 제3 호에 따른 병원급 의료기관(종합병원은 제외한\n다)의 경우에는 가정간호에 관한 교육을 이수하는 등 보건복지부장관이 정하여 고시하는 요건을 갖춘 간호사도 가정간\n호를 실시할 수 있다.\n③ 가정간호는 의사나 한의사가 의료기관 외의 장소에서 계속적인 치료와 관리가 필요하다고 판단하여 제2 항 본문에\n따른 가정전문간호사 또는 같은 항 단서에 따른 간호사(이하 “가정전문간호사등”이라 한다)에게 치료나 관리를 의\n뢰한 사람에 대해서만 실시해야 한다.\n④ 가정전문간호사등은 가정간호 중 검체의 채취 및 운반, 투약, 주사 또는 치료적 의료행위인 간호를 하는 경우에는 의\n사나 한의사의 진단과 처방에 따라야 한다. 이 경우 의사 및 한의사 처방의 유효기간은 처방일부터 90 일까지로 한다.\n⑤ 가정간호를 실시하는 의료기관의 장은 가정전문간호사등을 2 명 이상 두어야 한다. 다만, 「의료법」 제3 조제2 항제\n3 호바목에 따른 종합병원의 경우에는 제2 항 본문에 따른 가정전문간호사를 2 명 이상 두어야 한다.\n⑥ 가정간호를 실시하는 의료기관의 장은 가정간호에 관한 기록을 5 년간 보존하여야 한다.\n⑦ 이 규칙에서 정한 것 외에 가정간호의 질 관리 등 가정간호의 실시에 필요한 사항은 보건복지부장관이 따로 정한다.\n\n제34 조(의료기관의 시설기준 및 규격)\n법 제36 조제1 호 및 제14 호에 따른 의료기관의 종류별 시설기준은 별표 3 과 같고, 그 시설규격은 별표 4 와 같다.\n\n[별표 3]\n의료기관의 종류별 시설기준\n시설\n종합병원\n병원\n요양병원\n치과병원\n한방병원\n의원\n치과의원\n한의원\n조산원\n…\n\n2. 중환자실\n(병상이\n300 개 이\n상인 종합\n병원만 해\n당한다)\n\n…\n\n[별표 4]\n의료기관의 시설규격\n(생략)\n2. 중환자실\n가. 병상이 300 개 이상인 종합병원은 입원실 병상 수의 100 분의 5 이상을 중환자실 병상으로 만들어야 한다.\n나. 중환자실은 출입을 통제할 수 있는 별도의 단위로 독립되어야 하며, 무정전(無停電) 시스템을 갖추어야 한다.\n다. 중환자실의 의사당직실은 중환자실 내 또는 중환자실과 가까운 곳에 있어야 한다.\n라. 병상 1 개당 면적은 15 제곱미터 이상으로 하되, 신생아만을 전담하는 중환자실(이하 \"신생아중환자실\"이라 한\n다)의 병상 1 개당 면적은 5 제곱미터 이상으로 한다. 이 경우 \"병상 1 개당 면적\"은 중환자실 내 간호사실, 당직\n\n실, 청소실, 기기창고, 청결실, 오물실, 린넨보관실을 제외한 환자 점유 공간[중환자실 내에 있는 간호사 스테이\n션(station)과 복도는 병상 면적에 포함한다]을 병상 수로 나눈 면적을 말한다.\n마. 병상마다 중앙공급식 의료가스시설, 심전도모니터, 맥박산소계측기, 지속적수액주입기를 갖추고, 병상 수의 10\n퍼센트 이상 개수의 침습적 동맥혈압모니터, 병상 수의 30 퍼센트 이상 개수의 인공호흡기, 병상 수의 70 퍼센\n트 이상 개수의 보육기(신생아중환자실에만 해당한다)를 갖추어야 한다.\n바. 중환자실 1 개 단위(Unit)당 후두경, 앰부백(마스크 포함), 심전도기록기, 제세동기를 갖추어야 한다. 다만, 신생\n아중환자실의 경우에는 제세동기 대신 광선기와 집중치료기를 갖추어야 한다.\n사. 중환자실에는 전담의사를 둘 수 있다. 다만, 신생아중환자실에는 전담전문의를 두어야 한다.\n아. 전담간호사를 두되, 간호사 1 명당 연평균 1 일 입원환자수는 1.2 명(신생아 중환자실의 경우에는 1.5 명)을 초\n과하여서는 아니 된다.\n자. 중환자실에 설치하는 병상은 벽으로부터 최소 1.2 미터 이상, 다른 병상으로부터 최소 2 미터 이상 이격하여 설\n치하여야 한다.\n차. 중환자실에는 병상 3 개당 1 개 이상의 손씻기 시설을 설치하여야 한다.\n카. 중환자실에는 보건복지부장관이 정하는 기준에 따라 병상 10 개당 1 개 이상의 격리병실 또는 음압격리병실을\n설치하여야 한다. 이 경우 음압격리병실은 최소 1 개 이상 설치하여야 한다.\n(이하 생략)\n\n■ 자본시장과 금융투자업에 관한 법률\n\n제88 조(자산운용보고서의 교부)\n① 집합투자업자는 자산운용보고서를 작성하여 해당 집합투자재산을 보관ㆍ관리하는 신탁업자의 확인을 받아 3 개월\n마다 1 회 이상 해당 집합투자기구의 투자자에게 교부하여야 한다. 다만, 투자자가 수시로 변동되는 등 투자자의 이익을\n해할 우려가 없는 경우로서 대통령령으로 정하는 경우에는 자산운용보고서를 투자자에게 교부하지 아니할 수 있다.\n② 집합투자업자는 제1 항에 따른 자산운용보고서에 다음 각 호의 사항을 기재하여야 한다.\n1. 다음 각 목의 어느 하나에 해당하는 날(이하 이 조에서 \"기준일\"이라 한다) 현재의 해당 집합투자기구의 자산ㆍ부\n채 및 집합투자증권의 기준가격\n가. 회계기간의 개시일부터 3 개월이 종료되는 날\n나. 회계기간의 말일\n다. 계약기간의 종료일 또는 존속기간의 만료일\n라. 해지일 또는 해산일\n2. 직전의 기준일(직전의 기준일이 없는 경우에는 해당 집합투자기구의 최초 설정일 또는 성립일을 말한다)부터 해\n당 기준일까지의 기간(이하 이 조에서 \"해당 운용기간\"이라 한다) 중 운용경과의 개요 및 해당 운용기간 중의 손익\n사항\n3. 기준일 현재 집합투자재산에 속하는 자산의 종류별 평가액과 집합투자재산 총액에 대한 각각의 비율\n4. 해당 운용기간 중 매매한 주식의 총수, 매매금액 및 대통령령으로 정하는 매매회전율\n5. 그 밖에 대통령령으로 정하는 사항\n③ 제1 항에 따른 자산운용보고서의 교부시기 및 방법, 비용부담 등에 관하여 필요한 사항은 대통령령으로 정한다.\n\n제188 조(신탁계약의 체결 등)\n① 투자신탁을 설정하고자 하는 집합투자업자는 다음 각 호의 사항이 기재된 신탁계약서에 의하여 신탁업자와 신탁계\n약을 체결하여야 한다.\n1. 집합투자업자 및 신탁업자의 상호\n\n2. 신탁원본의 가액 및 제189 조제1 항 및 제3 항에 따라 발행하는 투자신탁의 수익권(이하 \"수익증권\"이라 한다)\n의 총좌수에 관한 사항\n3. 투자신탁재산의 운용 및 관리에 관한 사항\n4. 이익분배 및 환매에 관한 사항\n5. 집합투자업자ㆍ신탁업자 등이 받는 보수, 그 밖의 수수료의 계산방법과 지급시기ㆍ방법에 관한 사항. 다만, 집합\n투자업자가 기준가격 산정업무를 위탁하는 경우에는 그 수수료는 해당 투자신탁재산에서 부담한다는 내용을 포\n함하여야 한다.\n6. 수익자총회에 관한 사항\n7. 공시 및 보고서에 관한 사항\n8. 그 밖에 수익자 보호를 위하여 필요한 사항으로서 대통령령으로 정하는 사항\n(이하 생략)\n\n■ 자본시장과 금융투자업에 관한 법률 시행령\n\n제93 조(수시공시의 방법 등)\n① (생략)\n② 법 제89 조제1 항제3 호에서 \"대통령령으로 정하는 부실자산\"이란 발행인의 부도, 「채무자 회생 및 파산에 관한 법\n률」에 따른 회생절차개시의 신청 등의 사유로 인하여 금융위원회가 부실자산으로 정하여 고시하는 자산을 말한다.\n(이하 생략)\n\n제265 조(회계감사인의 선임 등)\n①~⑥ (생략)\n⑦ 회계감사에 따른 비용은 그 회계감사의 대상인 집합투자기구가 부담한다.\n\n■ 장애인복지법\n\n제32 조(장애인 등록)\n① 장애인, 그 법정대리인 또는 대통령령으로 정하는 보호자(이하 \"법정대리인등\"이라 한다)는 장애 상태와 그 밖에 보\n건복지부령이 정하는 사항을 특별자치시장·특별자치도지사·시장·군수 또는 구청장(자치구의 구청장을 말한다. 이\n하 같다)에게 등록하여야 하며, 특별자치시장·특별자치도지사 ·시장·군수·구청장은 등록을 신청한 장애인이 제2\n조에 따른 기준에 맞으면 장애인등록증(이하 \"등록증\"이라 한다)을 내주어야 한다.\n(이하 생략)\n\n■ 전자서명법\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. \"전자문서\"란 정보처리시스템에 의하여 전자적 형태로 작성되어 송신 또는 수신되거나 저장된 정보를 말한다.\n2. \"전자서명\"이란 다음 각 목의 사항을 나타내는 데 이용하기 위하여 전자문서에 첨부되거나 논리적으로 결합된 전\n자적 형태의 정보를 말한다.\n가. 서명자의 신원\n나. 서명자가 해당 전자문서에 서명하였다는 사실\n\n3. \"전자서명생성정보\"란 전자서명을 생성하기 위하여 이용하는 전자적 정보를 말한다.\n4. \"전자서명수단\"이란 전자서명을 하기 위하여 이용하는 전자적 수단을 말한다.\n5. “전자서명인증”이란 전자서명생성정보가 가입자에게 유일하게 속한다는 사실을 확인하고 이를 증명하는 행위를\n말한다.\n6. \"인증서\"란 전자서명생성정보가 가입자에게 유일하게 속한다는 사실 등을 확인하고 이를 증명하는 전자적 정보를\n말한다.\n7. \"전자서명인증업무\"란 전자서명인증, 전자서명인증 관련 기록의 관리 등 전자서명인증서비스를 제공하는 업무를\n말한다.\n8. \"전자서명인증사업자\"란 전자서명인증업무를 하는 자를 말한다.\n9. \"가입자\"란 전자서명생성정보에 대하여 전자서명인증사업자로부터 전자서명인증을 받은 자를 말한다.\n10. \"이용자\"란 전자서명인증사업자가 제공하는 전자서명인증서비스를 이용하는 자를 말한다.\n\n■ 조세특례제한법\n\n제86조의4(연금계좌세액공제 등)\n종합소득이 있으며, 해당 과세기간에 「소득세법」 제14조제3항제6호에 따른 소득의 합계액이 2천만원을 초과하지 않\n는 50세 이상인 거주자는 2022년 12월 31일까지 「소득세법」 제59조의3을 적용하는 경우 같은 조 제1항 단서에도 불\n구하고 연금계좌 중 연금저축계좌에 납입한 금액이 연 600만원을 초과하는 경우에는 그 초과하는 금액은 없는 것으로\n하고, 연금저축계좌에 납입한 금액 중 600만원 이내의 금액과 퇴직연금계좌에 납입한 금액을 합한 금액이 연 900만원\n을 초과하는 경우에는 그 초과하는 금액은 없는 것으로 하되, 해당 과세기간에 종합소득과세표준을 계산할 때 합산하는\n종합소득금액이 1억원 초과(근로소득만 있는 경우에는 총급여액 1억2천만원 초과)인 거주자에 대해서는 연금계좌 중\n연금저축계좌에 납입한 금액이 연 300만원을 초과하는 경우에는 그 초과하는 금액은 없는 것으로 하고, 연금저축계좌\n에 납입한 금액 중 300만원 이내의 금액과 퇴직연금계좌에 납입한 금액을 합한 금액이 연 700만원을 초과하는 경우에\n는 그 초과하는 금액은 없는 것으로 한다.\n\n제88 조의2(비과세종합저축에 대한 과세특례)\n① 다음 각 호의 어느 하나에 해당하는 거주자가 1 명당 저축원금이 5 천만원(제89 조에 따른 세금우대종합저축에\n가입한 거주자로서 세금우대종합저축을 해지 또는 해약하지 아니한 자의 경우에는 5 천만원에서 해당 거주자가\n가입한 세금우대종합저축의 계약금액 총액을 뺀 금액으로 한다) 이하인 대통령령으로 정하는 저축(이하 이 조에서\n\"비과세종합저축\"이라 한다)에 2025 년 12 월 31 일까지 가입하는 경우 해당 저축에서 발생하는 이자소득 및\n배당소득에 대해서는 소득세를 부과하지 아니한다.\n1. 65 세 이상인 거주자\n2. 「장애인복지법」 제32 조에 따라 등록한 장애인\n3. 「독립유공자 예우에 관한 법률」 제6 조에 따라 등록한 독립유공자와 그 유족 또는 가족\n4. 「국가유공자 등 예우 및 지원에 관한 법률」 제6 조에 따라 등록한 상이자(傷痍者)\n5. 「국민기초생활보장법」 제2 조제2 호에 따른 수급자\n6. 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」 제2 조제3 호에 따른 고엽제후유의증환자\n7. 「5·18 민주유공자예우 및 단체설립에 관한 법률」 제4 조제2 호에 따른 5·18 민주화운동부상자\n② 삭제\n③ 비과세종합저축의 가입절차, 가입대상의 확인, 계약금액 총액의 계산방법, 운용ㆍ관리 방법과 그 밖에 필요한\n사항은 대통령령으로 정한다.\n\n■ 지역보건법\n\n제10 조(보건소의 설치)\n① 지역주민의 건강을 증진하고 질병을 예방ㆍ관리하기 위하여 시ㆍ군ㆍ구에 1 개소의 보건소(보건의료원을 포함한다.\n이하 같다)를 설치한다. 다만, 시ㆍ군ㆍ구의 인구가 30 만 명을 초과하는 등 지역주민의 보건의료를 위하여 특별히 필요\n하다고 인정되는 경우에는 대통령령으로 정하는 기준에 따라 해당 지방자치단체의 조례로 보건소를 추가로 설치할 수\n있다.\n② 동일한 시·군·구에 2 개 이상의 보건소가 설치되어 있는 경우 해당 지방자치단체의 조례로 정하는 바에 따라 업무\n를 총괄하는 보건소를 지정하여 운영할 수 있다.\n\n제12 조(보건의료원)\n보건소 중 「의료법」 제3 조제2 항제3 호가목에 따른 병원의 요건을 갖춘 보건소는 보건의료원이라는 명칭을 사용할\n수 있다.\n\n제13 조(보건지소의 설치)\n지방자치단체는 보건소의 업무수행을 위하여 필요하다고 인정하는 경우에는 대통령령으로 정하는 기준에 따라 해당 지\n방자치단체의 조례로 보건소의 지소(이하 \"보건지소\"라 한다)를 설치할 수 있다.\n\n■ 초ㆍ중등교육법\n\n제2 조(학교의 종류)\n초·중등교육을 실시하기 위하여 다음 각 호의 학교를 둔다.\n1. 초등학교\n2. 중학교·고등공민학교\n3. 고등학교·고등기술학교\n4. 특수학교\n5. 각종학교\n\n■ 폭력행위 등 처벌에 관한 법률\n\n제2 조(폭행 등)\n① 삭제\n② 2 명 이상이 공동하여 다음 각 호의 죄를 범한 사람은 「형법」 각 해당 조항에서 정한 형의 2 분의 1 까지 가중한다.\n1. 「형법」 제260 조제1 항(폭행), 제283 조제1 항(협박), 제319 조(주거침입, 퇴거불응) 또는 제366 조(재물손괴\n등)의 죄\n2. 「형법」 제260 조제2 항(존속폭행), 제276 조제1 항(체포, 감금), 제283 조제2 항(존속협박) 또는\n제324 조제1 항(강요)의 죄\n3. 「형법」 제257 조제1 항(상해)·제2 항(존속상해), 제276 조제2 항(존속체포, 존속감금) 또는 제350 조(공갈)의\n죄\n③ 이 법(「형법」 각 해당 조항 및 각 해당 조항의 상습범, 특수범, 상습특수범, 각 해당 조항의 상습범의 미수범, 특수범의\n미수범, 상습특수범의 미수범을 포함한다)을 위반하여 2 회 이상 징역형을 받은 사람이 다시 제2 항 각 호에 규정된 죄를\n범하여 누범(累犯)으로 처벌할 경우에는 다음 각 호의 구분에 따라 가중처벌한다.\n1. 제2 항제1 호에 규정된 죄를 범한 사람: 7 년 이하의 징역\n2. 제2 항제2 호에 규정된 죄를 범한 사람: 1 년 이상 12 년 이하의 징역\n\n3. 제2 항제3 호에 규정된 죄를 범한 사람: 2 년 이상 20 년 이하의 징역\n④ 제2 항과 제3 항의 경우에는 「형법」 제260 조제3 항 및 제283 조제3 항을 적용하지 아니한다.\n\n제3 조(집단적 폭행 등)\n① 삭제\n② 삭제\n③ 삭제\n④ 이 법(「형법」 각 해당 조항 및 각 해당 조항의 상습범, 특수범, 상습특수범, 각 해당 조항의 상습범의 미수범, 특수범\n의 미수범, 상습특수범의 미수범을 포함한다)을 위반하여 2 회 이상 징역형을 받은 사람이 다시 다음 각 호의 죄를 범하\n여 누범으로 처벌할 경우에는 다음 각 호의 구분에 따라 가중처벌한다.\n1. 「형법」 제261 조(특수폭행)(제260 조제1 항의 죄를 범한 경우에 한정한다), 제284 조(특수협박)(제283 조제1\n항의 죄를 범한 경우에 한정한다), 제320 조(특수주거침입) 또는 제369 조제1 항(특수손괴)의 죄: 1 년 이상 12\n년 이하의 징역\n2. 「형법」 제261 조(특수폭행)(제260 조제2 항의 죄를 범한 경우에 한정한다), 제278 조(특수체포, 특수감금)(제\n276 조제1 항의 죄를 범한 경우에 한정한다), 제284 조(특수협박)(제283 조제2 항의 죄를 범한 경우에 한정한\n다) 또는 제324 조제2 항(강요)의 죄: 2 년 이상 20 년 이하의 징역\n3. 「형법」 제258 조의2 제1 항(특수상해), 제278 조(특수체포, 특수감금)(제276 조제2 항의 죄를 범한 경우에 한\n정한다) 또는 제350 조의2(특수공갈)의 죄: 3 년 이상 25 년 이하의 징역\n\n■ 형법\n\n제250 조(살인, 존속살해)\n① 사람을 살해한 자는 사형, 무기 또는 5 년 이상의 징역에 처한다.\n② 자기 또는 배우자의 직계존속을 살해한 자는 사형, 무기 또는 7 년 이상의 징역에 처한다.\n\n제251 조(영아살해)\n삭제\n\n제252 조(촉탁, 승낙에 의한 살인 등)\n① 사람의 촉탁이나 승낙을 받아 그를 살해한 자는 1 년 이상 10 년 이하의 징역에 처한다.\n② 사람을 교사하거나 방조하여 자살하게 한 자도 제1 항의 형에 처한다.\n\n제253 조(위계 등에 의한 촉탁살인 등)\n전조의 경우에 위계 또는 위력으로써 촉탁 또는 승낙하게 하거나 자살을 결의하게 한 때에는 제250 조의 예에 의한다.\n\n(중략)\n\n제257 조(상해, 존속상해)\n① 사람의 신체를 상해한 자는 7 년 이하의 징역, 10 년 이하의 자격정지 또는 1 천만원 이하의 벌금에 처한다.\n② 자기 또는 배우자의 직계존속에 대하여 제1 항의 죄를 범한 때에는 10 년 이하의 징역 또는 1 천500 만원 이하의 벌\n금에 처한다.\n③ 전 2 항의 미수범은 처벌한다.\n\n제258 조(중상해, 존속중상해)\n① 사람의 신체를 상해하여 생명에 대한 위험을 발생하게 한 자는 1 년 이상 10 년 이하의 징역에 처한다.\n② 신체의 상해로 인하여 불구 또는 불치나 난치의 질병에 이르게 한 자도 전항의 형과 같다.\n③ 자기 또는 배우자의 직계존속에 대하여 전2 항의 죄를 범한 때에는 2 년 이상 15 년 이하의 징역에 처한다.\n\n(중략)\n\n제259 조(상해치사)\n① 사람의 신체를 상해하여 사망에 이르게 한 자는 3 년 이상의 유기징역에 처한다.\n② 자기 또는 배우자의 직계존속에 대하여 전항의 죄를 범한 때에는 무기 또는 5 년 이상의 징역에 처한다.\n\n제260 조(폭행, 존속폭행)\n① 사람의 신체에 대하여 폭행을 가한 자는 2 년 이하의 징역, 500 만원 이하의 벌금, 구류 또는 과료에 처한다.\n② 자기 또는 배우자의 직계존속에 대하여 제1 항의 죄를 범한 때에는 5 년 이하의 징역 또는 700 만원 이하의 벌금에\n처한다.\n③ 제1 항 및 제2 항의 죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다.\n\n제261 조(특수폭행)\n단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하여 제260 조제1 항 또는 제2 항의 죄를 범한 때에는 5 년 이\n하의 징역 또는 1 천만원 이하의 벌금에 처한다.\n\n제262 조(폭행치사상)\n제260 조와 제261 조의 죄를 지어 사람을 사망이나 상해에 이르게 한 경우에는 제257 조부터 제259 조까지의 예에\n따른다.\n\n(중략)\n\n제287 조(미성년자의 약취, 유인)\n미성년자를 약취 또는 유인한 사람은 10 년 이하의 징역에 처한다.\n\n제288 조(추행 등 목적 약취, 유인 등)\n① 추행, 간음, 결혼 또는 영리의 목적으로 사람을 약취 또는 유인한 사람은 1 년 이상 10 년 이하의 징역에 처한다.\n② 노동력 착취, 성매매와 성적 착취, 장기적출을 목적으로 사람을 약취 또는 유인한 사람은 2 년 이상 15 년 이하의 징\n역에 처한다.\n③ 국외에 이송할 목적으로 사람을 약취 또는 유인하거나 약취 또는 유인된 사람을 국외에 이송한 사람도 제2 항과 동\n일한 형으로 처벌한다.\n\n제289 조(인신매매)\n① 사람을 매매한 사람은 7 년 이하의 징역에 처한다.\n② 추행, 간음, 결혼 또는 영리의 목적으로 사람을 매매한 사람은 1 년 이상 10 년 이하의 징역에 처한다.\n③ 노동력 착취, 성매매와 성적 착취, 장기적출을 목적으로 사람을 매매한 사람은 2 년 이상 15 년 이하의 징역에 처한다.\n④ 국외에 이송할 목적으로 사람을 매매하거나 매매된 사람을 국외로 이송한 사람도 제3 항과 동일한 형으로 처벌한다.\n\n제290 조(약취, 유인, 매매, 이송 등 상해ㆍ치상)\n① 제287 조부터 제289 조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 상해한 때에는 3 년 이상 25 년 이\n하의 징역에 처한다.\n② 제287 조부터 제289 조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 상해에 이르게 한 때에는 2 년 이\n상 20 년 이하의 징역에 처한다.\n\n제291 조(약취, 유인, 매매, 이송 등 살인ㆍ치사)\n① 제287 조부터 제289 조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 살해한 때에는 사형, 무기 또는 7\n년 이상의 징역에 처한다.\n② 제287 조부터 제289 조까지의 죄를 범하여 약취, 유인, 매매 또는 이송된 사람을 사망에 이르게 한 때에는 무기 또\n는 5 년 이상의 징역에 처한다.\n\n제292 조(약취, 유인, 매매, 이송된 사람의 수수ㆍ은닉 등)\n① 제287 조부터 제289 조까지의 죄로 약취, 유인, 매매 또는 이송된 사람을 수수(授受) 또는 은닉한 사람은 7 년 이하\n의 징역에 처한다.\n② 제287 조부터 제289 조까지의 죄를 범할 목적으로 사람을 모집, 운송, 전달한 사람도 제1 항과 동일한 형으로 처벌\n한다.\n\n(중략)\n\n제297 조(강간)\n폭행 또는 협박으로 사람을 강간한 자는 3 년 이상의 유기징역에 처한다.\n\n제297 조의2(유사강간)\n폭행 또는 협박으로 사람에 대하여 구강, 항문 등 신체(성기는 제외한다)의 내부에 성기를 넣거나 성기, 항문에 손가락\n등 신체(성기는 제외한다)의 일부 또는 도구를 넣는 행위를 한 사람은 2 년 이상의 유기징역에 처한다.\n\n(중략)\n\n제299 조(준강간, 준강제추행)\n사람의 심신상실 또는 항거불능의 상태를 이용하여 간음 또는 추행을 한 자는 제297 조, 제297 조의2 및 제298 조의\n예에 의한다.\n\n(중략)\n\n제333 조(강도)\n폭행 또는 협박으로 타인의 재물을 강취하거나 기타 재산상의 이익을 취득하거나 제삼자로 하여금 이를 취득하게 한 자\n는 3 년 이상의 유기징역에 처한다.\n\n제334 조(특수강도)\n\n① 야간에 사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입하여 제333 조의 죄를 범한 자는\n무기 또는 5 년 이상의 징역에 처한다.\n② 흉기를 휴대하거나 2 인 이상이 합동하여 전조의 죄를 범한 자도 전항의 형과 같다.\n\n제335 조(준강도)\n절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행 또는 협박한 때에는 제333\n조 및 제334 조의 예에 따른다.\n\n제336 조(인질강도)\n사람을 체포·감금·약취 또는 유인하여 이를 인질로 삼아 재물 또는 재산상의 이익을 취득하거나 제3 자로 하여금 이\n를 취득하게 한 자는 3 년 이상의 유기징역에 처한다.\n\n(이하 생략)\n\n■ 호스피스·완화의료 및 임종과정에 있는 환자의 연명의료결정에 관한 법률\n\n제2 조(정의)\n이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. (생략)\n2. (생략)\n3. “말기환자(末期患者)”란 적극적인 치료에도 불구하고 근원적인 회복의 가능성이 없고 점차 증상이 악화되어 보\n건복지부령으로 정하는 절차와 기준에 따라 담당의사와 해당 분야의 전문의 1 명으로부터 수개월 이내에 사망할\n것으로 예상되는 진단을 받은 환자를 말한다.\n가.~마. (삭제)\n4. “연명의료”란 임종과정에 있는 환자에게 하는 심폐소생술, 혈액 투석, 항암제 투여, 인공호흡기 착용 및 그 밖에\n대통령령으로 정하는 의학적 시술로서 치료효과 없이 임종과정의 기간만을 연장하는 것을 말한다.\n5. “연명의료중단등결정”이란 임종과정에 있는 환자에 대한 연명의료를 시행하지 아니하거나 중단하기로 하는 결\n정을 말한다.\n(이하 생략)\n\n■ 5∙18 민주유공자예우 및 단체설립에 관한 법률\n\n제4 조(적용 대상자)\n다음 각 호의 어느 하나에 해당하는 자로서 제7 조에 따라 등록이 된 자(이하 \"5·18 민주유공자\"라 한다)와 그 유족\n또는 가족은 이 법에 따른 예우를 받는다.\n1. 5·18 민주화운동사망자 또는 행방불명자: 5·18 민주화운동과 관련하여 사망하거나 행방불명된 사람 또는\n5·18 민주화운동으로 인한 상이(질병을 포함한다. 이하 같다)의 후유증으로 사망한 사람으로서,\n「5·18 민주화운동 관련자 보상 등에 관한 법률」에 따라 보상을 받은 사람\n2. 5·18 민주화운동부상자: 5·18 민주화운동과 관련하여 상이를 입은 사람으로서, 「5·18 민주화운동 관련자\n보상 등에 관한 법률」 제5 조제5 항에 따른 장해등급(이하 \"장해등급\"이라 한다)의 판정을 받고 보상을 받은 사람\n3. 그 밖의 5·18 민주화운동희생자: 5·18 민주화운동과 관련하여 「5·18 민주화운동 관련자 보상 등에 관한\n법률」 제22 조에 따라 지원을 받은 사람", "keywords": ["주계약 약관 규정의 준용", "보험금 지급사유", "보험금 지급", "보험금 청구", "해약환급금", "고지의무", "위법계약의 해지", "소멸시효", "보험수익자", "피보험자"], "query_aliases": ["주계약 약관 규정의 준용은 어떻게 되나요", "종신보험에서 주계약 약관 규정의 준용에 대해 알려주세요"]}];
