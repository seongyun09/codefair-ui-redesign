          }
        }

        // 쿼리 별칭 (정확한 질문)
        if (doc.query_aliases) {
          for (const alias of doc.query_aliases) {
            if (alias.toLowerCase().includes(q) || q.includes(alias.toLowerCase().slice(0, 5))) {
              score += 15;
            }
          }
        }

        // 텍스트 매칭
        if (doc.text.toLowerCase().includes(q)) score += 5;

        if (score > 0) {
          results.push({ doc, score });
        }
      }

      // 점수가 높은 순서로 정렬
      results.sort((a, b) => b.score - a.score);
      return results.slice(0, 3).map(r => r.doc);
    }

    // ──── 마크다운 렌더러 ────
    function md(text) {
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, '<code class="ic">$1</code>');
      
      // 줄 바꿈 처리
      html = html.split('\n').map(line => {
        if (line.startsWith('- ')) return '<li>' + line.slice(2) + '</li>';
        if (line.match(/^\d+\.\s/)) return '<li>' + line.replace(/^\d+\.\s/, '') + '</li>';
        return line;
      }).join('<br>');

      // 리스트 태그 추가
      html = html.replace(/<li>/g, '<ul style="margin:4px 0 12px; padding-left: 22px;"><li>').replace(/<\/li><br>/g, '</li>').replace(/<\/li>$/, '</li></ul>');

      return html;
    }

    // ──── UI 렌더링 ────
    function renderChatList() {
      chatListEl.innerHTML = chats.length ? chats.map(c => 
        `<button class="chat-item ${c.id === currentId ? 'active' : ''}" onclick="selectChat('${c.id}')">${c.title}</button>`
      ).join('') : '<div style="padding:10px; color:var(--text-2); font-size:13px;">아직 대화가 없어요.</div>';
    }

    function renderMessages() {
      messagesEl.innerHTML = '';
      const chat = chats.find(c => c.id === currentId);
      if (chat) {
        chat.messages.forEach(m => {
          const div = document.createElement('div');
          div.className = 'msg ' + m.role;
          if (m.role === 'user') {
            div.innerHTML = `<div class="msg-content">${md(m.content)}</div>`;
          } else {
            div.innerHTML = `
              <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z"/></svg></div>
              <div class="msg-body"><div class="msg-content">${md(m.content)}</div></div>
            `;
          }
          messagesEl.appendChild(div);
        });
      }
      emptyStateEl.classList.toggle('hidden', !!(chat && chat.messages.length > 0));
    }

    function scrollToBottom() {
      chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
    }

    // ──── 대화 조작 ────
    function selectChat(id) {
      if (streaming) return;
      currentId = id;
      renderChatList();
      renderMessages();
      sidebarEl.classList.remove('open');
    }

    function newChat() {
      if (streaming) return;
      currentId = null;
      renderChatList();
      renderMessages();
    }

    function deleteChat(id) {
      if (!confirm('이 대화를 삭제할까요?')) return;
      chats = chats.filter(c => c.id !== id);
      if (currentId === id) currentId = null;
      localStorage.setItem("insurance_chats", JSON.stringify(chats));
      renderChatList();
      renderMessages();
    }

    // ──── 메시지 전송 ────
    async function handleSend(text) {
      text = text.trim();
      if (!text || streaming) return;

      // 새 대화 만들기
      let chat = chats.find(c => c.id === currentId);
      if (!chat) {
        chat = { id: Date.now().toString(), title: text.slice(0, 30), messages: [] };
        chats.unshift(chat);
        currentId = chat.id;
      }

      chat.messages.push({ role: 'user', content: text });
      localStorage.setItem("insurance_chats", JSON.stringify(chats));

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      streaming = true;

      renderChatList();
      renderMessages();
      scrollToBottom(true);

      // 보험 데이터에서 검색
      const results = searchInsurance(text);
      let response = '';

      if (results.length > 0) {
        response = `**${results[0].title}**\n\n`;
        response += `${results[0].text}\n\n`;
        if (results.length > 1) {
          response += `**관련 정보**\n`;
          results.slice(1).forEach(r => {
            response += `- ${r.title}\n`;
          });
        }
      } else {
        response = `죄송합니다. 약관에서 해당 내용을 찾지 못했어요.\n\n다음과 같이 물어봐 주세요:\n- "종신보험이 무엇인가요?"\n- "보험금이 나오는 경우"\n- "용어 정의"`;
      }

      // 타자 효과로 표시
      const msgEl = document.createElement('div');
      msgEl.className = 'msg assistant';
      msgEl.innerHTML = `
        <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z"/></svg></div>
        <div class="msg-body"><div class="msg-content"></div></div>
      `;
      messagesEl.appendChild(msgEl);
      const contentEl = msgEl.querySelector('.msg-content');

      // 타자 치듯 표시
      let i = 0;
      const typeInterval = setInterval(() => {
        if (i < response.length) {
          contentEl.innerHTML = md(response.slice(0, i + 1)) + '<span class="cursor"></span>';
          scrollToBottom();
          i++;
        } else {
          clearInterval(typeInterval);
          contentEl.innerHTML = md(response);
          chat.messages.push({ role: 'assistant', content: response });
          localStorage.setItem("insurance_chats", JSON.stringify(chats));
          streaming = false;
          sendBtn.disabled = false;
        }
      }, 15);
    }

    // ──── 테마 ────
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("insurance_theme", theme);
      const isDark = theme === 'dark';
      $("#themeIcon").textContent = isDark ? '☀️' : '🌙';
      $("#themeLabel").textContent = isDark ? '라이트 모드' : '다크 모드';
    }

    // ──── 이벤트 ────
    composerEl.addEventListener('submit', e => {
      e.preventDefault();
      handleSend(inputEl.value);
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
      if (!streaming) sendBtn.disabled = inputEl.value.trim() === '';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        composerEl.requestSubmit();
      }
    });

    newChatBtn.addEventListener('click', newChat);
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });

    menuBtn.addEventListener('click', () => sidebarEl.classList.add('open'));
    $("#sidebarClose").addEventListener('click', () => sidebarEl.classList.remove('open'));
    backdropEl.addEventListener('click', () => sidebarEl.classList.remove('open'));

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => handleSend(chip.dataset.prompt));
    });

    // ──── 초기화 ────
    const savedTheme = localStorage.getItem("insurance_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light');
    setTheme(savedTheme);
    renderChatList();
    renderMessages();
    inputEl.focus();
  </script>
</body>
</html>
