<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>보험 챗봇 · Insurance Q&A</title>
  <style>
    :root {
      --bg: #fbfbfd;
      --sidebar-bg: #f1f2f6;
      --surface: #ffffff;
      --surface-2: #eef0f5;
      --border: #e3e6ec;
      --text: #1a1c23;
      --text-2: #6f7585;
      --accent: #6d5df6;
      --accent-grad: linear-gradient(135deg, #4e8cff 0%, #8a5cf6 55%, #c65cf6 100%);
      --user-bubble: #e9ecff;
      --user-text: #262a45;
      --code-bg: #11131a;
      --code-text: #e7e9f0;
      --shadow: 0 6px 24px rgba(24, 28, 45, 0.08);
      --radius: 14px;
    }

    [data-theme="dark"] {
      --bg: #131417;
      --sidebar-bg: #0e0f12;
      --surface: #1b1c21;
      --surface-2: #24262d;
      --border: #2a2d35;
      --text: #ecedf1;
      --text-2: #9aa1ad;
      --user-bubble: #2b2e4a;
      --user-text: #e8eaff;
      --code-bg: #0b0c10;
      --code-text: #e7e9f0;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app {
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    /* 사이드바 */
    .sidebar {
      width: 272px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 14px 12px;
      gap: 10px;
    }

    .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
    .spark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-grad); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(110, 92, 246, 0.35); }
    .spark svg { width: 15px; height: 15px; fill: #fff; }

    .new-chat-btn { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 600; width: 100%; }
    .new-chat-btn:hover { box-shadow: var(--shadow); }

    .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px 0; }
    .chat-item { padding: 9px 10px; border-radius: 10px; font-size: 13.5px; width: 100%; text-align: left; transition: background 0.1s ease; }
    .chat-item:hover { background: var(--surface-2); }
    .chat-item.active { background: var(--surface-2); font-weight: 600; }

    .sidebar-foot { border-top: 1px solid var(--border); padding-top: 10px; }
    .foot-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 10px; border-radius: 10px; font-size: 13.5px; }
    .foot-btn:hover { background: var(--surface-2); }

    /* 상단바 */
    .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 52px; }
    .model-badge { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent-grad); color: #fff; }

    /* 채팅 영역 */
    .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .messages { max-width: 760px; margin: 0 auto; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 22px; }

    .empty-state { max-width: 700px; margin: 0 auto; padding: 9vh 24px 30px; text-align: center; }
    .empty-state.hidden { display: none; }
    .greeting { font-size: 27px; font-weight: 700; margin: 0 0 8px; }
    .greeting-sub { font-size: 14.5px; color: var(--text-2); margin: 0 0 28px; }

    .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
    .chip { padding: 13px 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; text-align: left; transition: transform 0.12s ease; }
    .chip:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

    /* 메시지 */
    .msg { display: flex; gap: 12px; animation: rise 0.25s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

    .msg.user { justify-content: flex-end; }
    .msg.user .msg-content { max-width: 80%; background: var(--user-bubble); color: var(--user-text); padding: 11px 16px; border-radius: 18px 18px 5px 18px; }

    .avatar { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-grad); display: grid; place-items: center; margin-top: 2px; box-shadow: 0 2px 8px rgba(110, 92, 246, 0.3); }
    .avatar svg { width: 15px; height: 15px; fill: #fff; }
    .avatar.thinking { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.88); } }

    .msg-body { flex: 1; min-width: 0; }
    .msg-content { line-height: 1.7; word-break: break-word; }
    .msg-content p { margin: 0 0 10px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content h3, .msg-content h4 { margin: 16px 0 8px; }
    .msg-content ul, .msg-content ol { margin: 4px 0 12px; padding-left: 22px; }
    .msg-content li { margin: 4px 0; }
    .msg-content strong { font-weight: 700; }
    .msg-content .ic { font-family: monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--border); padding: 1.5px 6px; border-radius: 6px; }

    .code-block { margin: 12px 0; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); }
    .code-head { font-size: 11px; font-weight: 600; color: #8b93a5; padding: 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
    .code-block pre { margin: 0; padding: 14px; overflow-x: auto; }
    .code-block code { font-family: monospace; font-size: 13px; line-height: 1.6; color: var(--code-text); }

    .cursor { display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; border-radius: 2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }

    .typing { display: inline-flex; gap: 5px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-2); animation: bounce 1.2s ease-in-out infinite; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* 입력창 */
    .composer-wrap { padding: 8px 16px 14px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 26px; padding: 9px 9px 9px 18px; box-shadow: var(--shadow); }
    .composer:focus-within { border-color: var(--accent); }

    .composer textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.55; max-height: 180px; padding: 6px 0; }
    .composer textarea::placeholder { color: var(--text-2); }

    .send-btn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-grad); color: #fff; display: grid; place-items: center; transition: transform 0.12s ease; }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:disabled { background: var(--surface-2); color: var(--text-2); }
    .send-btn svg { width: 17px; height: 17px; }

    .disclaimer { max-width: 760px; margin: 9px auto 0; text-align: center; font-size: 11.5px; color: var(--text-2); }

    /* 스크롤바 */
    .chat-scroll::-webkit-scrollbar { width: 8px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    /* 반응형 */
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--text-2); }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; }

    .mobile-only { display: none; }
    @media (max-width: 768px) {
      .mobile-only { display: grid; }
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; transform: translateX(-104%); transition: transform 0.25s ease; width: min(300px, 84vw); }
      .sidebar.open { transform: none; }
      .sidebar-backdrop { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 20, 0.45); }
      .sidebar-backdrop.show { display: block; }
      .chips { grid-template-columns: 1fr; }
      .msg.user .msg-content { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="spark">
            <svg viewBox="0 0 24 24"><path d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z"/></svg>
          </span>
          <span>보험 챗봇</span>
        </div>
        <button class="icon-btn mobile-only" id="sidebarClose" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        새 대화
      </button>

      <nav class="chat-list" id="chatList"></nav>

      <div class="sidebar-foot">
        <button class="foot-btn" id="themeToggle">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel">다크 모드</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="backdrop"></div>

    <!-- 메인 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="model-badge">보험 챗봇 <span class="badge">Beta</span></div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="empty-state" id="emptyState">
          <h1 class="greeting">보험에 대해 물어보세요 📋</h1>
          <p class="greeting-sub">삼성생명 종신보험 약관을 검색해 드립니다.</p>
          <div class="chips">
            <button class="chip" data-prompt="종신보험이 무엇인가요?">📚 종신보험이란?</button>
            <button class="chip" data-prompt="보험금 지급 사유는?">💰 보험금 지급</button>
            <button class="chip" data-prompt="보험계약의 목적은?">🎯 계약 목적</button>
            <button class="chip" data-prompt="용어의 정의를 알려줘">📖 용어 정의</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <!-- 입력 -->
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="무엇이든 물어보세요…"></textarea>
          <button type="submit" class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <p class="disclaimer">이 답변은 약관의 일부를 검색한 결과입니다. 정확한 내용은 공식 약관을 확인해 주세요.</p>
      </div>
    </main>
  </div>

  <script>

    const INSURANCE_DATA = [{"company": "삼성생명", "product": "삼성유니버설종신보험(2504)(무배당,보증비용부과형)", "product_type": "종신보험", "title": "목적", "chapter": "제1관 목적 및 용어의 정의", "text": "이 보험계약(이하 “계약”이라 합니다)은 보험계약자(이하 “계약자”라 합니다)와 보험회사(이하 “회사”라 합니다) 사이에\n제3조(보험금의 지급사유)에 해당하는 피보험자의 위험을 보장하기 위하여 체결됩니다.", "keywords": ["목적", "피보험자", "보험계약자", "기타"], "query_aliases": ["목적은 어떻게 되나요", "종신보험에서 목적에 대해 알려주세요"]}, {"company": "삼성생명", "product": "삼성유니버설종신보험(2504)(무배당,보증비용부과형)", "product_type": "종신보험", "title": "용어의 정의", "chapter": "제1관 목적 및 용어의 정의", "text": "이 계약에서 사용되는 용어의 정의는, 이 계약의 다른 조항에서 달리 정의되지 않는 한 다음과 같습니다.\n1. 계약관계 관련 용어\n가. 계약자: 회사와 계약을 체결하고 보험료를 납입할 의무를 지는 사람을 말합니다.\n나. 보험수익자: 보험금 지급사유가 발생하는 때에 회사에 보험금을 청구하여 받을 수 있는 사람을 말합니다.\n다. 보험증권: 계약의 성립과 그 내용을 증명하기 위하여 회사가 계약자에게 드리는 증서를 말합니다.\n라. 진단계약: 계약을 체결하기 위하여 피보험자가 건강진단을 받아야 하는 계약을 말합니다.\n마. 피보험자: 보험사고의 대상이 되는 사람을 말합니다.\n2. 지급사유 관련 용어\n가. 재해: (별표3) 재해분류표에서 정한 재해를 말합니다.\n나. 장해: (별표4) 장해분류표에서 정한 기준에 따른 장해상태를 말합니다.\n다. 중요한 사항: 계약 전 알릴 의무와 관련하여 회사가 그 사실을 알았더라면 계약의 청약을 거절하거나 보험가입\n금액 한도 제한, 일부 보장 제외, 보험금 삭감, 보험료 할증과 같이 조건부로 승낙하는 등 계약 승낙에 영향을\n미칠 수 있는 사항을 말합니다.\n3. 지급금과 이자율 관련 용어\n가. 연단위 복리: 회사가 지급할 금액에 이자를 줄 때 1년마다 마지막 날에 그 이자를 원금에 더한 금액을 다음 1년\n의 원금으로 하는 이자 계산방법을 말합니다.\n설명\n<연단위 복리 예시>\n원금 100원, 연간 10% 이자율 적용 시 연단위 복리로 계산한 2년 시점의 총 이자금액\n∙ 1년차 이자 = 100원 ×10% = 10원\n원금\n∙ 2년차 이자 = (100원 + 10원) ×10% = 11원\n원금    1년차 이자\n→ 2년 시점의 총 이자금액 = 10원 + 11원 = 21원\n나. 평균공시이율: 전체 보험회사 공시이율의 평균으로, 이 계약 체결 시점의 평균공시이율을 말하며 평균공시이\n율은 금융감독원 홈페이지(www.fss.or.kr)에서 확인할 수 있습니다. 평균공시이율은 이 계약의 계약자적립액\n에 대한 적립이율인 공시이율과 다릅니다. [제32조의2(공시이율의 적용 및 공시) 참조]\n다. 적용이율 : 보험료를 산출할 때 적용하는 이율을 말합니다.\n라. 해약환급금: 계약이 해지되는 때에 회사가 계약자에게 돌려주는 금액을 말합니다.\n4. 기간과 날짜 관련 용어\n가. 보험기간: 계약에 따라 보장을 받는 기간을 말합니다.\n나. 영업일: 회사가 영업점에서 정상적으로 영업하는 날을 말하며, 토요일, “관공서의 공휴일에 관한 규정”에 따른\n공휴일과 근로자의 날을 제외합니다.\n다. 연계약해당일: 계약일부터 1년마다 돌아오는 매년의 계약해당일을 말합니다. 다만, 해당 연도의 계약해당일이\n\n없는 경우에는 해당 월의 마지막 날을 연계약해당일로 합니다.\n설명\n<해당 연도의 계약해당일이 없는 경우 예시>\n계약일이 2020년 2월 29일인 경우 차년도 연계약해당일은 2021년 2월 28일입니다.\n라. 월계약해당일 : 계약일부터 1개 계액을 말하며, 월대체보험료는 보험기간 중 월계약해당일에 해약환급금에서 공제합니다. 단, 계약체결비용,\n계약관리비용 중 기타비용 및 납입보험료에 대한 최저해약환급금 보증비용은 기본보험료 납입시 공제합니다.\n여기서 \"보험금 및 해약환급금 등을 보장하기 위한 보험료\"란 위험보험료, 최저사망보험금 보증비용 및 최저해\n약환급금 보증비용을 말하며, 월대체보험료를 공제하는 \"해약환급금\"은 보험계약대출의 원금과 이자를 차감한\n금액으로 특약의 해약환급금은 제외된 금액입니다.\n나. 월납\n⑴ 계약일부터 보험료 납입경과기간 2년(24회 납입)이내\n해당 월의 보험금 및 해약환급금 등을 보장하기 위한 보험료, 계약체결비용, 계약관리비용 및 특약보험료의\n합계액을 말하며, 해당 월의 기본보험료를 납입 시 계약자적립액에서 공제합니다. 다만, 기본보험료를 해당\n월계약해당일 이전에 납입 시에는 해당 월계약해당일에 계약자적립액에서 공제합니다.\n여기서 \"보험금 및 해약환급금 등을 보장하기 위한 보험료\"란 위험보험료, 최저사망보험금 보증비용 및\n최저해약환급금 보증비용, 보험료 납입면제 부분을 말하며, \"특약보험료\"의 경우 보험료의 납입이 면제된\n특약의 보험료는 제외합니다.\n⑵  보험기간 중 보험료 납입경과기간 2년(24회 납입)이 지난 후\n해당 월의 보험금 및 해약환급금 등을 보장하기 위한 보험료, 계약체결비용, 계약관리비용 중 유지관련비용\n및 특약보험료의 합계액을 말합니다. 월대체보험료는 월계약해당일에 해약환급금에서 공제하며, 계약관리\n비용 중 기타비용은 보험료 납입 시 공제합니다.\n여기서 \"보험금 및 해약환급금 등을 보장하기 위한 보험료\"란 위험보험료, 최저사망보험금 보증비용 및 최\n저해약환급금 보증비용, 보험료 납입면제 부분을 말하며, \"특약보험료\"는 계약관리비용 중 기타비용을 제외\n한 금액으로 보험료의 납입이 면제된 특약의 보험료는 제외합니다. 또한, 월대체보험료를 공제하는 \"해약환\n급금\"은 보험계약대출의 원금과 이자를 차감한 금액으로 특약의 해약환급금은 제외된 금액입니다.\n다만, 해당 월까지 납입한 보험료 합계액(단, 추가납입보험료 제외)이 해당 월까지 납입하기로 한 기본보험\n료(특약보험료 포함) 이상임에도 불구하고 해당 월의 기본보험료를 월계약해당일보다 늦게 납입하는 등의\n사유로 해약환급금에서 월대체보험료를 충당하지 못하는 계약은 월계약해당일에 계약자적립액에서 공제합\n니다. 여기서 \"해약환급금에서 월대체보험료를 충당하지 못하는 계약\"은 보험계약대출의 원금과 이자의 잔\n액이 없고 계약자적립액의 인출을 하지 않은 경우에 한합니다.\n설명\n<월납계약 월대체보험료 공제 예시>\n예1) 계약일 : 8월 15일, 보험료 납입일 : 매월 20일\n→ 2년 이내 매월 20일, 2년 이후 매월 15일 월대체보험료 공제\n예2) 계약일 : 8월 15일, 보험료 납입일 : 매월 10일\n→ 기간에 상관없이 매월 15일 월대체보험료 공제\n다. 추가납입보험료의 계약관리비용 등은 보험료 납입 시에 공제합니다.\n5. 이미 납입한 보험료\n가. 계약자가 회사에 납입한 기본보험료 및 추가납입보험료의 합계액으로 중도인출금액이 있었을 경우 중도인출\n금액을 차감한 금액을 말하며, 특약보험료는 제외된 금액입니다. 다만, 계약자가 보험가입금액을 감액하거나\n제44조의2(사망보험금 연금선지급금 지급에 관한 사항)에 따라 보험가입금액을 자동감액한 경우 이미 납입\n한 보험료는 제20조(계약내용의 변경 등) 제5항에 따라 계산된 이미 납입한 보험료와 해당 감액 이후 납입된\n보험료의 합계를 말합니다.\n나. 제4조(보험금 지급에 관한 세부 규정) 제1항에 따라 보험료 납입이 면제된 경우에는 보험료 납입기간 동안(단,\n보험료의 납입이 면제된 이후 기간에 한합니다) 정상적으로 기본보험료가 납입된 것으로 보고 ‘가’목에 따라\n계산한 금액을 말합니다.\n6. 계약자적립액\n납입보험료에서 월대체보험료 및 중도인출금액 등을 공제한 금액을 이 계약의 「공시이율」로 일자계산에 의하여\n\n적립한 금액을 말하며, 세부적인 내용은 산출방법서에서 정한 방법에 따릅니다.\n7. 예정계약자적립액\n납입보험료에서 월대체보험료 및 중도인출금액 등을 공제한 금액을 이 계약의 「적용이율」로 일자계산에 의하여\n적립한 금액을 말하며, 세부적인 내용은 산출방법서에서 정한 방법에 따릅니다.\n8. 기본보험금\n보험가입금액을 말합니다. 단, 중도인출 시에는 인출전 기본보험금에서 중도인출금액을 차감하며, 납입보험료 총\n액(특약보험료 포함)이 기본보험료(특약보험료 포함)를 매월 정상적으로 납입한 것으로 가정한 금액보다 큰 경우\n에는 초과납입액만큼 더합니다.\n9. 최저사망보험금\n향후 공시이율에 관계없이 최저로 보장해주는 사망보험금으로서 제8호에서 정한 「기본보험금」과 제5호에서 정\n한 이미 납입한 보험료 중 큰 금액을 말합니다. 향후 공시이율이 지속적으로 하락하더라도, “최저해약환급금”이\n‘0’보다 큰 기간까지 최저사망보험금을 보장합니다. 다만, 제26조[보험료의 납입이 연체되는 경우 납입최고(독촉)\n와 계약의 해지]에 따라 계약이 해지되는 경우에는 최저사망보험금을 보증하지 않습니다.\n10. 최저해약환급금\n향후 공시이율에 관계없이 보장하는 최저한도의 해약환급금으로서 예정계약자적립액에서 이미 지출한 계약체결\n비용 해당액을 차감한 금액을 말합니다.\n11. 최저사망보험금 보증비용\n공시이율에 관계없이 최저사망보험금의 지급을 보증하는데 소요되는 비용을 말합니다.\n12. 최저해약환급금 보증비용\n공시이율에 관계없이 최저해약환급금의 지급을 보증하는데 소요되는 비용을 말합니다.\n13. 유지보너스 금액(월납 계약에 한함)\n가. 유지보너스 금액은 이 계약의 사업방법서에서 정한 방법에 따라 보험가입금액이 8천만원 이상인 고액계약에\n대해 기본보험료의 일정비율을 유지보너스 발생일에 추가납입보험료에 의한 계약자적립액에 가산하는 금액\n을 말하며, 별표2(보너스 금액 기준표)와 같이 계산합니다. 다만, 보험기간 중 계약자가 제20조(계약내용의 변\n경 등) 제3항에 따라 보험가입금액을 감액하거나 제44조의2(사망보험금 연금선지급금 지급에 관한 사항)에\n따라 보험가입금액을 자동감액한 경우에는 감액된 보험가입금액을 기준으로 이를 적용합니다.\n나. 유지보너스 발생일에 해약환급금에서 월대체보험료를 충당할 수 없게 된 경우 유지보너스 금액을 유지보너스\n발생일에 추가납입보험료에 의한 계약자적립액에 가산하지 않으며, 보험료의 납입 등으로 월대체보험료 충당\n이 가능한 때 가산합니다. 여기서 \"해약환급금\"은 보험계약대출의 원금과 이자를 차감한 금액으로 특약의 해\n약환급금은 제외된 금액입니다\n용어\n해설\n< 유지보너스 발생일 >\n계약일부터 각각의 경과시점(3년, 5년, 10년, 20년 및 보험료 납입기간 등)의 직전 월계약해당일을\n말하며, 보험료 납입기간별로 별표2(보너스 금액 기준표)에서 정한 날로 합니다.\n14. 유지보너스 적립액(월납 계약에 한함)\n유지보너스 발생일에 제13호의 유지보너스 금액을 추가납입보험료에 의한 계약자적립액에 가산하기 위해 회사\n가 적립하는 금액으로 산출방법서에서 정한 방법에 따라 계산한 금액을 말합니다.\n15. 납입보너스 금액(월납 계약에 한함)\n가. 납입보너스 금액은 이 계약의 사업방법서에서 정한 방법에 따라 계약일부터 2년이 지난 후 납입하는 보험료의\n일정 비율을 납입보너스 발생일에 추가납입보험료에 의한 계약자적립액에 가산하는 금액을 말하며 별표2(보\n너스 금액 기준표)와 같이 계산합니다.\n나. 납입보너스 발생일에 해약환급금에서 월대체보험료를 충당할 수 없게 된 경우 납입보너스 금액을 납입보너스\n발생일에 추가납입보험료에 의한 계약자적립액에 가산하지 않으며, 보험료의 납입 등으로 월대체보험료 충당\n이 가능한 때 가산합니다. 여기서 \"해약환급금\"은 보험계약대출의 원금과 이자를 차감한 금액으로 특약의 해\n약환급금은 제외된 금액입니다.\n\n용어\n해설\n<납입보너스 발생일>\n계약일부터 피보험자의 100세 연계약해당일까지의 기간 중 계약일을 기준으로 매 5년 경과 시점\n의 연계약해당일을 말합니다. 차감하고 지급합니다. 다만, 제4항에 따라 매월 사망보험금 연금선지급금을 지급하던 중 보험금 지급사유 발생 등\n으로 계약이 더 이상 효력이 없게 된 시점에 해당 보험연도에 지급될 사망보험금 연금선지급금 중 지급되지 않은 금액\n이 있는 경우에는 그 금액을 계약자에게 지급하며, 이를 회사가 지급해야 할 보험금에서 차감하지 않습니다.\n⑥ 신청일 이후부터 마지막 사망보험금 연금선지급일까지 제32조의3(계약자적립액의 인출) 및 제33조(보험계약대출)\n은 적용하지 않습니다. 또한, 제20조(계약내용의 변경 등)에 따른 보험가입금액의 감액을 신청할 수 없습니다.\n\n별표1\n보험금 지급기준표\n\n□ 사망보험금 (약관 제3조)\n지급 사유\n피보험자가 보험기간(종신) 중 사망하였을 경우\n지급금액\n다음 중 큰 금액을 지급\n- 기본보험금\n- 직전 월계약해당일의 계약자적립액×101%\n- 이미 납입한 보험료\n㈜ 1. “기본보험금”, “계약자적립액” 및 “이미 납입한 보험료”는 약관 제2조의2(용어의 정의2)에서 정한 내용에 따릅니다.\n2. “직전 월계약해당일의 계약자적립액×101%”은 보험금 지급사유 발생 직전 월계약해당일의 계약자적립액으로\n계산하며, 직전 월계약해당일 이후에 보험료 추가납입 또는 중도인출이 있었을 경우 해당금액을 가감합니다.\n3. 「공시이율」(가입 후 10년 이내에는 연복리 1.0%, 10년을 초과한 경우에는 연복리 0.5% 최저보증)은 매월 1일\n회사가 정한 이율로 합니다. 단, 계약건별로 적용되는 공시이율은 연계약해당일이 속한달의 공시이율로 하여\n보험가입시점부터 매 1년간 확정 적용합니다.\n4. 회사는 사망보험금 지급사유가 발생한 경우에는 피보험자 사망 시까지 산출방법서에서 정한 방법에 따라 적립한\n유지보너스 적립액 및 납입보너스 적립액을 사망보험금에 추가하여 보험수익자에게 지급합니다.\n다만, 이 계약의 사업방법서에서 정한 방법에 따라 「적립형 계약」으로 일부 또는 전부를 전환한 이후에\n피보험자가 사망한 경우에는 전환한 부분에 대한 유지보너스 적립액, 납입보너스 적립액(단, 납입보너스\n적립액은 적립형 계약으로 전부를 전환한 경우 한합니다)은 지급하지 않습니다.\n5. ㈜4에서 정한 유지보너스 적립액 및 납입보너스 적립액을 지급할 때 약관 제8조(보험금의 지급절차) 제2항에서\n정한 보험금을 지급할 때의 보험금 지급일까지의 기간에 대한 이자 계산 방법에도 불구하고 지급기일의 다음 날\n부터 지급일까지의 기간에 대한 이자는 보험계약대출이율을 연단위 복리로 계산합니다.\n\n별표2\n보너스 금액 기준표\n\n□ 유지보너스 금액(약관 제2조의2 제13호)\n유지보너스 금액\n유지보너스 금액 = 주계약 기본보험료 × 유지보너스비율\n< 유지보너스비율 >\n유지보너스 발생일\n보험료 납입기간\n유지보너스비율\n가입후 3년 경과시점의\n직전 월계약해당일\n5년납 이상\n12×3×보험료비율\n가입후 5년 경과시점의\n직전 월계약해당일\n12×2×보험료비율\n가입후 10년 경과시점의\n직전 월계약해당일\n7년납\n12×2×보험료비율\n10년납 이상\n12×5×보험료비율\n가입후 20년 경과시점의\n직전 월계약해당일\n12년납\n12×2×보험료비율\n15년납\n12×5×보험료비율\n20년납 이상\n12×10×보험료비율\n보험료 납입기간 경과 시점의\n직전 월계약해당일\n20년납 초과\n12×(보험료 납입기간(년수)-20)\n×보험료비율\n< 보험료비율 >\n유지보너스 발생일\n보험가입금액\n8천만원\n이상\n1억원\n미만\n1억원\n이상\n1.5억원\n미만\n1.5억원\n이상\n2억원\n미만\n2억원\n이상\n3억원\n미만\n3억원\n이상\n10억원\n미만\n10억원\n이상\n가입후 3년 경과시점의\n직전 월계약해당일\n0.5%\n1.5%\n2.0%\n3.0%\n4.0%\n5.0%\n가입후 5년 경과시점의\n직전 월계약해당일\n0.5%\n1.5%\n2.0%\n3.0%\n4.0%\n5.0%\n가입후 10년 경과시점\n의 직전 월계약해당일\n1.0%\n3.0%\n3.5%\n4.5%\n5.0%\n6.0%\n가입후 20년 경과시점\n의 직전 월계약해당일\n1.0%\n3.0%\n3.5%\n4.5%\n5.0%\n6.0%\n보험료 납입기간 경과시\n점의 직전 월계약해당일\n1.0%\n3.0%\n3.5%\n4.5%\n5.0%\n6.0%\n\n㈜  상기 \"주계약 기본보험료\" 및 \"보험가입금액\"은 유지보너스 발생일의 금액으로 합니다.\n\n□ 납입보너스 금액(약관 제2조의2 제15호)\n납입보너스 금액\n납입보너스 금액 = 납입보너스 대상보험료 × 납입보너스비율\n< 납입보너스 대상보험료 및 납입보너스비율 >\n납입보너스 발생일\n납입보너스 대상보험료\n(보험연도 기준)\n납입보너스\n비율\n가입후 5년 경과시점의\n연계약해당일\n3차년도부터 5차년도 기간 동안\n납입한 보험료\n0.5%\n가입후 10년 경과시점의\n연계약해당일\n6차년도부터 10차년도 기간 동\n안 납입한 보험료\n0.5%\n가입후 15년 경과시점의\n연계약해당일\n11차년도부터 15차년도 기간 동\n안 납입한 보험료\n1.0%\n가입후 20년 경과시점의\n연계약해당일\n16차년도부터 20차년도 기간 동\n안 납입한 보험료\n1.5%\n이후 직전 납입보너스\n발생일을 기준으로 매 5년\n경과시점의 연계약해당일\n직전 납입보너스 발생일부터\n매 5년동안 납입한 보험료\n1.5%\n피보험자의 100세\n연계약해당일\n직전 납입보너스 발생일부터\n피보험자의 100세 연계약해당일\n의 전일까지 납입한 보험료\n1.5%\n\n㈜ 납입보너스 대상보험료는 계약자가 실제로 납입한 보험료로 하며, 납입이 면제된 보험료와 추가납입보험료 중에서\n중도인출한 금액을 재납입한 금액은 제외합니다. 그 외 납입보너스 대상보험료에 관한 사항은 사업방법서에 따릅니다.\n\n별표3\n재 해 분 류 표\n\n1. 재해의 정의\n이 보험약관에서 재해는 다음 중 어느 하나에 해당하는 것을 말합니다.\n① 한국표준질병·사인분류상의 (S00∼Y84)에 해당하는 우발적인 외래의 사고\n② 감염병의 예방 및 관리에 관한 법률 제2조 제2호에서 규정한 제1급 감염병\n\n2. 재해에 해당되지 않는 사항\n다음 각 호는 이 보험약관에서 정의하는 재해에 해당되지 않습니다.\n① 질병 또는 체질적 요인이 있는 자로서 경미한 외부 요인으로 발병하거나 그 증상이 더욱 악화된 경우\n② 사고의 원인이 다음과 같은 경우\n- 과잉 노력 및 격심한 또는 반복적 운동(X50)\n- 무중력 환경에서의 장시간 체류(X52)\n- 식량부족(X53)\n- 물 부족(X54)\n- 상세불명의 결핍(X57)\n- 고의적 자해(X60∼X84)\n-‘법적 개입’중 법적 처형(Y35.5)\n③ ‘외과적 및 내과적 치료 중 환자의 재난(Y60∼Y69)’ 중 진료기관의 고의 또는 과실이 없는 사고 [단, 처치 당시에는\n재난의 언급이 없었으나 환자의 이상반응 또는 이후 합병증의 원인이 된 외과적 및 기타 내과적 처치(Y83∼Y84)는\n보장]\n④ ‘자연의 힘에 노출(X30∼X39)’중 급격한 액체손실로 인한 탈수\n⑤ ‘우발적 익사 및 익수(W65∼W74), 호흡과 관련된 기타 불의의 위협(W75∼W84), 눈 또는 인체의 개구부를 통하여\n들어온 이물(W44)’중 질병에 의한 호흡장해 및 삼킴장해\n⑥ 한국표준질병·사인분류상의 (U00∼U99)에 해당하는 질병\n\n㈜ 1. 위 ( ) 안의 내용은 제8차 개정 한국표준질병•사인분류(통계청 고시 제2020-175호, 2021.1.1시행) 상의 분류번\n호를 말하며, 이후 한국표준질병ㆍ사인분류가 개정되는 경우에는 발생(진단) 시점에 시행 중인 한국표준질병ㆍ사\n인분류를 적용합니다.\n설명\n피보험자에게 발생(진단)된 사고가 제8차 개정 한국표준질병ㆍ사인분류를 적용할 때, 약관에서 규정\n하는 「재해」에 해당될 수 있었다고 하더라도 발생(진단) 당시에 시행 중인 제9차 개정 이후 한국표준\n질병ㆍ사인분류를 적용할 때 약관에서 규정하는 「재해」가 아닌 경우에는 약관에서 규정하는 「재해」\n로 보지 않습니다.\n반대로 피보험자에게 발생(진단)된 사고가 제8차 개정 한국표준질병ㆍ사인분류를 적용할 때, 약관에\n서 규정하는 「재해」에 해당될 수 없었다고 하더라도 발생(진단) 당시에 시행 중인 제9차 개정 이후 한\n국표준질병ㆍ사인분류를 적용할 때 약관에서 규정하는 「재해」인 경우에는 약관에서 규정하는 「재해」\n로 봅니다.\n\n2. 발생(진단) 시점에 상기 “1.재해의 정의 및 2. 재해에 해당되지 않는 사항”인지 여부가 확인된 경우, 발생(진단) 이후\n한국표준질병ㆍ사인분류의 개정으로 재해의 분류가 추가 또는 제외되더라도 상기 “1.재해의 정의 및 2. 재해에 해당\n되지 않는 사항”인지 여부를 다시 판단하지 않습니다.\n설명\n발생(진단) 당시의 한국표준질병∙사인분류를 적용하여 약관에서 규정하는 「재해」에 해당될 수 없었다\n면, 발생(진단) 이후 한국표준질병∙사인분류가 개정되어 약관에서 규정하는 「재해」로 볼 수 있어 「재해\n발생(진단)」 확인이 가능한 서류를 제출한다고 하더라도 약관에서 규정하는 「재해」로 보지 않습니다.\n3.  위 「1. 재해의 정의   ②」에 해당하는 감염병은 보험사고 발생 당시 시행중인 법률을 적용하며, 「2. 재해에 해당되지\n않는 사항 ⑥」에 해당되더라도 보장대상에서 제외하지 않습니다.\n\n별표4\n장 해 분 류 표\n\n□ 총칙\n\n1. 장해의 정의\n1) ‘장해’라 함은 상해 또는 질병에 대하여 치유된 후 신체에 남아 있는 영구적인 정신 또는 육체의 훼손 상태 및 기능 상실 상태를 말합니다. 다만, 질\n병과 부상의 주 증상과 합병증상 및 이에 대한 치료를 받는 과정에서 일시적으로 나타나는 증상은 장해에 포함되지 않습니다.\n2) ‘영구적’이라 함은 원칙적으로 치유하는 때 장래 회복할 가망이 없는 상태로서 정신적 또는 육체적 훼손 상태임이 의학적으로 인정되는 경우를 말\n합니다.\n3) ‘치유된 후’라 함은 상해 또는 질병에 대한 치료의 효과를 기대할 수 없게 되고 또한 그 증상이 고정된 상태를 말합니다.\n4) 다만, 영구히 고정된 증상은 아니지만 치료 종결 후 한시적으로 나타나는 장해에 대하여는 그 기간이 5년 이상인 경우 해당 장해지급률의 20%를\n한시 장해의 장해지급률로 정합니다.\n5) 위 4)에 따라 장해지급률이 결정되었으나 그 이후 보장받을 수 있는 기간[계약(특약)의 효력이 없어진 경우에는 보험기간이 10년 이상인 계약(특\n약)은 상해 발생일 또는 질병의 진단 확정일부터 2년 이내로 하고, 보험기간이 10년 미만인 계약(특약)은 상해 발생일 또는 질병의 진단 확정일부\n터 1년 이내]에 장해상태가 더 악화된 때에는 그 악화된 장해상태를 기준으로 장해지급률을 결정합니다.\n\n2. 신체 부위\n‘신체 부위’라 함은 ① 눈 ② 귀 ③ 코 ④ 씹어먹거나 말하는 기능 ⑤ 외모 ⑥ 척추(등뼈) ⑦ 체간골 ⑧ 팔 ⑨ 다리 ⑩ 손가락 ⑪ 발가락 ⑫ 흉·복부 장기 및\n비뇨생식기 ⑬ 신경계·정신행동의 13개 부위를 말하며, 이를 각각 동일한 신체 부위라 합니다. 다만, 좌·우의 눈, 귀, 팔, 다리, 손가락, 발가락은 각각\n다른 신체 부위로 봅니다.\n\n3. 장해의 판정\n1) 하나의 장해가 관찰 방법에 따라서 장해분류표상 2가지 이상의 신체부위에서 장해로 평가되는 경우에는 그중 높은 장해지급률을 적용합니다.\n2) 동일한 신체 부위에 2가지 이상의 장해가 발생한 경우에는 합산하지 않고 그중 높은 장해지급률을 적용함을 원칙으로 합니다. 그러나 각 신체 부\n위별 판정 기준에서 별도로 정한 경우에는 그 기준에 따릅니다.\n3) 하나의 장해가 다른 장해와 통상 파생하는 관계에 있는 경우에는 그중 높은 장해지급률만을 적용하며, 하나의 장해로 둘 이상의 파생장해가 발생\n하는 경우 각 파생장해의 장해지급률을 합산한 장해지급률과 최초 장해의 장해지급률을 비교하여 그 중 높은 장해지급률을 적용합니다.\n4) 의학적으로 뇌사 판정을 받고 호흡 기능과 심장박동 기능을 상실하여 인공심박동기 등 장치에 의존하여 생명을 연장하고 있는 뇌사상태는 장해의\n판정대상에 포함되지 않습니다. 다만, 뇌사 판정을 받은 경우가 아닌 식물인간 상태(의식이 전혀 없고 사지의 자발적인 움직임이 불가능하여 일\n상생활에서 항시 간호가 필요한 상태)는 각 신체 부위별 판정 기준에 따라 평가합니다.\n5) 장해 진단서에는 ① 장해 진단명 및 발생 시기 ② 장해의 내용과 그 정도 ③ 사고와의 인과관계 및 사고의 관여도 ④ 향후 치료의 문제 및 호전도를\n필수적으로 기재해야 합니다. 다만, 신경계·정신행동 장해의 경우 ① 개호(장해로 혼자서 활동이 어려운 사람을 곁에서 돌보는 것) 여부 ② 객관\n적 이유 및 개호의 내용을 추가로 기재하여야 합니다.\n\n□ 장해분류별 판정 기준\n\n1. 눈의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 두 눈이 멀었을 때\n2) 한 눈이 멀었을 때\n3) 한 눈의 교정시력이 0.02 이하로 된 때\n4) 한 눈의 교정시력이 0.06 이하로 된 때\n5) 한 눈의 교정시력이 0.1 이하로 된 때\n6) 한 눈의 교정시력이 0.2 이하로 된 때\n7) 한 눈의 안구(눈동자)에 뚜렷한 운동 장해나 뚜렷한 조절 기능장해를 남긴 때\n8) 한 눈에 뚜렷한 시야 장해를 남긴 때\n9) 한 눈의 눈꺼풀에 뚜렷한 결손을 남긴 때\n10) 한 눈의 눈꺼풀에 뚜렷한 운동 장해를 남긴 때\n\n나. 장해판정 기준\n1) 시력 장해의 경우 공인된 시력검사표에 따라 최소 3회 이상 측정합니다.\n2) ‘교정시력’이라 함은 안경(콘택트렌즈를 포함한 모든 종류의 시력 교정 수단)으로 교정한 원거리 최대 교정 시력을 말합니다. 다만, 각막이식술을\n받은 환자인 경우 각막이식술 이전의 시력상태를 기준으로 평가합니다.\n3) ‘한 눈이 멀었을 때’라 함은 안구의 적출은 물론 명암을 가리지 못하거나(‘광각무’) 겨우 가릴 수 있는 경우(‘광각유’)를 말합니다.\n4) ‘한 눈의 교정시력이 0.02 이하로 된 때’라 함은 안전 수동(Hand Movement) 주1, 안전 수지(Finger Counting) 주2 상태를 포함합니다.\n※ 주1) 안전 수동 : 물체를 감별할 정도의 시력상태가 아니며 눈앞에서 손의 움직임을 식별할 수 있을 정도의 시력상태\n주2) 안전 수지 : 시표의 가장 큰 글씨를 읽을 수 있는 정도의 시력은 아니나 눈 앞 30cm 이내에서 손가락의 개수를 식별할 수 있을 정도의 시력\n상태\n5) 안구(눈동자) 운동 장해의 판정은 질병의 진단 또는 외상 후 1년 이상이 지난 뒤 그 장해 정도를 평가합니다.\n6)‘안구(눈동자)의 뚜렷한 운동 장해’라 함은 아래의 두 경우 중 하나에 해당하는 경우를 말합니다.\n가) 한 눈의 안구(눈동자)의 주시야(머리를 움직이지 않고 눈만을 움직여서 볼 수 있는 범위)의 운동 범위가 정상의 1/2 이하로 감소된 경우\n나) 중심 20도 이내에서 복시(물체가 둘로 보이거나 겹쳐 보임)를 남긴 경우\n7) ‘안구(눈동자)의 뚜렷한 조절 기능장해’라 함은 조절력이 정상의 1/2 이하로 감소된 경우를 말합니다. 다만, 조절력의 감소를 무시할 수 있는 50세\n이상(장해 진단시 연령 기준)의 경우는 제외합니다.\n8) ‘뚜렷한 시야 장해’라 함은 한 눈의 시야 범위가 정상시야 범위의 60% 이하로 제한된 경우를 말합니다. 이 경우 시야검사는 공인된 시야검사방법\n으로 측정하며, 시야 장해 평가 시 자동시야검사계(골드만 시야검사)를 이용하여 8방향 시야 범위 합계를 정상 범위와 비교하여 평가합니다.\n9) ‘눈꺼풀에 뚜렷한 결손을 남긴 때’라 함은 눈꺼풀의 결손으로 눈을 감았을 때 각막(검은 자위)이 완전히 덮이지 않는 경우를 말합니다.\n10)‘눈꺼풀에 뚜렷한 운동 장해를 남긴 때’라 함은 눈을 떴을 때 동공을 1/2 이상 덮거나 또는 눈을 감았을 때 각막을 완전히 덮을 수 없는 경우를 말\n합니다.\n11) 외상이나 화상 등으로 안구의 적출이 불가피한 경우에는 외모의 추상(추한 모습)이 가산됩니다. 이 경우 안구가 적출되어 눈자위의 조직요몰(凹\n沒) 등으로 의안마저 끼워 넣을 수 없는 상태이면 ‘뚜렷한 추상(추한 모습)’으로, 의안을 끼워 넣을 수 있는 상태이면 ‘약간의 추상(추한 모습)’으\n로 지급률을 가산합니다.\n12) 눈꺼풀에 뚜렷한 결손을 남긴 때’에 해당하는 경우에는 추상(추한 모습)장해를 포함하여 장해를 평가한 것으로 보고 추상(추한 모습)장해를 가산\n하지 않습니다. 다만, 안면부의 추상(추한 모습)은 두 가지 장해평가 방법 중 피보험자에게 유리한 것을 적용합니다.\n\n2. 귀의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 두 귀의 청력을 완전히 잃었을 때\n2) 한 귀의 청력을 완전히 잃고, 다른 귀의 청력에 심한 장해를 남긴 때\n3) 한 귀의 청력을 완전히 잃었을 때\n4) 한 귀의 청력에 심한 장해를 남긴 때\n5) 한 귀의 청력에 약간의 장해를 남긴 때\n6) 한 귀의 귓바퀴의 대부분이 결손된 때\n7) 평형기능에 장해를 남긴 때\n나. 장해판정 기준\n1) 청력 장해는 순음청력검사 결과에 따라 데시벨(dB : decibel)로서 표시하고 3회 이상 청력검사를 실시한 후 적용합니다. 다만, 각 측정치의 결괏\n값 차이가 ±10dB 이상인 경우 청성뇌간반응검사(ABR)를 통해 객관적인 장해 상태를 재평가하여야 합니다.\n2) ‘한 귀의 청력을 완전히 잃었을 때’라 함은 순음청력검사 결과 평균순음역치가 90dB 이상인 경우를 말합니다.\n3) ‘심한 장해를 남긴 때’라 함은 순음청력검사 결과 평균순음역치가 80dB 이상인 경우에 해당되어, 귀에다 대고 말하지 않고는 큰 소리를 알아듣지\n못하는 경우를 말합니다.\n4) ‘약간의 장해를 남긴 때’라 함은 순음청력검사 결과 평균순음역치가 70dB 이상인 경우에 해당되어, 50cm 이상의 거리에서는 보통의 말소리를\n알아듣지 못하는 경우를 말합니다.\n5) 순음청력검사를 실시하기 곤란하거나(청력의 감소가 의심되지만 의사소통이 되지 않는 경우, 만 3세 미만의 소아 포함) 검사결과에 대한 검증이\n필요한 경우에는 ‘언어청력검사, 임피던스 청력검사, 청성뇌간반응검사(ABR), 이음향방사검사’ 등을 추가실시 후 장해를 평가합니다.\n다. 귓바퀴의 결손\n1) ‘귓바퀴의 대부분이 결손된 때’라 함은 귓바퀴의 연골부가 1/2 이상 결손된 경우를 말합니다.\n2) 귓바퀴의 연골부가 1/2 미만 결손이고 청력에 이상이 없으면 외모의 추상(추한 모습) 장해로만 평가합니다.\n\n라. 평형기능의 장해\n1) ‘평형기능에 장해를 남긴 때’라 함은 전정기관 이상으로 보행 등 일상생활이 어려운 상태로 아래의 평형장해 평가항목별 합산 점수가 30점 이상\n인 경우를 말합니다.\n항목\n내용\n점수\n검사 소견\n1) 양측 전정 기능 소실\n2) 양측 전정 기능 감소\n3) 일측 전정 기능 소실\n치료 병력\n1) 장기 통원치료(1년간 12회 이상)\n2) 장기 통원치료(1년간 6회 이상)\n3) 단기 통원치료(6개월간 6회 이상)\n4) 단기 통원치료(6개월간 6회 미만)\n기능장해 소견\n1) 두 눈을 감고 일어서기 곤란하거나 두 눈을 뜨고 10m 거리를 직선으로 걷다가 쓰러지는 경우\n2) 두 눈을 뜨고 10m 거리를 직선으로 걷다가 중간에 균형을 잡으려 멈추어야 하는 경우\n3) 두 눈을 뜨고 10m 거리를 직선으로 걸을 때 중앙에서 60cm 이상 벗어나는 경우\n2) 평형기능의 장해는 장해판정 직전 1년 이상 지속적인 치료 후 장해가 고착되었을 때 판정하며, 뇌 병변 여부, 전정 기능 이상 및 장해상태를 평가\n하기 위해 아래의 검사들을 기초로 합니다.\n가) 뇌영상검사(CT, MRI)\n나) 온도 안진 검사, 전기 안진 검사(또는 비디오 안진 검사) 등\n\n3. 코의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 코의 호흡 기능을 완전히 잃었을 때\n2) 코의 후각 기능을 완전히 잃었을 때\n나. 장해판정 기준\n1) ‘코의 호흡 기능을 완전히 잃었을 때’라 함은 일상생활에서 구강호흡의 보조를 받지 않는 상태에서 코로 숨 쉬는 것만으로 정상적인 호흡을 할 수\n없다는 것이 비강통기도 검사 등 의학적으로 인정된 검사로 확인되는 경우를 말합니다.\n2) ‘코의 후각 기능을 완전히 잃었을 때’라 함은 후각신경의 손상으로 양쪽 코의 후각 기능을 완전히 잃은 경우를 말하며, 후각감퇴는 장해의 대상으\n로 하지 않습니다.\n3) 양쪽 코의 후각 기능은 후각인지 검사, 후각역치 검사 등을 통해 6개월 이상 고정된 후각의 완전 손실이 확인되어야 합니다.\n4) 코의 추상(추한 모습) 장해를 수반한 때에는 기능장해의 지급률과 추상장해의 지급률을 합산합니다.\n\n4. 씹어먹거나 말하는 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 씹어 먹는 기능과 말하는 기능 모두에 심한 장해를 남긴 때\n2) 씹어 먹는 기능에 심한 장해를 남긴 때\n3) 말하는 기능에 심한 장해를 남긴 때\n4) 씹어 먹는 기능과 말하는 기능 모두에 뚜렷한 장해를 남긴 때\n5) 씹어 먹는 기능 또는 말하는 기능에 뚜렷한 장해를 남긴 때\n6) 씹어 먹는 기능과 말하는 기능 모두에 약간의 장해를 남긴 때\n7) 씹어 먹는 기능 또는 말하는 기능에 약간의 장해를 남긴 때\n8) 치아에 14개 이상의 결손이 생긴 때\n9) 치아에 7개 이상의 결손이 생긴 때\n10) 치아에 5개 이상의 결손이 생긴 때\n\n나. 장해판정 기준\n1) 씹어 먹는 기능의 장해는 윗니(상악 치아)와 아랫니(하악 치아)의 맞물림(교합), 배열 상태 및 아래턱의 개구 운동, 삼킴(연하) 운동 등에 따라 종합\n적으로 판단하여 결정합니다.\n2) ‘씹어 먹는 기능에 심한 장해를 남긴 때’라 함은 심한 개구 운동 제한이나 저작운동 제한으로 물이나 이에 준하는 음료 이외는 섭취하지 못하는 경\n우를 말합니다.\n3) ‘씹어 먹는 기능에 뚜렷한 장해를 남긴 때’라 함은 아래의 경우 중 하나 이상에 해당되는 때를 말합니다.\n가) 뚜렷한 개구 운동 제한 또는 뚜렷한 저작운동 제한으로 미음 또는 이에 준하는 정도의 음식물(죽 등) 외는 섭취하지 못하는 경우\n나) 위‧아래턱(상‧하악)의 가운데 앞니(중절치) 간 최대 개구 운동이 1cm 이하로 제한되는 경우\n다) 위‧아래턱(상‧하악)의 부정교합(전방, 측방)이 1.5cm 이상인 경우\n라) 양측 1개 이하의 치아만 교합되는 상태\n마) 연하 기능 검사(비디오 투시 검사) 상 연하장애가 있고, 유동식 섭취 시 흡인이 발생하고 연식 외에는 섭취가 불가능한 상태\n4) ‘씹어 먹는 기능에 약간의 장해를 남긴 때’라 함은 아래의 경우 중 하나 이상에 해당되는 때를 말합니다.\n가) 약간의 개구 운동 제한 또는 약간의 저작운동 제한으로 부드러운 고형식(밥, 빵 등)만 섭취 가능한 경우\n나) 위‧아래턱(상‧하악)의 가운데 앞니(중절치)간 최대 개구 운동이 2cm 이하로 제한되는 경우\n다) 위‧아래턱(상‧하악)의 부정교합(전방, 측방)이 1cm 이상인 경우\n라) 양측 각 1개 또는 편측 2개 이하의 치아만 교합되는 상태\n마) 연하 기능 검사(비디오 투시 검사)상 연하장애가 있고, 유동식 섭취 시 간헐적으로 흡인이 발생하고 부드러운 고형식 외에는 섭취가 불가능한\n상태\n5) 개구 장해는 턱관절의 이상으로 개구 운동 제한이 있는 상태를 말하며, 최대 개구 상태에서 위‧아래턱(상‧하악)의 가운데 앞니(중절치) 간 거리를\n기준으로 합니다. 단, 가운데 앞니(중절치)가 없는 경우에는 측정 가능한 인접  치아간 거리의 최대치를 기준으로 합니다.\n6) 부정교합은 위턱(상악)과 아래턱(하악)의 부조화로 윗니(상악 치아)와 아랫니(하악 치아)가 전방 및 측방으로 맞물림에 제한이 있는 상태를 말합\n니다.\n7) ‘말하는 기능에 심한 장해를 남긴 때’라 함은 아래의 경우 중 하나 이상에 해당되는 때를 말합니다.\n가) 언어평가상 자음 정확도가 30% 미만인 경우\n나) 전실어증, 운동성실어증(브로카실어증)으로 의사소통이 불가한 경우\n8) ‘말하는 기능에 뚜렷한 장해를 남긴 때’라 함은 아래의 경우 중 하나 이상에 해당되는 때를 말합니다.\n가) 언어평가상 자음 정확도가 50% 미만인 경우\n나) 언어평가상 표현 언어 지수 25 미만인 경우\n9) ‘말하는 기능에 약간의 장해를 남긴 때’라 함은 아래의 경우 중 하나 이상에 해당되는 때를 말합니다.\n가) 언어평가상 자음 정확도가 75% 미만인 경우\n나) 언어평가상 표현 언어 지수 65 미만인 경우\n10) 말하는 기능의 장해는 1년 이상 지속적인 언어치료를 시행한 후 증상이 고착되었을 때 평가하며, 객관적인 검사를 기초로 평가합니다.\n11) 뇌‧중추신경계 손상(정신‧인지 기능 저하, 편마비 등)으로 인한 말하는 기능의 장해(실어증, 구음 장애) 또는 씹어 먹는 기능의 장해는 신경계‧\n정신행동 장해 평가와 비교하여 그중 높은 지급률 하나만 인정합니다.\n12) ‘치아의 결손’이란 치아의 상실 또는 발치된 경우를 말하며, 치아의 일부 손상으로 금관 치료(크라운 보철 수복)를 시행한 경우에는 치아의 일부\n결손을 인정하여 1/2개 결손으로 적용합니다.\n13) 보철치료를 위해 발치한 정상치아, 노화로 인해 자연 발치된 치아, 보철(복합레진, 인레이, 온레이 등)한 치아, 기존 의치(틀니, 임플란트 등)의 결\n손은 치아의 상실로 인정하지 않습니다.\n14) 상실된 치아의 크기가 크든지 또는 치간의 간격이나 치아 배열 구조 등의 문제로 사고와 관계없이 새로운 치아가 결손된 경우에는 사고로 결손\n된 치아 수에 따라 지급률을 결정합니다.\n15) 어린이의 유치는 향후에 영구치로 대체되므로 장해의 대상이 되지 않으나, 선천적으로 영구치 결손이 있는 경우에는 유치의 결손을 장해로 평가\n합니다.\n16) 가철성 보철물(신체의 일부에 붙였다 떼었다 할 수 있는 틀니 등)의 파손은 장해의 대상이 되지 않습니다.\n\n5. 외모의 추상(추한 모습) 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 외모에 뚜렷한 추상(추한 모습)을 남긴 때\n2) 외모에 약간의 추상(추한 모습)을 남긴 때\n\n나. 장해판정 기준\n1) ‘외모’란 얼굴(눈, 코, 귀, 입 포함), 머리, 목을 말합니다.\n2) ‘추상(추한 모습) 장해’라 함은 성형수술(반흔 성형술, 레이저치료 등 포함)을 시행한 후에도 영구히 남게 되는 상태의 추상(추한 모습)을 말합니다.\n3) ‘추상(추한 모습)을 남긴 때’라 함은 상처의 흔적, 화상 등으로 피부의 변색, 모발의 결손, 조직(뼈, 피부 등)의 결손 및 함몰 등으로 성형수술을 하여\n도 더 이상 추상(추한 모습)이 없어지지 않는 경우를 말합니다.\n4) 다발성 반흔 발생 시 각 판정 부위(얼굴, 머리, 목) 내의 다발성 반흔의 길이 또는 면적은 합산하여 평가합니다. 단, 길이가 5mm 미만의 반흔은 합\n산 대상에서 제외합니다.\n5) 추상(추한 모습)이 얼굴과 머리 또는 목 부위에 걸쳐 있는 경우에는 머리 또는 목에 있는 흉터의 길이 또는 면적의 1/2을 얼굴의 추상(추한 모습)\n으로 보아 산정합니다.\n다. 뚜렷한 추상(추한 모습)\n1) 얼굴\n가) 손바닥 크기 1/2 이상의 추상(추한 모습)\n나) 길이 10cm 이상의 추상 반흔(추한 모습의 흉터)\n다) 지름 5cm 이상의 조직 함몰\n라) 코의 1/2 이상 결손\n2) 머리\n가) 손바닥 크기 이상의 반흔(흉터) 및 모발 결손\n나) 머리뼈의 손바닥 크기 이상의 손상 및 결손\n3) 목\n손바닥 크기 이상의 추상(추한 모습)\n라. 약간의 추상(추한 모습)\n1) 얼굴\n가) 손바닥 크기 1/4 이상의 추상(추한 모습)\n나) 길이 5cm 이상의 추상 반흔(추한 모습의 흉터)\n다) 지름 2cm 이상의 조직 함몰\n라) 코의 1/4 이상 결손\n2) 머리\n가) 손바닥 크기 1/2 이상의 반흔(흉터) 및 모발 결손\n나) 머리뼈의 손바닥 크기 1/2 이상의 손상 및 결손\n3) 목\n손바닥 크기 1/2 이상의 추상(추한 모습)\n마. 손바닥 크기\n‘손바닥 크기’라 함은 해당 환자의 손가락을 제외한 손바닥의 크기를 말하며, 12세 이상의 성인에서는 8×10㎝(1/2 크기는 40㎠, 1/4 크기는 20㎠), 6\n∼11세의 경우는 6×8㎝(1/2 크기는 24㎠, 1/4 크기는 12㎠), 6세 미만의 경우는 4×6㎝(1/2 크기는 12㎠, 1/4 크기는 6㎠)로 간주합니다.\n\n6. 척추(등뼈)의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 척추(등뼈)에 심한 운동 장해를 남긴 때\n2) 척추(등뼈)에 뚜렷한 운동 장해를 남긴 때\n3) 척추(등뼈)에 약간의 운동 장해를 남긴 때\n4) 척추(등뼈)에 심한 기형을 남긴 때\n5) 척추(등뼈)에 뚜렷한 기형을 남긴 때\n6) 척추(등뼈)에 약간의 기형을 남긴 때\n7) 추간판탈출증으로 인한 심한 신경 장해\n8) 추간판탈출증으로 인한 뚜렷한 신경 장해\n9) 추간판탈출증으로 인한 약간의 신경 장해\n나. 장해판정 기준\n1) 척추(등뼈)는 경추에서 흉추, 요추, 제1천추까지를 동일한 부위로 합니다. 제2천추 이하의 천골 및 미골은 체간골의 장해로 평가합니다.\n\n2) 척추(등뼈)의 기형 장해는 척추체(척추뼈 몸통을 말하며, 횡돌기 및 극돌기는 제외합니다. 이하 이 신체 부위에서 같습니다)의 압박률 또는 척추체\n(척추뼈 몸통)의 만곡 정도에 따라 평가합니다.\n가) 척추체(척추뼈 몸통)의 만곡 변화는 객관적인 측정 방법(Cobb's Angle)에 따라 골절이 발생한 척추체(척추뼈 몸통)의 상‧하 인접 정상 척추\n체(척추뼈 몸통)를 포함하여 측정하며, 생리적 정상 만곡을 고려하여 평가합니다.\n나) 척추(등뼈)의 기형 장해는 척추체(척추뼈 몸통)의 압박률, 골절의 부위 등을 기준으로 판정합니다. 척추체(척추뼈 몸통)의 압박률은 인접 상‧하\n부[인접 상‧하부 척추체(척추뼈 몸통)에 진구성 골절이 있거나, 다발성 척추골절이 있는 경우에는 골절된 척추와 가장 인접한 상‧하부] 정상 척\n추체(척추뼈 몸통)의 전방 높이의 평균에 대한 골절된 척추체(척추뼈 몸통) 전방 높이의 감소비를 압박률로 정합니다.\n다) 척추(등뼈)의 기형 장해는 ｢산업재해보상보험법 시행규칙｣상  경추부, 흉추부, 요추부로 구분하여 각각을 하나의 운동단위로 보며, 하나의 운\n동단위 내에서 여러 개의 척추체(척추뼈 몸통)에 압박골절이 발생한 경우에는 각 척추체(척추뼈 몸통)의 압박률을 합산하고, 두 개 이상의 운동\n단위에서 장해가 발생한 경우에는 그중 가장 높은 지급률을 적용합니다.\n3) 척추(등뼈)의 장해는 퇴행성 기왕증 병변과 사고가 그 증상을 악화시킨 부분만큼, 즉 이 사고와의 관여도를 산정하여 평가합니다.\n4) 추간판탈출증으로 인한 신경 장해는 수술 또는 시술(비수술적 치료) 후 6개월 이상 지난 후에 평가합니다.\n5) 신경학적 검사상 나타난 저린감이나 방사통 등 신경자극 증상의 원인으로 CT, MRI 등 영상검사에서 추간판탈출증이 확인된 경우를 추간판탈출\n증으로 진단하며, 수술 여부에 관계없이 운동 장해 및 기형 장해로 평가하지 않습니다.\n6) 심한 운동 장해란 다음 중 어느 하나에 해당하는 경우를 말합니다.\n가) 척추체(척추뼈 몸통)에 골절 또는 탈구로 4개 이상의 척추체(척추뼈 몸통)를 유합(아물어 붙음) 또는 고정한 상태\n나) 머리뼈(두개골), 제1경추, 제2경추를 모두 유합 또는 고정한 상태\n7) 뚜렷한 운동 장해란 다음 중 어느 하나에 해당하는 경우를 말합니다.\n가) 척추체(척추뼈 몸통)에 골절 또는 탈구로 3개의 척추체(척추뼈 몸통)를 유합(아물어 붙음) 또는 고정한 상태\n나) 머리뼈(두개골)와 제1경추 또는 제1경추와 제2경추를 유합 또는 고정한 상태\n다) 머리뼈(두개골)와 상위 목뼈(상위 경추: 제1, 2경추) 사이에 CT 검사상, 두개 대후두공의 기저점(basion)과 축추 치돌기 상단 사이의 거리(BDI\n: Basion-Dental Interval)에 뚜렷한 이상 전위가 있는 상태\n라) 상위 목뼈(상위 경추: 제1, 2경추) CT 검사상, 환추 전방 궁(arch)의 후방과 치상돌기의 전면과의 거리(ADI: Atlanto-Dental Interval)에 뚜렷\n한 이상 전위가 있는 상태\n8) 약간의 운동 장해\n머리뼈(두개골)와 상위 목뼈(상위 경추: 제1, 2경추)를 제외한 척추체(척추뼈 몸통)에 골절 또는 탈구로 2개의 척추체(척추뼈 몸통)를 유합(아물어\n붙음) 또는 고정한 상태\n9) 심한 기형이란 다음 중 어느 하나에 해당하는 경우를 말합니다.\n가) 척추(등뼈)의 골절 또는 탈구 등으로 35° 이상의 척추전만증(척추가 앞으로 휘어지는 증상), 척추후만증(척추가 뒤로 휘어지는 증상) 또는 20°\n이상의 척추측만증(척추가 옆으로 휘어지는 증상) 변형이 있을 때\n나) 척추체(척추뼈 몸통) 한 개의 압박률이 60% 이상인 경우 또는 한 운동 단위 내에 두 개 이상 척추체(척추뼈 몸통)의 압박골절로 각 척추체(척\n추뼈 몸통)의 압박률의 합이 90% 이상일 때\n10) 뚜렷한 기형이란 다음 중 어느 하나에 해당하는 경우를 말합니다.\n가) 척추(등뼈)의 골절 또는 탈구 등으로 15° 이상의 척추전만증(척추가 앞으로 휘어지는 증상), 척추후만증(척추가 뒤로 휘어지는 증상) 또는 10°\n이상의 척추측만증(척추가 옆으로 휘어지는 증상) 변형이 있을 때\n나) 척추체(척추뼈 몸통) 한 개의 압박률이 40% 이상인 경우 또는 한 운동단위 내에 두 개 이상 척추체(척추뼈 몸통)의 압박골절로 각 척추체(척추\n뼈 몸통)의 압박률의 합이 60% 이상일 때\n11) 약간의 기형이란 다음 중 어느 하나에 해당하는 경우를 말합니다.\n가) 1개 이상의 척추(등뼈)의 골절 또는 탈구로 경도(가벼운 정도)의 척추전만증(척추가 앞으로 휘어지는 증상), 척추후만증(척추가 뒤로 휘어지는\n증상) 또는 척추측만증(척추가 옆으로 휘어지는 증상) 변형이 있을 때\n나) 척추체(척추뼈 몸통) 한 개의 압박률이 20% 이상인 경우 또는 한 운동 단위 내에 두 개 이상 척추체(척추뼈 몸통)의 압박골절로 각 척추체(척\n추뼈 몸통)의 압박률의 합이 40% 이상일 때\n12) ‘추간판탈출증으로 인한 심한 신경 장해’란 추간판탈출증으로 추간판을 2마디 이상(또는 1마디 추간판에 대해 2회 이상) 수술하고도  마미신경\n증후군이 발생하여 하지의 현저한 마비 또는 대소변의 장해가 있는 경우\n13) ‘추간판탈출증으로 인한 뚜렷한 신경 장해’란 추간판탈출증으로 추간판 1마디를 수술하고도 신경 생리 검사에서 명확한 신경근 병증의 소견이\n지속되고 척추 신경근의 불완전 마비가 인정되는 경우\n14) ‘추간판탈출증으로 인한 약간의 신경 장해’란 추간판탈출증이 확인되고 신경생리검사에서 명확한 신경근 병증의 소견이 지속되는 경우\n\n7. 체간골의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 어깨뼈(견갑골)나 골반뼈(장골, 제2천추 이하의 천골, 미골, 좌골 포함)에 뚜렷한 기형을 남긴 때\n2) 빗장뼈(쇄골), 가슴뼈(흉골), 갈비뼈(늑골)에 뚜렷한 기형을 남긴 때\n나. 장해판정 기준\n1) ‘체간골’이라 함은 어깨뼈(견갑골), 골반뼈(장골, 제2천추 이하의 천골, 미골, 좌골 포함), 빗장뼈(쇄골), 가슴뼈(흉골), 갈비뼈(늑골)를 말하며 이를\n모두 동일한 부위로 봅니다.\n2) ‘골반뼈의 뚜렷한 기형’이라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 천장관절 또는 치골문합부가 분리된 상태로 치유되었거나 좌골이 2.5cm 이상 분리된 부정유합 상태\n나) 육안으로 변형(결손을 포함)을 명백하게 알 수 있을 정도로 방사선 검사로 측정한 각(角) 변형이 20° 이상인 경우\n다) 미골의 기형은 골절이나 탈구로 방사선 검사로 측정한 각(角) 변형이 70° 이상 남은 상태\n3) ‘빗장뼈(쇄골), 가슴뼈(흉골), 갈비뼈(늑골), 어깨뼈(견갑골)에 뚜렷한 기형이 남은 때’라 함은 방사선 검사로 측정한 각(角) 변형이 20° 이상인 경우\n를 말합니다.\n4) 갈비뼈(늑골)의 기형은 그 개수와 정도, 부위 등에 관계없이 전체를 일괄하여 하나의 장해로 취급합니다. 다발성 늑골 기형의 경우 각각의 각(角)\n변형을 합산하지 않고 그중 가장 높은 각(角) 변형을 기준으로 평가합니다.\n\n< 가슴뼈 >\n\n< 골반뼈 >\n\n8. 팔의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 두 팔의 손목 이상을 잃었을 때\n2) 한 팔의 손목 이상을 잃었을 때\n3) 한 팔의 3대 관절 중 관절 하나의 기능을 완전히 잃었을 때\n4) 한 팔의 3대 관절 중 관절 하나의 기능에 심한 장해를 남긴 때\n5) 한 팔의 3대 관절 중 관절 하나의 기능에 뚜렷한 장해를 남긴 때\n6) 한 팔의 3대 관절 중 관절 하나의 기능에 약간의 장해를 남긴 때\n7) 한 팔에 가관절이 남아 뚜렷한 장해를 남긴 때\n8) 한 팔에 가관절이 남아 약간의 장해를 남긴 때\n9) 한 팔의 뼈에 기형을 남긴 때\n나. 장해판정 기준\n1) 골절부에 금속 내고정물 등을 사용하였기 때문에 그것이 기능장해의 원인이 되는 때에는 그 내고정물 등이 제거된 후 장해를 평가합니다. 단, 제거\n가 불가능한 경우에는 고정물 등이 있는 상태에서 장해를 평가합니다.\n2) 관절을 사용하지 않아 발생한 일시적인 기능장해(예를 들면 캐스트로 환부를 고정시켰기 때문에 치유 후의 관절에 기능장해가 발생한 경우)는  장\n해로 평가하지 않습니다.\n3) ‘팔’이라 함은 어깨관절(견관절)부터 손목 관절(완관절)까지를 말합니다.\n4) ‘팔의 3대 관절’이라 함은 어깨관절(견관절), 팔꿈치 관절(주관절), 손목 관절(완관절)을 말합니다.\n5) ‘한 팔의 손목 이상을 잃었을 때’라 함은 손목 관절(완관절)부터(손목 관절 포함) 심장에 가까운 쪽에서 절단된 때를 말하며, 팔꿈치 관절(주관절)\n상부에서 절단된 경우도 포함합니다.\n6) 팔의 관절 기능장해 평가는 팔의 3대 관절의 관절운동 범위 제한 등으로 평가합니다.\n가) 각 관절의 운동 범위 측정은 장해 평가 시점의 ｢산업재해보상보험법 시행규칙｣ 제47조 제1항 및 제3항의 정상인의 신체 각 관절에 대한 평균\n운동 가능 영역을 기준으로 정상 각도 및 측정 방법 등을 따릅니다.\n나) 관절 기능장해를 표시할 경우 장해부위의 장해각도와 정상부위의 측정치를 동시에 판단하여 장해상태를 명확히 합니다. 단, 관절 기능장해가\n신경 손상으로 인한 경우에는 운동 범위 측정이 아닌 근력 및 근전도 검사를 기준으로 평가합니다.\n7) ‘관절 하나의 기능을 완전히 잃었을 때’라 함은 아래의 경우 중 하나에 해당하는 경우를 말합니다.\n가) 완전 강직(관절굳음)\n나) 근전도 검사상 완전 손상(complete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘0등급(zero)’인 경우\n\n8) ‘관절 하나의 기능에 심한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 경우를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 1/4 이하로 제한된 경우\n나) 인공관절이나 인공골두를 삽입한 경우\n다) 근전도 검사상 완전 손상(complete injury)소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘1등급(trace)’인 경우\n9) ‘관절 하나의 기능에 뚜렷한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 경우를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 1/2 이하로 제한된 경우\n나) 근전도 검사상 불완전한 손상(incomplete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘2등급(poor)’인 경우\n10) ‘관절 하나의 기능에 약간의 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 3/4 이하로 제한된 경우\n나) 근전도 검사상 불완전한 손상(incomplete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘3등급(fair)’인 경우\n11) ‘가관절주)이 남아 뚜렷한 장해를 남긴 때’라 함은 상완골에 가관절이 남은 경우 또는 요골과 척골의 2개 뼈 모두에 가관절이 남은 경우를 말합니\n다.\n※ 주) 가관절이란, 충분한 경과 및 골이식술 등 골유합을 얻는데 필요한 수술적 치료를 시행하였음에도 불구하고 골절부의 유합이 이루어지지 않\n는 ‘불유합’ 상태를 말하며, 골유합이 지연되는 지연유합은 제외합니다.\n12) ‘가관절이 남아 약간의 장해를 남긴 때’라 함은 요골과 척골 중 어느 한 뼈에 가관절이 남은 경우를 말합니다.\n13) ‘뼈에 기형을 남긴 때’라 함은 상완골 또는 요골과 척골에 변형이 남아 정상에 비해 부정유합된 각 변형이 15° 이상인 경우를 말합니다.\n다. 지급률의 결정\n1) 한 팔의 3대 관절 중 관절 하나에 기능장해가 생기고 다른 관절 하나에 기능장해가 발생한 경우 지급률은 각각 적용하여 합산합니다.\n2) 1상지(팔과 손가락)의 장해지급률은 원칙적으로 각각 합산하되, 지급률은 60% 한도로 합니다.\n\n9. 다리의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 두 다리의 발목 이상을 잃었을 때\n2) 한 다리의 발목 이상을 잃었을 때\n3) 한 다리의 3대 관절 중 관절 하나의 기능을 완전히 잃었을 때\n4) 한 다리의 3대 관절 중 관절 하나의 기능에 심한 장해를 남긴 때\n5) 한 다리의 3대 관절 중 관절 하나의 기능에 뚜렷한 장해를 남긴 때\n6) 한 다리의 3대 관절 중 관절 하나의 기능에 약간의 장해를 남긴 때\n7) 한 다리에 가관절이 남아 뚜렷한 장해를 남긴 때\n8) 한 다리에 가관절이 남아 약간의 장해를 남긴 때\n9) 한 다리의 뼈에 기형을 남긴 때\n10) 한 다리가 5cm 이상 짧아지거나 길어진 때\n11) 한 다리가 3cm 이상 짧아지거나 길어진 때\n12) 한 다리가 1cm 이상 짧아지거나 길어진 때\n나. 장해판정 기준\n1) 골절부에 금속 내고정물 등을 사용하였기 때문에 그것이 기능장해의 원인이 되는 때에는 그 내고정물 등이 제거된 후 장해를 평가합니다. 단, 제거\n가 불가능한 경우에는 고정물 등이 있는 상태에서 장해를 평가합니다.\n2) 관절을 사용하지 않아 발생한 일시적인 기능장해(예를 들면 캐스트로 환부를 고정시켰기 때문에 치유 후의 관절에 기능장해가 발생한 경우)는 장\n해로 평가하지 않습니다.\n3) ‘다리’라 함은 엉덩이 관절(고관절)부터 발목관절(족관절)까지를 말합니다.\n4) ‘다리의 3대 관절’이라 함은 엉덩이 관절(고관절), 무릎관절(슬관절), 발목관절(족관절)을 말합니다.\n5) ‘한 다리의 발목 이상을 잃었을 때’라 함은 발목관절(족관절)부터(발목관절 포함) 심장에 가까운 쪽에서 절단된 때를 말하며, 무릎관절(슬관절)의 상부에\n서 절단된 경우도 포함합니다.\n6) 다리의 관절 기능장해 평가는 다리의 3대 관절의 관절운동 범위 제한 및 무릎관절(슬관절)의 동요성 등으로 평가합니다.\n가) 각 관절의 운동 범위 측정은 장해 평가 시점의 ｢산업재해보상보험법 시행규칙｣ 제47조 제1항 및 제3항의 정상인의 신체 각 관절에 대한 평균\n운동 가능 영역을 기준으로 정상 각도 및 측정 방법 등을 따릅니다.\n나) 관절 기능장해가 신경 손상으로 인한 경우에는 운동 범위 측정이 아닌 근력 및 근전도 검사를 기준으로 평가합니다.\n\n7) ‘관절 하나의 기능을 완전히 잃었을 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 완전 강직(관절굳음)\n나) 근전도 검사상 완전 손상(complete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘0등급(zero)’인 경우\n8) ‘관절 하나의 기능에 심한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 1/4 이하로 제한된 경우\n나) 인공관절이나 인공골두를 삽입한 경우\n다) 객관적 검사(스트레스 엑스선)상 15mm 이상의 동요관절(관절이 흔들리거나 움직이는 것)이 있는 경우\n라) 근전도 검사상 완전 손상(complete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘1등급(trace)’인 경우\n9) ‘관절 하나의 기능에 뚜렷한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 1/2 이하로 제한된 경우\n나) 객관적 검사(스트레스 엑스선)상 10mm 이상의 동요관절(관절이 흔들리거나 움직이는 것)이 있는 경우\n다) 근전도 검사상 불완전한 손상(incomplete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘2등급(poor)’인 경우\n10) ‘관절 하나의 기능에 약간의 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 해당 관절의 운동 범위 합계가 정상 운동 범위의 3/4 이하로 제한된 경우\n나) 객관적 검사(스트레스 엑스선)상 5mm 이상의 동요관절(관절이 흔들리거나 움직이는 것)이 있는 경우\n다) 근전도 검사상 불완전한 손상(incomplete injury) 소견이 있으면서 도수근력 검사(MMT)에서 근력이 ‘3등급(fair)’인 경우\n11) 동요 장해 평가 시에는 정상 측과 환 측을 비교하여 증가된 수치로 평가합니다.\n12) ‘가관절주)이 남아 뚜렷한 장해를 남긴 때’라 함은 대퇴골에 가관절이 남은 경우 또는 경골과 종아리뼈의 2개 뼈 모두에 가관절이 남은 경우를 말합니다.\n\n※ 주) 가관절이란, 충분한 경과 및 골이식술 등 골유합을 얻는데 필요한 수술적 치료를 시행하였음에도 불구하고 골절부의 유합이 이루어지지 않\n는 ‘불유합’ 상태를 말하며, 골유합이 지연되는 지연유합은 제외합니다.\n13) ‘가관절이 남아 약간의 장해를 남긴 때’라 함은 경골과 종아리뼈 중 어느 한 뼈에 가관절이 남은 경우를 말합니다.\n14) ‘뼈에 기형을 남긴 때’라 함은 대퇴골 또는 경골에 기형이 남아 정상에 비해 부정유합된 각 변형이 15° 이상인 경우를 말합니다.\n15) 다리 길이의 단축 또는 과신장은 스캐노그램(scanogram)을 통하여 측정합니다.\n\n다. 지급률의 결정\n1) 한 다리의 3대 관절 중 관절 하나에 기능장해가 생기고 다른 관절 하나에 기능장해가 발생한 경우 지급률은 각각 적용하여 합산합니다.\n2) 1하지(다리와 발가락)의 장해지급률은 원칙적으로 각각 합산하되, 지급률은 60% 한도로 합니다.\n\n10. 손가락의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 한 손의 5개 손가락을 모두 잃었을 때\n2) 한 손의 첫째 손가락을 잃었을 때\n3) 한 손의 첫째 손가락 이외의 손가락을 잃었을 때(손가락 하나마다)\n4) 한 손의 5개 손가락 모두의 손가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때\n5) 한 손의 첫째 손가락의 손가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때\n6) 한 손의 첫째 손가락 이외의 손가락의 손가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때(손가락 하나마다)\n나. 장해판정 기준\n1) 골절부에 금속 내고정물 등을 사용하였기 때문에 그것이 기능장해의 원인이 되는 때에는 그 내고정물 등이 제거된 후에 장해를 평가합니다. 단, 제\n거가 불가능한 경우에는 고정물 등이 있는 상태에서 장해를 평가합니다.\n2) 관절을 사용하지 않아 발생한 일시적인 기능장해(예를 들면 캐스트로 환부를 고정시켰기 때문에 치유 후의 관절에 기능장해가 발생한  경우)는 장\n해로 평가하지 않습니다.\n3) 손가락에는 첫째 손가락에 2개의 손가락 관절이 있습니다. 그중 심장에서 가까운 쪽부터 중수지 관절, 지관절이라 합니다.\n4) 다른 네 손가락에는 3개의 손가락 관절이 있습니다. 그중 심장에서 가까운 쪽부터 중수지 관절, 제1지관절(근위지관절) 및 제2지관절(원위지관절)\n이라 부릅니다.\n5) ‘손가락을 잃었을 때’라 함은 첫째 손가락에서는 지관절부터 심장에서 가까운 쪽에서, 다른 네 손가락에서는 제1지관절(근위지관절)부터(제1지관\n절 포함) 심장에서 가까운 쪽으로 손가락이 절단되었을 때를 말합니다.\n6) ‘손가락뼈 일부를 잃었을 때’라 함은 첫째 손가락의 지관절, 다른 네 손가락의 제1지관절(근위지관절)부터 심장에서 먼 쪽으로 손가락뼈의 일부가\n절단된 경우를 말하며, 뼈 단면이 불규칙해진 상태나 손가락 길이의 단축 없이 골편만 떨어진 상태는 해당하지 않습니다.\n7) ‘손가락에 뚜렷한 장해를 남긴 때’라 함은 첫째 손가락의 경우 중수지 관절 또는 지관절의 굴신(굽히고 펴기)운동영역이 정상 운동 가능 영역의\n1/2  이하인 경우를 말하며, 다른 네 손가락에서는 제1, 제2지관절의 굴신(굽히고 펴기)운동영역을 합산하여 정상운동영역의 1/2 이하이거나 중\n수지관절의 굴신(굽히고 펴기)운동영역이 정상운동영역의 1/2 이하인 경우를 말합니다.\n8) 한 손가락에 장해가 생기고 다른 손가락에 장해가 발생한 경우, 지급률은 각각 적용하여 합산합니다.\n9) 손가락의 관절 기능장해 평가는 손가락 관절의 관절운동 범위 제한 등으로 평가합니다. 각 관절의 운동 범위 측정은 장해 평가 시점의 ｢산업재해\n보상보험법 시행규칙｣ 제47조 제1항 및 제3항의 정상인의 신체 각 관절에 대한 평균 운동 가능 영역을 기준으로 정상 각도 및 측정 방법 등을 따\n릅니다.\n\n< 손가락 >\n\n11. 발가락의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 한 발의 리스프랑관절 이상을 잃었을 때\n2) 한 발의 5개 발가락을 모두 잃었을 때\n3) 한 발의 첫째 발가락을 잃었을 때\n4) 한 발의 첫째 발가락 이외의 발가락을 잃었을 때(발가락 하나마다)\n5) 한 발의 5개 발가락 모두의 발가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때\n6) 한 발의 첫째 발가락의 발가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때\n7) 한 발의 첫째 발가락 이외의 발가락의 발가락뼈 일부를 잃었을 때 또는 뚜렷한 장해를 남긴 때(발가락 하나마다)\n나. 장해판정 기준\n1) 골절부에 금속 내고정물 등을 사용하였기 때문에 그것이 기능장해의 원인이 되는 때에는 그 내고정물 등이 제거된 후에 장해를 평가합니다. 단, 제\n거가 불가능한 경우에는 고정물 등이 있는 상태에서 장해를 평가합니다.\n2) 관절을 사용하지 않아 발생한 일시적인 기능장해(예를 들면 캐스트로 환부를 고정시켰기 때문에 치유 후의 관절에 기능장해가 발생한  경우)는 장\n해로 평가하지 않습니다.\n3) ‘발가락을 잃었을 때’라 함은 첫째 발가락에서는 지관절부터 심장에 가까운 쪽을, 나머지 네 발가락에서는 제1지관절(근위지관절)부터(제1지관절\n포함) 심장에서 가까운 쪽을 잃었을 때를 말합니다.\n4) 리스프랑 관절 이상에서 잃은 때라 함은 족근-중족골 간 관절 이상에서 절단된 경우를 말합니다.\n5) ‘발가락뼈 일부를 잃었을 때’라 함은 첫째 발가락에서는 지관절, 다른 네 발가락에서는 제1지관절(근위지관절)부터 심장에서 먼 쪽으로 발가락뼈\n일부가 절단된 경우를 말하며, 뼈 단면이 불규칙해진 상태나 발가락 길이의 단축 없이 골편만 떨어진 상태는 해당하지 않습니다.\n6) ‘발가락에 뚜렷한 장해를 남긴 때’라 함은 첫째 발가락의 경우에 중족 지관절과 지관절의 굴신(굽히고 펴기)운동 범위 합계가 정상 운동 가능 영역\n의 1/2 이하가 된 경우를 말하며, 다른 네 발가락에 있어서는 중족지관절의 신전운동범위만을 평가하여 정상운동범위의 1/2이하로 제한된 경우\n를 말합니다.\n7) 한 발가락에 장해가 생기고 다른 발가락에 장해가 발생한 경우, 지급률은 각각 적용하여 합산합니다.\n8) 발가락 관절의 운동 범위 측정은 장해 평가 시점의 ｢산업재해보상보험법 시행규칙｣ 제47조 제1항 및 제3항의 정상인의 신체 각 관절에 대한 평균\n운동 가능 영역을 기준으로 정상 각도 및 측정 방법 등을 따릅니다.\n\n< 발가락 >\n\n12. 흉·복부장기 및 비뇨생식기의 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 심장 기능을 잃었을 때\n2) 흉복부장기 또는 비뇨생식기 기능을 잃었을 때\n3) 흉복부장기 또는 비뇨생식기 기능에 심한 장해를 남긴 때\n4) 흉복부장기 또는 비뇨생식기 기능에 뚜렷한 장해를 남긴 때\n5) 흉복부장기 또는 비뇨생식기 기능에 약간의 장해를 남긴 때\n나. 장해의 판정 기준\n1) ‘심장 기능을 잃었을 때’라 함은 심장 이식을 한 경우를 말합니다.\n2) ‘흉복부장기 또는 비뇨생식기 기능을 잃었을 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 폐, 신장, 또는 간장의 장기이식을 한 경우\n나) 장기이식을 하지 않고서는 생명유지가 불가능하여 혈액투석, 복막투석 등 의료처치를 평생토록 받아야 할 때\n다) 방광의 저장기능과 배뇨기능을 완전히 상실한 때\n3) ‘흉복부장기 또는 비뇨생식기 기능에 심한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 위, 대장(결장∼직장) 또는 췌장, 전부를 잘라내었을 때\n나) 소장을 3/4 이상 잘라내었을 때 또는 잘라낸 소장의 길이가 3m 이상일 때\n다) 간장의 3/4 이상을 잘라내었을 때\n라) 양쪽 고환 또는 양쪽 난소를 모두 잃었을 때\n4) ‘흉복부장기 또는 비뇨생식기 기능에 뚜렷한 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 한쪽 폐 또는 한쪽 신장을 전부 잘라내었을 때\n나) 방광 기능 상실로 영구적인 요도루, 방광루, 요관 장문합 상태\n다) 위, 췌장을 50% 이상 잘라내었을 때\n라) 대장 절제, 항문 괄약근 등의 기능장해로 영구적으로 장루, 인공항문을 설치한 경우(치료 과정에서 일시적으로 발생하는 경우는 제외)\n마) 심장기능 이상으로 인공심박동기를 영구적으로 삽입한 경우\n바) 요도 괄약근 등의 기능장해로 영구적으로 인공요도 괄약근을 설치한 경우\n\n5) ‘흉복부장기 또는 비뇨생식기 기능에 약간의 장해를 남긴 때’라 함은 아래의 경우 중 하나에 해당하는 때를 말합니다.\n가) 방광의 용량이 50cc 이하로 위축되었거나 요도협착, 배뇨기능 상실로 영구적인 간헐적 인공요도가 필요한 때\n나) 음경의 1/2 이상이 결손되었거나 질구 협착으로 성생활이 불가능한 때\n다) 폐 질환 또는 폐 부분 절제술 후 일상생활에서 호흡곤란으로 지속적인 산소치료가 필요하며, 폐기능 검사(PFT)상 폐환기 기능(1초간 노력성\n호기량, FEV1)이 정상 예측치의 40% 이하로 저하된 때\n6) 흉복부, 비뇨 생식기계 장해는 질병 또는 외상의 직접 결과로 인한 장해를 말하며, 노화에 의한 기능장해 또는 질병이나 외상이 없는 상태에서 예\n방적으로 장기를 절제, 적출한 경우는 장해로 보지 않습니다.\n7) 상기 흉복부 및 비뇨 생식기계 장해 항목에 명기되지 않은 기타 장해상태에 대해서는 ‘<붙임> 일상생활 기본동작(ADLs) 제한 장해 평가표’에 해\n당하는 장해가 있을 때 ADLs 장해지급률을 준용합니다.\n8) 상기 장해 항목에 해당되지 않는 장기간의 간병이 필요한 만성질환(만성 간질환, 만성폐쇄성 폐질환 등)은 장해의 평가 대상으로 인정하지 않습니\n다.\n\n13. 신경계·정신행동 장해\n가. 장해의 분류\n장해의 분류\n지급률\n1) 신경계에 장해가 남아 일상생활 기본동작에 제한을 남긴 때\n2) 정신행동에 극심한 장해를 남긴 때\n3) 정신행동에 심한 장해를 남긴 때\n4) 정신행동에 뚜렷한 장해를 남긴 때\n5) 정신행동에 약간의 장해를 남긴 때\n6) 정신행동에 경미한 장해를 남긴 때\n7) 극심한 치매 : CDR 척도 5점\n8) 심한 치매 : CDR 척도 4점\n9) 뚜렷한 치매 : CDR 척도 3점\n10) 약간의 치매 : CDR 척도 2점\n11) 심한 간질발작이 남았을 때\n12) 뚜렷한 간질발작이 남았을 때\n13) 약간의 간질발작이 남았을 때\n10∼100\n나. 장해판정 기준\n1) 신경계\n가) ‘신경계에 장해를 남긴 때’라 함은 뇌, 척수 및 말초신경계 손상으로 ‘<붙임> 일상생활 기본동작(ADLs) 제한 장해 평가표’의 5가지 기본동작 중\n하나 이상의 동작이 제한되었을 때를 말합니다.\n나) 위 가)의 경우 ‘<붙임> 일상생활 기본동작(ADLs) 제한 장해 평가표’ 상 지급률이 10% 미만인 경우에는 보장 대상이 되는 장해로 인정하지 않\n습니다.\n다) 신경계의 장해로 발생하는 다른 신체 부위의 장해(눈, 귀, 코, 팔, 다리 등)는 해당 장해로도 평가하고 그중 높은 지급률을 적용합니다.\n라) 뇌졸중, 뇌손상, 척수 및 신경계의 질환 등은 발병 또는 외상 후 12개월 동안 지속적으로 치료한 후에 장해를 평가합니다. 그러나, 12개월이 지\n났다고 하더라도 뚜렷하게 기능 향상이 진행되고 있는 경우 또는 단기간 내에 사망이 예상되는 경우는 6개월의 범위에서 장해 평가를 유보합니\n다.\n마) 장해 진단 전문의는 재활의학과, 신경외과 또는 신경과 전문의로 합니다.\n2) 정신행동\n가) 정신행동 장해는 보험기간 중에 발생한 뇌의 질병 또는 상해를 입은 후 18개월이 지난 후에 판정함을 원칙으로 합니다. 다만, 질병 발생 또는\n상해를 입은 후 의식상실이 1개월 이상 지속된 경우에는 질병 발생 또는 상해를 입은 후 12개월이 지난 후에 판정할 수 있습니다.\n나) 정신행동 장해는 장해판정 직전 1년 이상 충분한 정신건강의학과의 전문적 치료를 받은 후 치료에도 불구하고 장해가 고착되었을 때 판정하여\n야 하며, 그렇지 않은 경우에는 그로 인하여 고정되거나 중하게 된 장해에 대해서는 인정하지 않습니다.\n다) ‘정신행동에 극심한 장해를 남긴 때’라 함은 장해판정 직전 1년 이상 지속적인 정신건강의학과의 치료를 받았으며 GAF 30점 이하인 상태를\n말합니다.\n라) ‘정신행동에 심한 장해를 남긴 때’라 함은 장해판정 직전 1년 이상 지속적인 정신건강의학과의 치료를 받았으며 GAF 40점 이하인 상태를 말\n합니다.\n\n마) ‘정신행동에 뚜렷한 장해를 남긴 때’라 함은 장해판정 직전 1년 이상 지속적인 정신건강의학과의 치료를 받았으며, 보건복지부 고시 「장애정도\n판정 기준」의 ‘능력 장애측정 기준’주)상 6개 항목 중 3항목 이상에서 독립적 수행이 불가능하여 타인의 도움이 필요하고 GAF 50점 이하인 상\n태를 말합니다.\n※ 주) 능력 장애측정 기준의 항목 : ㉮ 적절한 음식 섭취, ㉯ 대소변 관리, 세면, 목욕, 청소 등의 청결 유지, ㉰ 적절한 대화기술 및 협조적인 대인관\n계, ㉱ 규칙적인 통원·약물 복용, ㉲ 소지품 및 금전관리나 적절한 구매행위, ㉳ 대중교통이나 일반 공공시설의 이용\n바) ‘정신행동에 약간의 장해를 남긴 때’라 함은 장해판정 직전 1년 이상 지속적인 정신건강의학과의 치료를 받았으며, 보건복지부 고시 「장애정도\n판정 기준」의 ‘능력 장애측정 기준’상 6개 항목 중 2항목 이상에서 독립적 수행이 불가능하여 타인의 도움이 필요하고 GAF 60점 이하인 상태\n를 말합니다.\n사) ‘정신행동에 경미한 장해를 남긴 때’라 함은 장해판정 직전 1년 이상 지속적인 정신건강의학과의 치료를 받았으며, 보건복지부 고시 「장애정도\n판정 기준」의 ‘능력 장애측정 기준’상 6개 항목 중 2항목 이상에서 독립적 수행이 불가능하여 타인의 도움이 필요하고 GAF 70점 이하인 상태\n를 말합니다.\n아) 지속적인 정신건강의학과의 치료란 3개월 이상 약물치료가 중단되지 않았음을 의미합니다.\n자) 심리학적 평가 보고서는 정신건강의학과 의료기관에서 실시돼야 하며, 자격을 갖춘 임상심리전문가가 시행하고 작성하여야 합니다.\n차) 정신행동 장해 진단 전문의는 정신건강의학과 전문의를 말합니다.\n카) 정신행동 장해는 뇌의 기능 및 결손을 입증할 수 있는 뇌 자기공명촬영, 뇌전산화 촬영, 뇌파 등 객관적 근거를 기초로 평가합니다. 다만, 보호\n자나 환자의 진술, 감정의의 추정 혹은 인정, 한국 표준화가 이루어지지 않고 신빙성이 적은 검사들(뇌 SPECT 등)은 객관적 근거로 인정하지\n않습니다.\n타) 각종 기질성 정신 장해와 외상 후 간질에 한하여 보상합니다.\n파) 외상 후 스트레스 장애, 우울증(반응성) 등의 질환, 정신분열증(조현병), 편집증, 조울증(양극성 장애), 불안장애, 전환장애, 공포장애, 강박장애\n등 각종 신경증 및 각종 인격장애는 보상의 대상이 되지 않습니다.\n3) 치매\n가) ‘치매’라 함은 정상적으로 성숙한 뇌가 질병이나 외상 후 기질성 손상으로 파괴되어 한번 획득한 지적기능이 지속적 또는 전반적으로 저하되는\n것을 말합니다.\n나) 치매의 장해 평가는 임상적인 증상뿐 아니라 뇌영상검사(CT 및 MRI, SPECT 등)를 기초로 진단돼야 하며, 18개월 이상 지속적인 치료 후 평\n가합니다. 다만, 진단 시점에 이미 극심한 치매 또는 심한 치매로 진행된 경우에는 6개월간 지속적인 치료 후 평가합니다.\n다) 치매의 장해평가는 전문의(정신건강의학과, 신경과)에 의한 임상 치매 척도(한국판 Expanded Clinical Dementia Rating) 검사 결과에 따릅\n니다.\n4) 뇌전증(간질)\n가) ‘뇌전증(간질)’이라 함은 돌발적 뇌파 이상을 나타내는 뇌질환으로 발작(경련, 의식 장해 등)을 반복하는 것을 말합니다.\n나) 간질발작의 빈도 및 양상은 지속적인 항간질제(항전간제) 약물로도 조절되지 않는 간질을 말하며, 진료기록에 기재되어 객관적으로 확인되는\n간질발작의 빈도 및 양상을 기준으로 합니다.\n다) ‘심한 간질발작’이라 함은 월 8회 이상의 중증 발작이 연 6개월 이상의 기간에 걸쳐 발생하고, 발작할 때 유발된 호흡 장애, 흡인성 폐렴, 심한\n탈진, 구역질, 두통, 인지 장해 등으로 요양관리가 필요한 상태를 말합니다.\n라) ‘뚜렷한 간질발작’이라 함은 월 5회 이상의 중증 발작 또는 월 10회 이상의 경증 발작이 연 6개월 이상의 기간에 걸쳐 발생하는 상태를 말합니\n다.\n마) ‘약간의 간질발작’이라 함은 월 1회 이상의 중증 발작 또는 월 2회 이상의 경증 발작이 연 6개월 이상의 기간에 걸쳐 발생하는 상태를 말합니다.\n바) ‘중증 발작’이라 함은 전신경련을 동반하는 발작으로서 신체의 균형을 유지하지 못하고 쓰러지는 발작 또는 의식 장해가 3분 이상 지속되는 발\n작을 말합니다.\n사) ‘경증 발작’이라 함은 운동 장해가 발생하나 스스로 신체의 균형을 유지할 수 있는 발작 또는 3분 이내에 정상으로 회복되는 발작을 말합니다.\n\n붙임\n일상생활 기본동작(ADLs) 제한 장해 평가표\n\n유형\n제한 정도에 따른 지급률\n이동동작\n- 특별한 보조기구를 사용함에도 불구하고 다른 사람의 계속적인 도움이 없이는 방 밖을 나올 수 없는 상태 또는 침대에서\n휠체어로 옮기기를 포함하여 휠체어 이동 시 다른 사람의 계속적인 도움이 필요한 상태(40%)\n- 휠체어 또는 다른 사람의 도움 없이는 방 밖을 나올 수 없는 상태 또는 보행이 불가능하나 스스로 휠체어를 밀어 이동이\n가능한 상태(30%)\n- 목발 또는 보행기(walker)를 사용하지 않으면 독립적인 보행이 불가능한 상태(20%)\n- 보조기구 없이 독립적인 보행은 가능하나 파행(절뚝거림)이 있으며, 난간을 잡지 않고는 계단을 오르내리기가 불가능한\n상태 또는 계속하여 평지에서 100m 이상을 걷지 못하는 상태(10%)\n음식물 섭취\n- 입으로 식사를 전혀 할 수 없어 계속적으로 튜브(비위관 또는 위루관)나 경정맥 수액을 통해 부분 혹은 전적인 영양공급을\n받는 상태(20%)\n- 수저 사용이 불가능하여 다른 사람의 계속적인 도움이 없이는 식사를 전혀 할 수 없는 상태(15%)\n- 숟가락 사용은 가능하나 젓가락 사용이 불가능하여 음식물 섭취에 있어 부분적으로 다른 사람의 도움이 필요한 상태\n(10%)\n- 독립적인 음식물 섭취는 가능하나 젓가락을 이용하여 생선을 바르거나 음식물을 자르지는 못하는 상태(5%)\n배변\n배뇨\n- 배설을 돕기 위해 설치한 의료장치나 외과적 시술물을 사용함에 있어 타인의 계속적인 도움이 필요한 상태 또는 지속적\n인 유치도뇨관 삽입 상태, 방광루, 요도루, 장루상태(20%)\n- 화장실에 가서 변기 위에 앉는 일(요강을 사용하는 일 포함)과 대소변 후에 뒤처리시 다른 사람의 계속적인 도움이 필요한\n상태 또는 간헐적으로 자가 인공 도뇨가 가능한 상태(CIC), 기저귀를 이용한 배뇨, 배변 상태(15%)\n- 화장실에 가는 일, 배변, 배뇨는 독립적으로 가능하나 대소변 후 뒤처리에 있어 다른 사람의 도움이 필요한 상태(10%)\n- 빈번하고 불규칙한 배변으로 인해 2시간 이상 계속되는 업무를 수행하는 것이 어려운 상태 또는 배변, 배뇨는 독립적으로\n가능하나 요실금, 변실금이 있는 때(5%)\n목욕\n- 세안, 양치, 샤워, 목욕 등 모든 개인위생 관리시 타인의 지속적인 도움이 필요한 상태(10%)\n- 세안, 양치시 부분적인 도움 하에 혼자서 가능하나 목욕이나 샤워시 타인의 도움이 필요한 상태(5%)\n- 세안, 양치와 같은 개인위생관리를 독립적으로 시행 가능하나 목욕이나 샤워시 부분적으로 타인의 도움이 필요한 상태\n(3%)\n옷 입고 벗기\n- 상, 하의 의복 착탈시 다른 사람의 계속적인 도움이 필요한 상태(10%)\n- 상, 하의 의복 착탈시 부분적으로 다른 사람의 도움이 필요한 상태 또는 t": "삼성유니버설종신보험(2504)(무배당,보증비용부과형)", "product_type": "종신보험", "title": "용어의 정의", "chapter": "제1관 약관의 적용 및 용어의 정의", "text": "이 계약에서 사용되는 용어의 정의는, 이 계약의 다른 조항에서 달리 정의되지 않는 한 다음과 같습니다.\n1. 기본보험료\n계약자가 적립형 계약으로 전환 시 매월 계속 납입하기로 한 월납보험료를 말합니다. 다만, 납입보험료 중 「해당\n월까지 납입하기로 약정한 기본보험료 총액」과 「당해 보험료 납입직전까지 납입된 기본보험료 합계액」의 차액은\n기본보험료로 합니다.\n2. 추가납입보험료\n계약자가 전환일 이후 1개월이 지난 후부터 보험료 납입기간 중 기본보험료의 납입주기와 달리 수시로 납입할 수\n있는 보험료로서 납입보험료 중 기본보험료(특약보험료 포함)의 초과부분을 말합니다.\n3. 보험료 납입한도\n가. 기본보험료와 추가납입보험료를 합하여 보험기간 중 납입할 수 있는 보험료 총납입한도는 기본보험료 총액의\n300%이내로 하고, 경과기간에 따라 1회 납입 가능한 납입보험료 한도는 시중금리 등 금융환경에 따라 아래\n에서 정한 한도 내에서 계산합니다.\n·1회 납입 가능한 납입보험료 한도\n= 월납 기본보험료의 300% ×전환 후 경과월수\n- 이미 납입한 기본보험료 및 추가납입보험료의 합계\n단, 특약보험료는 보험료 납입한도에서 제외합니다.\n나. ‘가’목에서 시중금리에 따라 보험료의 1회 납입한도를 축소하는 경우는 국고채수익률이 이 적립형 계약의 공\n시이율의 최저보증이율(연복리 0.5%)이하로 하락하여 3개월 이상 계속 하회하는 경우에 한합니다. 단, 국고\n채수익률은 한국금융투자협회가 매일 공시하는 5년만기 국고채권의 최종호가수익률로 합니다.\n다. ‘가’목의 전환 후 경과월수는 전환 시를 1개월로 하며, 보험료 납입기간을 최고한도로 합니다.\n4. 월대체보험료\n가. 해당 월의 위험보험료, 계약관리비용 중 유지관련비용 및 특약보험료의 합계액을 말하며, 보험기간 중 매\n월 월계약해당일에 해약환급금에서 공제합니다.\n여기서 \"특약보험료\"는 계약관리비용 중 기타비용을 제외한 금액으로 보험료의 납입이 면제된 특약의 보험료는\n제외하며, 월대체보험료를 공제하는 \"해약환급금\"은 보험계약대출의 원금과 이자를 차감한 금액으로 특약의 해\n약환급금은 제외된 금액입니다.\n설명\n<월납계약 월대체보험료 공제 예시>\n예1) 전환일 : 8월 15일, 보험료 납입일 : 매월 20일\n→ 기간에 상관없이 매월 15일 월대체보험료 공제\n예2) 전환일 : 8월 15일, 보험료 납입일 : 매월 10일\n→ 기간에 상관없이 매월 15일 월대체보험료 공제\n나. 추가납입보험료의 계약관리비용 등은 보험료를 납입시에 공제합니다.\n\n5. 이미 납입한 보험료\n적립형 계약에서 이미 납입한 보험료라 함은 계약자가 적립형 계약으로 전환 후 납입한 기본보험료(특약보험료\n포함) 및 추가납입보험료의 합계액에 전환일 당시 보장형 계약의 전환신청 보험가입금액에 해당하는 계약자적립\n액을 더한 금액을 말합니다. 여기서 \"보장형 계약의 전환신청 보험가입금액에 해당하는 계약자적립액\"은 보험계\n약대출의 원금과 이자를 차감한 금액으로 특약의 계약자적립액은 제외된 금액입니다.\n다만, 전환 후 계약자적립액에서 특약보험료(계약관리비용 중 기타비용 제외)를 공제하거나 중도인출이 있었을\n경우 그 공제된 특약보험료 및 인출금액의 합계는 이미 납입한 보험료에서 차감하며, 계약자가 보험가입금액을\n감액할 경우 이미 납입한 보험료는 제8조(계약내용의 변경 등) 제4항에 따라 계산된 이미 납입한 보험료와 해당\n감액 이후 납입된 보험료의 합계를 말합니다.\n6. 계약자적립액\n「계약자적립액」이란 적립형 계약으로 전환 후 납입한 기본보험료(특약보험료 포함) 및 추가납입보험료의 합계액\n에 전환일 당시 보장형 계약의 전환신청 보험가입금액에 해당하는 계약자적립액을 더한 금액에서 월대체보험료\n및 중도인출금액 등을 공제한 금액을 적립형 계약의 공시이율로 일자계산에 따라 적립한 금액을 말하며, 세부적\n인 내용은 산출방법서에서 정한 방법에 따릅니다. 여기서 \"보장형 계약의 전환신청 보험가입금액에 해당하는 계\n약자적립액\"은 보험계약대출의 원금과 이자를 차감한 금액으로 특약의 계약자적립액은 제외된 금액입니다.\n용어\n해설\n<산출방법서>\n\"보험료 및 해약환급금 산출방법서\"로서 이 보험의 보험료, 계약자적립액, 해약환급금 등이 적정하\n게 계산될 수 있도록 산출기초율(적용이율, 계약체결비용, 계약관리비용, 위험률 등)을 사용하여 계\n산한 방법을 기재한 기초서류를 말하며, 이하 같습니다.\n7. 월계약해당일\n전환일부터 1 개월마다 돌아오는 매월의 계약해당일을 말합니다. 다만, 해당 월의 계약해당일이 없는 경우에는\n해당 월의 마지막 날을 월계약해당일로 합니다.\n설명\n<해당 월의 계약해당일이 없는 경우 예시>\n전환일이 2021 년 1 월 29 일인 경우 돌아오는 월의 월계약해당일은 2021 년 2 월 28 일입니다.", "keywords": ["용어의 정의", "보험료 납입", "해약환급금", "계약자적립액", "중도인출", "공시이율", "보험계약대출", "보험가입금액", "계약내용의 변경", "감액"], "query_aliases": ["용어의 정의는 어떻게 되나요", "종신보험에서 용어의 정의에 대해 알려주세요"]}, {"company": "삼성생명", "product": "삼성유니버설종신보험(2504)(무배당,보증비용부과형)", "product_type": "종신보험", "title": "보험금의 지급사유", "chapter": "제2관 보험금의 지급", "text": "회사는 피보험자가 보험기간(종신) 중 사망하였을 경우에는 보험수익자에게 약정한 사망보험금(별표 “적립형 계약의\n보험금 지급기준표”참조)을 지급합니다.", "keywords": ["보험금의 지급사유", "사망보험금", "보험금 지급", "보험수익자", "피보험자"], "query_aliases": ["보험금의 지급사유는 어떻게 되나요", "종신보험에서 보험금의 지급사유에 대해 알려주세요", "보험금은 언제 지급되나요"]}, {"company": "삼성생명", "product": "삼성유니버설종신보험(2504)(무배당,보증비용부과형)", "product_type": "종신보험", "title": "보험금 지급에 관한 세부 규정", "chapter": "제2관 보험금의 지급", "text": "① 제3조(보험금의 지급사유)의 “사망”에는 보험기간에 다음 어느 하나의 사유가 발생한 경우를 포함합니다.\n1. 실종선고를 받은 경우: 법원에서 인정한 실종기간이 끝나는 때에 사망한 것으로 봅니다.\n용어\n해설\n<실종선고>\n어떤 사람의 생사불명 상태가 일정기간 이상 계속될 때 일정절차에 따라 법원이 사망한 것으로 인\n정하는 제도\n2. 관공서에서 수해, 화재나 그 밖의 재난을 조사하고 사망한 것으로 통보하는 경우: 가족관계등록부에 기재된 사망\n연월일을 기준으로 합니다.\n② 보험기간 중 「연명의료결정법」에 따른 연명의료를 받던 피보험자가 「연명의료결정법」에 따른 연명의료중단등결정\n및 그 이행으로 보험기간 중 사망하는 경우 피보험자가 실제 사망한 시점을 사망일로 보고 제3조(보험금의 지급사유)에\n서 정한 사망보험금을 지급합니다. 여기서 「연명의료결정법」이란 「호스피스∙완화의료 및 임종과정에 있는 환자의 연\n명의료 결정에 관한 법률」을 말합니다. 다만, 연명의료의 시행사유가 계약자, 피보험자 또는 보험수익자가 고의로 피보\n험자를 해친 결과인 경우에는 보장형 계약의 약관 제5조(보험금을 지급하지 않는 사유)를 따릅니다.\n\n③ 보험수익자와 회사가 제3조(보험금의 지급사유)의 보험금 지급사유에 대해 합의하지 못할 때는 보험수익자와 회사\n가 함께 제3자를 정하고 그 제3자의 의견에 따를 수 있습니다. 제3자는 의료법 제3조(의료기관)에 규정한 종합병원 소\n속 전문의 중에서 정하며, 보험금 지급사유 판정에 드는 의료비용은 회사가 전액 부담합니다.\n④ 제3조(보험금의 지급사유)
