<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>C.V · AI 답변 검증</title>
  <meta name="description" content="여러 AI의 판단 차이를 보여줘 사용자가 더 신중하게 판단하도록 돕습니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236d5df6' d='M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="대화 목록">
      <div class="sidebar-head">
        <div class="brand"><span class="brand-name">대화</span></div>
        <button class="icon-btn mobile-only" id="sidebarClose" aria-label="대화 목록 닫기">✕</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn">＋ 새 대화</button>
      <div class="chat-list-label">현재 세션</div>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main insurance-main">
    <header class="topbar insurance-topbar">
      <div class="brand">
        <button class="icon-btn mobile-only" id="sidebarOpen" aria-label="대화 목록 열기">☰</button>
        <span class="spark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z"/></svg>
        </span>
        <span class="brand-name">C.V</span>
      </div>
      <div class="topbar-actions">
        <span class="model-badge">보험 약관 검증 모드 <span class="badge" id="readinessBadge">확인 중</span></span>
        <button class="icon-btn theme-button" id="themeToggle" aria-label="화면 테마 전환">🌙</button>
      </div>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="big-spark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E8CFF"/><stop offset="0.55" stop-color="#8A5CF6"/><stop offset="1" stop-color="#C65CF6"/></linearGradient></defs>
            <path fill="url(#sparkGrad)" d="M12 2c.6 4.8 3.2 7.4 8 8-4.8.6-7.4 3.2-8 8-.6-4.8-3.2-7.4-8-8 4.8-.6 7.4-3.2 8-8z"/>
          </svg>
        </div>
        <p class="service-name">AI 답변 검증 도구 · C.V</p>
        <h1 class="greeting">하나의 AI 답변, 그대로 믿어도 될까요?</h1>
        <p class="greeting-sub">C.V는 AI에게 정답을 맡기는 서비스가 아니라, AI들의 판단 차이를 보여줘 사용자가 더 신중하게 판단하도록 돕는 서비스입니다.</p>
        <p class="domain-note">현재 검증 분야: 보험 약관</p>
        <div class="chips">
          <button class="chip" data-prompt="현재 등록된 약관 문서의 보험상품명을 알려주세요.">
            <strong>등록된 약관은 어떤 보험인가요?</strong>
            <span>보험상품명부터 확인하기</span>
          </button>
          <button class="chip" data-prompt="현재 등록된 약관을 기준으로 어떤 경우에 보험금을 받을 수 있는지 지급 사유와 조건을 근거 조항과 함께 알려주세요.">
            <strong>어떤 경우에 보험금을 받을 수 있나요?</strong>
            <span>지급 사유와 조건 확인하기</span>
          </button>
          <button class="chip" data-prompt="현재 등록된 약관을 기준으로 보험금을 지급하지 않는 경우와 그 예외를 근거 조항과 함께 알려주세요.">
            <strong>보험금을 받지 못하는 경우는 무엇인가요?</strong>
            <span>면책 사유와 예외 확인하기</span>
          </button>
        </div>
      </div>
      <div class="messages insurance-results" id="messages" aria-live="polite"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" maxlength="4000" placeholder="보험 약관에 관해 질문하세요…" aria-label="보험 질문 입력"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="분석 시작">
          <span class="ic-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
          <span class="ic-stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg></span>
        </button>
      </form>
      <p class="disclaimer">답변은 제공된 약관 근거에 한정됩니다. 실제 지급 여부와 법률 판단은 담당자 확인이 필요할 수 있습니다.</p>
    </div>
    </main>

    <aside class="source-drawer" id="sourceDrawer" aria-label="약관 근거" aria-hidden="true">
      <div class="source-drawer-head">
        <strong>약관 근거</strong>
        <button class="icon-btn" id="sourceDrawerClose" aria-label="근거 패널 닫기">✕</button>
      </div>
      <div id="sourceDrawerContent" class="source-drawer-content"></div>
    </aside>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
